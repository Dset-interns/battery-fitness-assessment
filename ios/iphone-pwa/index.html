<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1A33" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Battery Fitness" />
  <link rel="manifest" href="manifest.json" />
  <title>Battery Fitness Assessment · SAI</title>
  <style>
/* ============ 1. TOKENS ============ */
:root{
  --font:"Roboto Flex",Roboto,system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Devanagari","Kohinoor Devanagari",sans-serif;
  --font-num:"Roboto Condensed","sans-serif-condensed","Avenir Next Condensed","Arial Narrow",Roboto,system-ui,-apple-system,sans-serif;
  --bg:#F4F3EF;--surface:#FFFFFF;--surface-2:#EEEDE8;--sunken:#E6E4DE;
  --ink:#12161F;--ink-2:#454B57;--muted:#5E6471;--line:#E3E1DB;--line-strong:#8B909A;
  --hero:#0B1A33;--hero-2:#15294D;--on-hero:#FFFFFF;--on-hero-2:#BAC5DA;--hero-line:rgba(255,255,255,.14);
  --primary:#1D3FA6;--primary-press:#152F80;--on-primary:#FFFFFF;--primary-soft:#E7ECF8;
  --saffron:#F08A24;--india-green:#138808;
  --green:#13704A;--green-bg:#E2F1E9;
  --amber:#8C4F00;--amber-bg:#FBEED8;--amber-line:#D3953A;
  --red:#B0261E;--red-bg:#FAE6E3;
  --r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:28px;
  --touch:48px;--touch-lg:56px;
  --e1:0 1px 2px rgba(16,24,40,.05),0 0 0 1px var(--line);
  --e2:0 6px 20px -6px rgba(11,26,51,.18),0 0 0 1px var(--line);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0A0E15;--surface:#131922;--surface-2:#1B222D;--sunken:#0F141B;
  --ink:#EEF1F6;--ink-2:#B7BFCC;--muted:#9AA3B1;--line:#242D3A;--line-strong:#677284;
  --hero:#0F2140;--hero-2:#18305A;
  --primary:#94B0FF;--primary-press:#7C9BF2;--on-primary:#0A1633;--primary-soft:#1A2A4D;
  --green:#62D59E;--green-bg:#0F2A1E;--amber:#FFC266;--amber-bg:#33260E;--amber-line:#B9802A;--red:#FF8E85;--red-bg:#3A1614;
  --e1:0 0 0 1px var(--line);--e2:0 0 0 1px var(--line);
  color-scheme:dark;
}

/* ============ 2. BASE ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{font-family:var(--font);font-size:100%;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink)}
body{min-height:100dvh;font-size:1rem;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit;-webkit-user-select:none;user-select:none}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
svg{flex:none}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* ============ 3. LAYOUT + COMPONENTS ============ */
.scr{min-height:100dvh;display:flex;flex-direction:column}
.enter{animation:enter .22s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateX(14px)}}
@media (prefers-reduced-motion:reduce){.enter,.sheet,.pop{animation:none!important}}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:2px;min-height:calc(var(--st) + 60px);padding:var(--st) 6px 0 4px;background:var(--bg)}
.bar h1{flex:1;min-width:0;font-size:1.25rem;font-weight:600;letter-spacing:-.005em;line-height:1.2;padding:0 6px}
.bar h1 small{display:block;font-size:.875rem;font-weight:500;color:var(--ink-2);letter-spacing:0}
.bar.dk{background:var(--hero);color:var(--on-hero)}
.bar.dk h1 small{color:var(--on-hero-2)}
.bar.dk .ib{color:var(--on-hero)}
.ib{width:var(--touch);height:var(--touch);border-radius:50%;display:grid;place-items:center;color:var(--ink);transition:background .15s}
.ib:active{background:rgba(127,127,127,.18)}
.main{flex:1;padding:8px 16px 28px;display:flex;flex-direction:column;gap:20px}
.bb{position:sticky;bottom:0;z-index:6;margin-top:auto;padding:12px 16px calc(12px + var(--sb));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;gap:10px;align-items:stretch}
.btn{min-height:var(--touch-lg);border-radius:var(--r-md);padding:8px 20px;font-weight:600;font-size:1rem;letter-spacing:.005em;line-height:1.2;display:flex;align-items:center;justify-content:center;gap:10px;flex:1;text-align:center;transition:transform .12s var(--ease),background .15s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--primary);color:var(--on-primary)}
.btn.p:active{background:var(--primary-press)}
.btn.s{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.btn.q{color:var(--primary);min-height:var(--touch)}
.btn.sq{flex:0 0 var(--touch-lg);padding:0}
.btn[disabled]{opacity:.4}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--e1);padding:16px}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h2{font-size:1.0625rem;font-weight:600;line-height:1.3}
.sub{font-size:.9375rem;color:var(--ink-2);line-height:1.45}
.small{font-size:.875rem;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunken);border-radius:var(--r-md);padding:4px;gap:4px}
.seg button{min-height:var(--touch);border-radius:11px;font-weight:600;color:var(--ink-2);padding:6px;line-height:1.2;text-align:center;font-size:.9375rem;transition:background .15s,color .15s}
.seg button small{display:block;font-weight:400;font-size:.8125rem;margin-top:2px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.list{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--e1);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 12px 10px 16px;width:100%;position:relative;transition:background .12s}
.li+.li:before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.li:active{background:var(--surface-2)}
.li .t{display:block;font-weight:600;line-height:1.3}
.li .d{display:block;font-size:.875rem;color:var(--ink-2);line-height:1.4}
.li .chev{color:var(--line-strong)}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);flex:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-size:.875rem;font-weight:600;color:var(--ink-2)}
.field input{width:100%;min-height:54px;border:0;box-shadow:inset 0 0 0 1.5px var(--line-strong);border-radius:12px;padding:0 14px;font-size:1.0625rem;background:var(--surface);color:var(--ink)}
.field input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--primary),0 0 0 4px var(--primary-soft)}
.hint{font-size:.875rem;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:2px 10px 2px 8px;border-radius:999px;font-weight:600;font-size:.8125rem;line-height:1.2;white-space:nowrap;flex:none}
.chip.G{background:var(--green-bg);color:var(--green)}
.chip.A{background:var(--amber-bg);color:var(--amber);box-shadow:inset 0 0 0 1.5px var(--amber-line)}
.chip.R{background:var(--red-bg);color:var(--red)}
.chip.P,.chip.N{background:var(--surface-2);color:var(--muted)}
.sh.G{color:var(--green)}.sh.A{color:var(--amber)}.sh.R{color:var(--red)}.sh.P,.sh.N{color:var(--muted)}
.tag{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:6px;font-size:.75rem;font-weight:700;letter-spacing:.02em;background:var(--surface-2);color:var(--ink-2)}
.tag.ai{background:var(--primary-soft);color:var(--primary)}
.tri{display:inline-flex;height:3px;width:28px;border-radius:2px;overflow:hidden}
.tri i{flex:1;background:var(--saffron)}.tri i+i{background:#fff}.tri i+i+i{background:var(--india-green)}
.prog{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden;display:flex;gap:2px}
.prog i{background:var(--green);border-radius:2px}.prog i.a{background:var(--amber)}.prog i.r{background:var(--red)}
.dk .prog{background:rgba(255,255,255,.14)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8125rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{font-family:var(--font-num);font-variant-numeric:tabular-nums;color:var(--ink)}
/* logos (placeholders: swap LOGO.* in section 9 for official artwork) */
.sai{display:flex;align-items:center;gap:10px}
.sai .lg{display:flex;align-items:center;flex:none;padding-right:12px;border-right:1px solid var(--line)}
.sai .lg img{height:34px;width:auto;display:block}
.dk .sai .lg,:root[data-theme=dark] .sai .lg{background:#fff;border:0;border-radius:10px;padding:5px 8px}
.dk .sai .lg img,:root[data-theme=dark] .sai .lg img{height:28px}
.sai b{display:block;font-size:.875rem;line-height:1.2;font-weight:600}
.sai span{display:block;font-size:.75rem;line-height:1.2;color:var(--ink-2)}
.dk .sai span{color:var(--on-hero-2)}
.dset{display:inline-flex;align-items:center;gap:8px;font-size:.8125rem;color:var(--ink-2)}
.dset .mk{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:.5625rem;letter-spacing:-.02em}
/* hero */
.hero{background:var(--hero);color:var(--on-hero);border-radius:var(--r-xl);padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(closest-side,rgba(120,150,255,.22),transparent)}
.hero .sub,.hero .small{color:var(--on-hero-2)}
.hero .eyebrow{color:var(--on-hero-2)}
/* result values */
.val{display:flex;align-items:baseline;justify-content:flex-end;gap:3px;white-space:nowrap}
.val .v{font-family:var(--font-num);font-size:1.875rem;font-weight:700;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.val .u{font-size:.875rem;font-weight:500;color:var(--ink-2)}
.val.est .v{font-weight:400;color:var(--ink-2)}
.val.est .ap{font-family:var(--font-num);font-size:1.5rem;color:var(--amber)}
.val .w{font-size:1rem;font-weight:700;line-height:1.2}
.val.rej .w{color:var(--red)}.val.nr .w{color:var(--muted);font-weight:600}
.val.big .v{font-size:3.25rem}.val.big .ap{font-size:2.25rem}.val.big .u{font-size:1.125rem}.val.big .w{font-size:1.5rem}
/* result row */
.rr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;min-height:76px;padding:14px 14px 14px 16px;position:relative;transition:background .12s}
.rr+.rr:before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.rr:active{background:var(--surface-2)}
.rr .nm{font-weight:600;line-height:1.3}
.rr .nm small{font-weight:400;color:var(--ink-2);font-size:.8125rem}
.rr .why{font-size:.8125rem;color:var(--ink-2);line-height:1.35;margin-top:3px}
.rr .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.rr .st{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;letter-spacing:.02em}
.rr.A{background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--amber-bg) 55%,transparent) 10px 20px)}
/* strip */
.strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.strip button{min-height:50px;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--font-num);font-size:.8125rem;font-weight:700;color:var(--ink-2)}
.strip button.A{background:var(--amber-bg)}.strip button.G{background:var(--green-bg)}.strip button.R{background:var(--red-bg)}
/* sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(6,12,24,.48);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:90dvh;display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .28s var(--ease)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line-strong);opacity:.6;margin:10px auto 0;flex:none}
.sheet .shd{display:flex;align-items:flex-start;gap:8px;padding:6px 6px 0 20px}
.sheet .sbody{overflow:auto;padding:8px 20px 20px;display:flex;flex-direction:column;gap:20px;overscroll-behavior:contain}
.sheet .bb{position:static;background:var(--surface)}
.sec{display:flex;flex-direction:column;gap:8px}
.att{display:flex;align-items:center;gap:10px;min-height:46px;border-top:1px solid var(--line);font-size:.9375rem}
.att:first-child{border-top:0}
.att .k{width:84px;color:var(--ink-2)}
.att .v{font-family:var(--font-num);font-weight:700;font-size:1.0625rem;font-variant-numeric:tabular-nums}
.tl .ev{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.9375rem}
.tl .ev:first-child{border-top:0}
.tl .rp{font-family:var(--font-num);font-weight:700;color:var(--red)}
.note{display:flex;gap:12px;padding:14px;border-radius:var(--r-md);background:var(--surface-2);font-size:.9375rem;line-height:1.45}
.note.am{background:var(--amber-bg)}
.note.gr{background:var(--green-bg)}
/* roster */
.rt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--e1)}
.rtb{border-collapse:separate;border-spacing:0;min-width:100%}
.rtb th,.rtb td{border-bottom:1px solid var(--line);text-align:center;padding:0}
.rtb tr:last-child td{border-bottom:0}
.rtb thead th{font-family:var(--font-num);font-size:.8125rem;font-weight:700;color:var(--muted);height:42px;min-width:42px;background:var(--surface)}
.rtb .stk{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;box-shadow:1px 0 0 var(--line);min-width:128px}
.rtb td.stk button{display:block;width:100%;min-height:58px;padding:8px 10px 8px 14px;font-weight:600;line-height:1.25;font-size:.9375rem}
.rtb td.stk small{display:block;font-weight:400;color:var(--ink-2);font-size:.8125rem}
.rtb td.c button{width:42px;min-height:58px;display:grid;place-items:center}
.rtb td.n{font-family:var(--font-num);font-weight:700;padding:0 14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--e1);padding:12px}
.stat b{display:block;font-family:var(--font-num);font-size:1.75rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat b small{font-size:1rem;color:var(--muted);font-weight:500}
.stat span{font-size:.8125rem;color:var(--ink-2);line-height:1.3;display:block;margin-top:2px}
/* toast */
.toast{position:fixed;left:16px;right:16px;bottom:calc(92px + var(--sb));z-index:40;background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:var(--r-md);font-weight:500;animation:pop .2s var(--ease);display:flex;gap:10px;align-items:center}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
/* generating */
.gen-row{display:flex;align-items:center;gap:14px;min-height:60px}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--sunken);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.okdot{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;animation:pop .2s var(--ease)}
.wait{width:22px;height:22px;border-radius:50%;border:2px dashed var(--line-strong)}
/* keypad entry */
.kv{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:20px 0 8px}
.kv input{width:2.6ch;border:0;background:none;text-align:center;font-family:var(--font-num);font-size:4.5rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);border-bottom:3px solid var(--line-strong);padding:0 0 4px}
.kv input:focus{outline:none;border-color:var(--primary)}
.kv span{font-family:var(--font-num);font-size:3.5rem;font-weight:700;color:var(--muted)}
.kv label{display:block;text-align:center;font-size:.8125rem;font-weight:600;color:var(--muted);margin-top:6px}
.rotate{display:none}
@media (orientation:landscape) and (max-height:500px){body:not(.cam) .rotate{display:flex;position:fixed;inset:0;z-index:100;background:var(--bg);align-items:center;justify-content:center;flex-direction:column;gap:12px;font-weight:600}}

/* ============ 4. CAPTURE ============ */
.cap{position:fixed;inset:0;background:#05080C;color:#fff;overflow:hidden}
.cap .feed{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 35%,#29323C 0%,#141A21 55%,#080B0F 100%)}
.cap .top{position:absolute;top:0;left:0;right:0;padding:calc(var(--st) + 6px) 8px 10px;display:flex;align-items:center;gap:6px;background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,0))}
.cap .top .ib{color:#fff;background:rgba(0,0,0,.4)}
.cap .ttl{flex:1;min-width:0;line-height:1.25}
.cap .ttl b{display:block;font-size:1.0625rem;font-weight:600}
.cap .ttl span{font-size:.8125rem;color:#CBD4DE}
.cap .timer{font-family:var(--font-num);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.5);border-radius:12px;padding:4px 12px}
.cap .zone{position:absolute;left:14%;right:14%;top:calc(var(--st) + 132px);bottom:calc(var(--sb) + 214px);border:3px solid #3BE08A;border-radius:24px}
.cap .zone.out{border-color:#FF5A4E;border-style:dashed}
.cap .zl{position:absolute;top:-15px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#3BE08A;color:#03220F;font-weight:700;font-size:.8125rem;padding:4px 12px;border-radius:999px}
.cap .zone.out .zl{background:#FF5A4E;color:#2A0300}
.cap .skel{position:absolute;inset:6% 0 2%;width:100%;height:92%}
.cap .wall{position:absolute;left:-28px;top:4%;bottom:2%;width:16px;display:flex;flex-direction:column;justify-content:space-between}
.cap .wall i{display:block;height:2px;width:9px;background:rgba(255,255,255,.65)}.cap .wall i:nth-child(5n+1){width:16px}
.cap .guide{position:absolute;left:16px;right:16px;top:calc(var(--st) + 70px);text-align:center;pointer-events:none}
.cap .guide b{display:inline-block;font-size:1.375rem;font-weight:700;background:rgba(0,0,0,.6);padding:6px 16px;border-radius:14px}
.cap .guide.out b{background:#FF5A4E;color:#2A0300}
.cap .bot{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(var(--sb) + 14px);background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.82) 35%);display:flex;flex-direction:column;align-items:center;gap:14px}
.cap .gate{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.cap .gate span{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:2px 10px;border-radius:999px;background:rgba(0,0,0,.5);font-size:.8125rem;font-weight:500;box-shadow:inset 0 0 0 1.5px rgba(59,224,138,.75)}
.cap .gate span.x{box-shadow:inset 0 0 0 1.5px #FF5A4E}
.cap .rec{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:.9375rem}
.cap .rec i{width:84px;height:84px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}

    const saved = JSON.parse(localStorage.getItem("sai_ios_state_v5") || "null");
    const state = saved || {
      lang: "en",
      route: "home",
      sequencing: "ATHLETE_WISE",
      cameraDistanceM: 2.50, // Rung 4 default indoor full-body standoff distance (2.0m - 3.5m)
      lastRefCm: 29.7,       // Default A4 sheet (29.7 cm) or 100 cm tape
      boxZeroCm: 23.0,       // Standard SAI Sit & Reach box toe-line mark (23.0 cm)
      calib: {},             // Per-station Rung 1/2 calibrations { height: { cmPerPx, refCm, refPx, method, frameW, frameH }, ... }
      athletes: [
        { id: 1, name: "Riya Aggarwal", age: 20, gender: "F" },
        { id: 2, name: "Aarav Sharma", age: 14, gender: "M" }
      ],
      selectedAthleteId: 1,
      selectedTestKey: "height",
      results: {} // keyed by `${athleteId}:${testKey}`
    };
    if (!state.cameraDistanceM || state.cameraDistanceM < 1.2 || state.cameraDistanceM > 4.5) {
      state.cameraDistanceM = 2.50;
    }
    if (state.boxZeroCm === undefined || state.boxZeroCm === null) state.boxZeroCm = 23.0;
    if (!state.calib) state.calib = {};

    function persist() {
      localStorage.setItem("sai_ios_state_v5", JSON.stringify(state));
    }

    function t(en, hi) {
      return state.lang === "hi" && hi ? hi : en;
    }

    function cellKey(athleteId, testKey) {
      return `${athleteId}:${testKey}`;
    }

    // The roster for the running session. Falls back to every registered athlete
    // until a session has been started from Session Setup.
    function rosterAthletes() {
      const ids = state.session?.athleteIds;
      const list = ids?.length ? state.athletes.filter(a => ids.includes(a.id)) : state.athletes;
      return list.length ? list : state.athletes;
    }

    function getTraversal() {
      const cells = [];
      const roster = rosterAthletes();
      if (state.sequencing === "ATHLETE_WISE") {
        for (const a of roster) {
          for (const test of BATTERY_TESTS) cells.push({ athleteId: a.id, testKey: test.key });
        }
      } else {
        for (const test of BATTERY_TESTS) {
          for (const a of roster) cells.push({ athleteId: a.id, testKey: test.key });
        }
      }
      return cells;
    }

    function getProgress() {
      const cells = getTraversal();
      const done = cells.filter(c => {
        const r = state.results[cellKey(c.athleteId, c.testKey)];
        return r && r.valid !== false && r.value !== null;
      }).length;
      return { done, total: cells.length };
    }

    // =========================================================================
    // Geometry & Pose Helpers (33 MediaPipe Landmarks + Segmentation Mask)
    // Implements the 4-Rung Measurement Ladder + Joint-Ratio Offset Regression
    // =========================================================================
    let mediaStream = null;
    let captureTimer = null;
    let captureElapsed = 0;
    let facingMode = "environment";
    let poseLandmarker = null;
    let animFrameId = null;
    let captureToken = 0;
    let lastMpTimestampMs = 0;
    let deviceTilt = null;
    let tiltListenerOn = false;

    const MP_VERSION = "0.10.14";
    const POSE_MODEL_FULL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task";
    const POSE_MODEL_LITE = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task";

    async function ensureMediaPipeLoaded() {
      if (poseLandmarker) return poseLandmarker;
      const vision = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/vision_bundle.mjs`);
      const fileset = await vision.FilesetResolver.forVisionTasks(
        `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/wasm`
      );
      const makeOpts = (modelAssetPath, delegate) => ({
        baseOptions: { modelAssetPath, delegate },
        runningMode: "VIDEO",
        numPoses: 2,
        minPoseDetectionConfidence: 0.55,
        minPosePresenceConfidence: 0.55,
        minTrackingConfidence: 0.55,
        outputSegmentationMasks: true
      });
      try {
        poseLandmarker = await vision.PoseLandmarker.createFromOptions(fileset, makeOpts(POSE_MODEL_FULL, "GPU"));
      } catch (e1) {
        try {
          poseLandmarker = await vision.PoseLandmarker.createFromOptions(fileset, makeOpts(POSE_MODEL_LITE, "GPU"));
        } catch (e2) {
          poseLandmarker = await vision.PoseLandmarker.createFromOptions(fileset, makeOpts(POSE_MODEL_LITE, "CPU"));
        }
      }
      return poseLandmarker;
    }

    async function enableTiltSensor() {
      if (tiltListenerOn) return true;
      try {
        if (typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function") {
          const perm = await DeviceOrientationEvent.requestPermission();
          if (perm !== "granted") return false;
        }
        window.addEventListener("deviceorientation", (e) => {
          if (e.beta == null || e.gamma == null) return;
          deviceTilt = { beta: e.beta, gamma: e.gamma, at: performance.now() };
        });
        tiltListenerOn = true;
        return true;
      } catch (_) {
        return false;
      }
    }

    function phoneLevel() {
      if (!deviceTilt || performance.now() - deviceTilt.at > 2000) {
        return { known: false, ok: true, pitch: 0, roll: 0, text: t("Level OK", "समतल") };
      }
      const pitch = deviceTilt.beta - 90;
      const roll = deviceTilt.gamma;
      const ok = Math.abs(pitch) <= 8 && Math.abs(roll) <= 8;
      return { known: true, ok, pitch, roll, text: `${t("Tilt", "झुकाव")} ${pitch.toFixed(1)}°` };
    }

    function P(lm, i, W, H) {
      return { x: lm[i].x * W, y: lm[i].y * H };
    }

    function vis(lm, i, min = 0.42) {
      const p = lm[i];
      return !!p && (p.visibility === undefined || p.visibility >= min) &&
             p.x > 0.003 && p.x < 0.997 && p.y > 0.003 && p.y < 0.997;
    }

    function mid(a, b) {
      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }

    function dist2D(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function angleDeg(a, b, c) {
      const v1x = a.x - b.x, v1y = a.y - b.y;
      const v2x = c.x - b.x, v2y = c.y - b.y;
      const n1 = Math.hypot(v1x, v1y), n2 = Math.hypot(v2x, v2y);
      if (n1 < 1e-6 || n2 < 1e-6) return 180;
      const cos = Math.max(-1, Math.min(1, (v1x * v2x + v1y * v2y) / (n1 * n2)));
      return Math.acos(cos) * 180 / Math.PI;
    }

    function distToSegment(x, y, a, b) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const len2 = dx * dx + dy * dy;
      if (len2 < 1e-9) return Math.hypot(x - a.x, y - a.y);
      const tt = Math.max(0, Math.min(1, ((x - a.x) * dx + (y - a.y) * dy) / len2));
      return Math.hypot(x - (a.x + tt * dx), y - (a.y + tt * dy));
    }

    function median(arr) {
      if (!arr.length) return NaN;
      const s = [...arr].sort((x, y) => x - y);
      const m = s.length >> 1;
      return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
    }

    function pct(arr, p) {
      if (!arr.length) return NaN;
      const s = [...arr].sort((x, y) => x - y);
      return s[Math.min(s.length - 1, Math.max(0, Math.round(p * (s.length - 1))))];
    }

    function medianFilter(arr, k = 5) {
      const h = k >> 1;
      return arr.map((_, i) => median(arr.slice(Math.max(0, i - h), Math.min(arr.length, i + h + 1))));
    }

    function fail(liveMetric, reason, extra = {}) {
      return { postureOk: false, liveMetric, reason, ...extra };
    }

    function sideChain(lm) {
      const score = (ids) => ids.reduce((s, i) => s + (lm[i]?.visibility ?? 0), 0);
      const left = score([11, 13, 15, 23, 25, 27, 31]);
      const right = score([12, 14, 16, 24, 26, 28, 32]);
      return left >= right
        ? { sh: 11, el: 13, wr: 15, idx: 19, hip: 23, kn: 25, an: 27, heel: 29, ft: 31, ear: 7 }
        : { sh: 12, el: 14, wr: 16, idx: 20, hip: 24, kn: 26, an: 28, heel: 30, ft: 32, ear: 8 };
    }

    function stopCamera() {
      captureToken++;
      if (captureTimer) { clearInterval(captureTimer); captureTimer = null; }
      if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
      if (mediaStream) {
        mediaStream.getTracks().forEach(tr => tr.stop());
        mediaStream = null;
      }
    }

    // -------------------------------------------------------------------------
    // Scale Calibration Ladder (Rung 1/2 Tape/Person -> Rung 3 Athlete Height -> Rung 4 Portrait Pinhole Optics)
    // -------------------------------------------------------------------------
    function getCalib(testKey, W, H) {
      const c = state.calib?.[testKey];
      if (c && c.cmPerPx) {
        if (c.frameW === W && c.frameH === H) return c;
        if (c.frameH && H) return { ...c, cmPerPx: c.cmPerPx * (c.frameH / H) };
      }
      // For Height, fallback to Rung 4 Portrait Long-Edge Pinhole Optics:
      // Smartphone sensors have a 4:3 aspect ratio (43.27mm 35mm-eq diagonal -> 34.61mm × 25.96mm),
      // NOT a 3:2 DSLR 36mm × 24mm frame! In iOS WebRTC video mode (f_eq ≈ 25.4mm),
      // portrait vfovFactor = 34.61 / 25.4 = 1.3626 (gives 0.2661 cm/px at 2.50 m, fixing the +10 cm DSLR 36mm bias!).
      if (testKey === "height") {
        const distCm = (state.cameraDistanceM || 2.50) * 100.0;
        const vfovFactor = H >= W ? (34.61 / 25.4) : (25.96 / 25.4);
        const planeHeightCm = distCm * vfovFactor;
        return {
          cmPerPx: planeHeightCm / H,
          refCm: Number(planeHeightCm.toFixed(1)),
          refPx: H,
          method: "distance",
          rung: 4,
          confidence: "AMBER",
          frameW: W,
          frameH: H
        };
      }
      return null;
    }

    function calibLabel(c) {
      if (!c) return "";
      if (c.method === "sticky150") return `Rung 1/2 Wall Reference (${c.refLabel || ((c.markCm || 150) + " cm mark")})`;
      if (c.method === "wall") return `Rung 2 SAI Wall Stadiometer (mark ${c.markCm} cm · lens ${c.camHcm} cm)`;
      if (c.method === "person") return `Rung 1/2 Ref Height (${c.refCm} cm = ${c.refPx.toFixed(0)} px)`;
      if (c.method === "tape") return `Rung 1/2 Tape/Ref (${c.refCm} cm = ${c.refPx.toFixed(0)} px)`;
      if (c.method === "distance") return `Rung 4 Camera Dist (${(state.cameraDistanceM || 2.50).toFixed(2)} m)`;
      return `Scale ${c.cmPerPx.toFixed(4)} cm/px`;
    }

    // Map an image row from a camera pitched by `pitchDeg` (up = +) to the row a perfectly
    // level camera would see. Uses the portrait/landscape 35mm-equivalent focal length.
    function levelRow(y, pitchDeg, W, H) {
      if (!pitchDeg) return y;
      const f = H / (H >= W ? (34.61 / 25.4) : (25.96 / 25.4));
      const elev = Math.atan((H / 2 - y) / f) + pitchDeg * Math.PI / 180;
      return H / 2 - f * Math.tan(elev);
    }

    // Used ONLY as Rung 3b fallback for Sit & Reach / Vertical Jump when the user
    // has NOT yet run Test 1 (Height) and has NOT tapped a ruler in frame.
    // (Test 1 Height itself NEVER uses this — it measures purely from camera pixels!)
    function getAthleteRefHeightCm(athlete) {
      const recorded = athlete ? state.results[cellKey(athlete.id, "height")]?.value : null;
      if (recorded && recorded > 80) return recorded;
      const age = Number(athlete?.age) || 16;
      const isMale = (athlete?.gender || "").toLowerCase() === "male";
      if (age <= 6) return isMale ? 115 : 114;
      if (age <= 8) return isMale ? 126 : 125;
      if (age <= 10) return isMale ? 137 : 137;
      if (age <= 12) return isMale ? 148 : 149;
      if (age <= 14) return isMale ? 160 : 155;
      if (age <= 16) return isMale ? 167 : 157;
      return isMale ? 170 : 158;
    }

    // -------------------------------------------------------------------------
    // Segmentation Mask Readers (Supports both Float32 and Uint8 MediaPipe Masks)
    // -------------------------------------------------------------------------
    function maskReader(segMask) {
      if (!segMask) return null;
      try {
        if (typeof segMask.getAsFloat32Array === "function") {
          return { data: segMask.getAsFloat32Array(), w: segMask.width, h: segMask.height, thr: 0.5 };
        }
      } catch (_) {}
      try {
        if (typeof segMask.getAsUint8Array === "function") {
          return { data: segMask.getAsUint8Array(), w: segMask.width, h: segMask.height, thr: 128 };
        }
      } catch (_) {}
      return null;
    }

    function maskTopInBand(mask, W, H, cx, halfBand, yStart, yEnd) {
      if (!mask) return null;
      const sx = mask.w / W, sy = mask.h / H;
      const c0 = Math.max(0, Math.floor((cx - halfBand) * sx));
      const c1 = Math.min(mask.w - 1, Math.ceil((cx + halfBand) * sx));
      const r0 = Math.max(0, Math.floor(yStart * sy));
      const r1 = Math.min(mask.h - 1, Math.ceil(yEnd * sy));
      const minHits = Math.max(2, Math.round((c1 - c0 + 1) * 0.04));
      for (let r = r0; r <= r1; r++) {
        const off = r * mask.w;
        let hits = 0;
        for (let c = c0; c <= c1; c++) {
          if (mask.data[off + c] > mask.thr && ++hits >= minHits) break;
        }
        if (hits >= minHits) return r / sy;
      }
      return null;
    }

    function maskFarthestAlong(mask, W, H, center, radius, origin, u, excludeFn) {
      if (!mask) return null;
      const sx = mask.w / W, sy = mask.h / H;
      const c0 = Math.max(0, Math.floor((center.x - radius) * sx));
      const c1 = Math.min(mask.w - 1, Math.ceil((center.x + radius) * sx));
      const r0 = Math.max(0, Math.floor((center.y - radius) * sy));
      const r1 = Math.min(mask.h - 1, Math.ceil((center.y + radius) * sy));
      const rad2 = radius * radius;
      let best = null;
      for (let r = r0; r <= r1; r++) {
        const y = (r + 0.5) / sy;
        const off = r * mask.w;
        for (let c = c0; c <= c1; c++) {
          if (mask.data[off + c] <= mask.thr) continue;
          const x = (c + 0.5) / sx;
          if ((x - center.x) ** 2 + (y - center.y) ** 2 > rad2) continue;
          if (excludeFn && excludeFn(x, y)) continue;
          const proj = (x - origin.x) * u.x + (y - origin.y) * u.y;
          if (best === null || proj > best.proj) best = { proj, x, y };
        }
      }
      return best;
    }

    // =========================================================================
    // Per-Frame Evaluators (All 4 AI Tests)
    // =========================================================================

    // =========================================================================
    // Universal Wall Reference & Photo Template Detector (144x256 fast scan)
    // Supports ALL wall reference types:
    //  1. Uploaded Reference Photo template matching (tracks any uploaded sticky note,
    //     A4 paper, ruler, OR bare-wall pencil/pen/chalk mark with "100 cm" / "150 cm")
    //  2. Colored/Yellow Sticky Note or Tape on wall
    //  3. Bare-wall handwritten pen/marker line & numbers ("100 cm", "150 cm", etc.)
    //     or white A4 paper sheet surrounded by smooth wall
    // =========================================================================
    let _stickyCanvas = null, _stickyCtx = null;
    let _prevHeightVertexY = null, _prevHeightShX = null;
    if (state.calib && state.calib.height && state.calib.height.method === "sticky150" && !state.calib.height.lockedFromLiveTap) {
      state.calib.height.lockedFromPhoto = true;
    }
    let _autoStickyCalib = (state.calib && state.calib.height && state.calib.height.method === "sticky150" && state.calib.height.topY > 0)
      ? { ...state.calib.height, liveDetected: true }
      : null;
    let _tesseractPromise = null;

    function extractPatchTemplate(gray, grad, SW, SH, cx, cy) {
      const PW = 16, PH = 16;
      const tpl = new Float32Array(PW * PH);
      let sum = 0;
      for (let dy = 0; dy < PH; dy++) {
        const y = Math.min(SH - 1, Math.max(0, Math.round(cy - PH / 2 + dy)));
        for (let dx = 0; dx < PW; dx++) {
          const x = Math.min(SW - 1, Math.max(0, Math.round(cx - PW / 2 + dx)));
          const v = 0.65 * grad[y * SW + x] + 0.35 * (255 - gray[y * SW + x]);
          tpl[dy * PW + dx] = v;
          sum += v;
        }
      }
      const mean = sum / (PW * PH);
      let norm = 0;
      for (let i = 0; i < tpl.length; i++) {
        tpl[i] -= mean;
        norm += tpl[i] * tpl[i];
      }
      norm = Math.sqrt(norm) || 1;
      for (let i = 0; i < tpl.length; i++) tpl[i] /= norm;
      return Array.from(tpl);
    }

    function analyzeWallImageBuffer(img, SW, SH, W, H, mask, uploadedCalib) {
      const yel = new Float32Array(SW * SH);
      const gray = new Float32Array(SW * SH);
      const grad = new Float32Array(SW * SH);
      const rArr = new Uint8Array(SW * SH);
      const gArr = new Uint8Array(SW * SH);
      const bArr = new Uint8Array(SW * SH);
      for (let i = 0, p = 0; i < SW * SH; i++, p += 4) {
        const r = img[p], g = img[p + 1], b = img[p + 2];
        rArr[i] = r; gArr[i] = g; bArr[i] = b;
        yel[i] = 0.5 * (r + g) - b;
        gray[i] = 0.299 * r + 0.587 * g + 0.114 * b;
      }
      for (let y = 1; y < SH; y++) {
        const row = y * SW;
        for (let x = 1; x < SW; x++) {
          const idx = row + x;
          grad[idx] = Math.abs(gray[idx] - gray[idx - 1]) + Math.abs(gray[idx] - gray[idx - SW]);
        }
      }

      // 1. If the user tapped a mark directly in the live video, keep that live tap locked:
      if (uploadedCalib && uploadedCalib.lockedFromLiveTap && uploadedCalib.topY > 0) {
        const sy = H / (uploadedCalib.frameH || H);
        const sx = W / (uploadedCalib.frameW || W);
        return {
          ...uploadedCalib,
          liveDetected: true,
          topY: uploadedCalib.topY * sy,
          botY: (uploadedCalib.botY || (uploadedCalib.topY + (uploadedCalib.noteH || H * 0.04))) * sy,
          leftX: (uploadedCalib.leftX || W * 0.44) * sx,
          rightX: (uploadedCalib.rightX || W * 0.56) * sx,
          noteH: (uploadedCalib.noteH || H * 0.04) * sy,
          noteW: (uploadedCalib.noteW || W * 0.08) * sx,
          frameW: W,
          frameH: H
        };
      }

      // 2. Check for Colored/Yellow Sticky Note on the wall in the LIVE video frame
      //    Requires ALL 4 surrounding sides (left, right, top, AND bottom) to be non-yellow wall
      //    so vertical yellow doorframes/strips are completely ignored and only the square sticky note matches!
      const hitsX = [], hitsY = [];
      const y0 = Math.floor(0.06 * SH), y1 = Math.floor(0.66 * SH);
      const x0 = Math.floor(0.18 * SW), x1 = Math.floor(0.88 * SW);
      for (let y = y0; y < y1; y++) {
        const row = y * SW;
        for (let x = x0; x < x1; x++) {
          const idx = row + x;
          const yv = yel[idx], rv = rArr[idx], gv = gArr[idx];
          if (yv > 26 && rv > 120 && gv > 110 && Math.abs(rv - gv) < 42) {
            if (mask) {
              const mx = Math.min(mask.w - 1, Math.floor((x / SW) * mask.w));
              const my = Math.min(mask.h - 1, Math.floor((y / SH) * mask.h));
              if (mask.data[my * mask.w + mx] > mask.thr) continue;
            }
            const check4Sides = (rx, ry) => {
              const xl = Math.max(0, x - rx), xr = Math.min(SW - 1, x + rx);
              const yt = Math.max(0, y - ry), yb = Math.min(SH - 1, y + ry);
              const iL = row + xl, iR = row + xr, iT = yt * SW + x, iB = yb * SW + x;
              return (
                yv - yel[iL] > 14 && yv - yel[iR] > 14 &&
                yv - yel[iT] > 14 && yv - yel[iB] > 14 &&
                bArr[iL] > 95 && bArr[iR] > 95
              );
            };
            if (check4Sides(10, 14) || check4Sides(16, 22)) {
              hitsX.push(x);
              hitsY.push(y);
            }
          }
        }
      }
      if (hitsX.length >= 4) {
        const xm = median(hitsX), ym = median(hitsY);
        const kx = [], ky = [];
        for (let i = 0; i < hitsX.length; i++) {
          if (Math.abs(hitsX[i] - xm) <= 12 && Math.abs(hitsY[i] - ym) <= 16) {
            kx.push(hitsX[i]);
            ky.push(hitsY[i]);
          }
        }
        if (kx.length >= 4) {
          const topY = (pct(ky, 0.03) / SH) * H;
          const botY = (pct(ky, 0.97) / SH) * H;
          const leftX = (pct(kx, 0.03) / SW) * W;
          const rightX = (pct(kx, 0.97) / SW) * W;
          const noteH = Math.max(H * 0.018, botY - topY), noteW = Math.max(W * 0.022, rightX - leftX);
          if (noteH >= H * 0.015 && noteH <= H * 0.22 && noteW >= W * 0.02 && noteW <= W * 0.30) {
            const cx = Math.round(xm), cy = Math.round(ym);
            return {
              ...(uploadedCalib || {}),
              liveDetected: true,
              topY, botY: topY + noteH, leftX, rightX: leftX + noteW, noteH, noteW,
              cxNorm: cx / SW, cyNorm: cy / SH,
              noteHNorm: noteH / H, noteWNorm: noteW / W,
              template: (uploadedCalib && uploadedCalib.template) || extractPatchTemplate(gray, grad, SW, SH, cx, cy),
              markCm: uploadedCalib?.markCm || state.lastWallMarkCm || 150.0,
              objSizeCm: uploadedCalib?.objSizeCm || 7.62,
              refLabel: uploadedCalib?.refLabel || `${state.lastWallMarkCm || 150} cm Sticky Note`,
              frameW: W, frameH: H
            };
          }
        }
      }

      // If the athlete's head/hair temporarily covers the sticky note while standing at the wall,
      // keep using the saved Reference Photo's wall coordinates scaled to (W, H):
      if (uploadedCalib && uploadedCalib.topY > 0) {
        const sy = H / (uploadedCalib.frameH || H);
        const sx = W / (uploadedCalib.frameW || W);
        return {
          ...uploadedCalib,
          liveDetected: true,
          topY: uploadedCalib.topY * sy,
          botY: (uploadedCalib.botY || (uploadedCalib.topY + (uploadedCalib.noteH || H * 0.08))) * sy,
          leftX: (uploadedCalib.leftX || W * 0.44) * sx,
          rightX: (uploadedCalib.rightX || W * 0.56) * sx,
          noteH: (uploadedCalib.noteH || H * 0.08) * sy,
          noteW: (uploadedCalib.noteW || W * 0.12) * sx,
          frameW: W,
          frameH: H
        };
      }

      // 3. Pure Grayscale Wall-Mark / Handwriting / A4 Detector (when someone draws a line
      //    and writes "100 cm" or "150 cm" directly on the wall without a sticky note!)
      let bestScore = -1, bestCx = -1, bestCy = -1;
      for (let cy = Math.floor(0.12 * SH); cy < Math.floor(0.65 * SH); cy += 3) {
        for (let cx = Math.floor(0.24 * SW); cx < Math.floor(0.84 * SW); cx += 3) {
          if (mask) {
            const mx = Math.min(mask.w - 1, Math.floor((cx / SW) * mask.w));
            const my = Math.min(mask.h - 1, Math.floor((cy / SH) * mask.h));
            if (mask.data[my * mask.w + mx] > mask.thr) continue;
          }
          let inner = 0, cnt = 0;
          for (let dy = -9; dy <= 9; dy += 2) {
            for (let dx = -7; dx <= 7; dx += 2) {
              inner += grad[(cy + dy) * SW + (cx + dx)];
              cnt++;
            }
          }
          inner /= cnt;
          if (inner < 3.6) continue;
          const ringGrad = (ox, oy) => {
            let s = 0, c = 0;
            for (let dy = -5; dy <= 5; dy += 3) {
              for (let dx = -3; dx <= 3; dx += 3) {
                const yy = Math.min(SH - 1, Math.max(0, cy + oy + dy));
                const xx = Math.min(SW - 1, Math.max(0, cx + ox + dx));
                s += grad[yy * SW + xx];
                c++;
              }
            }
            return s / c;
          };
          const s4 = [ringGrad(-20, 0), ringGrad(20, 0), ringGrad(0, -22), ringGrad(0, 22)].sort((a, b) => a - b);
          const wallSmooth = s4[2]; // At least 3 of 4 surrounding sides are smooth wall
          const b4 = [
            gray[cy * SW + Math.max(0, cx - 20)],
            gray[cy * SW + Math.min(SW - 1, cx + 20)],
            gray[Math.max(0, cy - 22) * SW + cx],
            gray[Math.min(SH - 1, cy + 22) * SW + cx]
          ].sort((a, b) => a - b);
          if (wallSmooth < 1.8 && b4[1] > 115) {
            const score = inner / (wallSmooth + 0.4);
            if (score > bestScore) {
              bestScore = score;
              bestCx = cx;
              bestCy = cy;
            }
          }
        }
      }
      if (bestScore >= 6.5 && bestCx > 0) {
        const gxPts = [], gyPts = [];
        for (let dy = -14; dy <= 14; dy++) {
          for (let dx = -12; dx <= 12; dx++) {
            const yy = Math.min(SH - 1, Math.max(0, bestCy + dy));
            const xx = Math.min(SW - 1, Math.max(0, bestCx + dx));
            if (grad[yy * SW + xx] > 3.5) {
              gxPts.push(xx);
              gyPts.push(yy);
            }
          }
        }
        if (gxPts.length >= 6) {
          const topY = (pct(gyPts, 0.04) / SH) * H;
          const botY = (pct(gyPts, 0.96) / SH) * H;
          const leftX = (pct(gxPts, 0.04) / SW) * W;
          const rightX = (pct(gxPts, 0.96) / SW) * W;
          const noteH = Math.max(H * 0.03, botY - topY);
          const noteW = Math.max(W * 0.04, rightX - leftX);
          return {
            topY, botY: topY + noteH, leftX, rightX: leftX + noteW, noteH, noteW,
            cxNorm: bestCx / SW, cyNorm: bestCy / SH,
            noteHNorm: noteH / H, noteWNorm: noteW / W,
            template: extractPatchTemplate(gray, grad, SW, SH, bestCx, bestCy),
            markCm: state.lastWallMarkCm || 150.0,
            objSizeCm: 7.62,
            refLabel: `${state.lastWallMarkCm || 150} cm Wall Mark`,
            frameW: W, frameH: H
          };
        }
      }
      return null;
    }

    async function ocrReadHeightFromPhoto(imgEl, box, W, H) {
      try {
        if (!_tesseractPromise) {
          _tesseractPromise = new Promise((resolve, reject) => {
            if (window.Tesseract) return resolve(window.Tesseract);
            const s = document.createElement("script");
            s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
            s.onload = () => resolve(window.Tesseract);
            s.onerror = reject;
            document.head.appendChild(s);
          });
        }
        const Tesseract = await Promise.race([
          _tesseractPromise,
          new Promise((_, rej) => setTimeout(() => rej(new Error("OCR timeout")), 5500))
        ]);
        const c = document.createElement("canvas");
        const padX = Math.round((box.rightX - box.leftX) * 0.35 + 16);
        const padY = Math.round((box.botY - box.topY) * 0.35 + 16);
        const sx = Math.max(0, Math.floor(box.leftX - padX));
        const sy = Math.max(0, Math.floor(box.topY - padY));
        const sw = Math.min(W - sx, Math.ceil(box.rightX - box.leftX + 2 * padX));
        const sh = Math.min(H - sy, Math.ceil(box.botY - box.topY + 2 * padY));
        c.width = sw * 2;
        c.height = sh * 2;
        const cx = c.getContext("2d");
        cx.filter = "contrast(180%) grayscale(100%)";
        cx.drawImage(imgEl, sx, sy, sw, sh, 0, 0, c.width, c.height);
        const res = await Tesseract.recognize(c, "eng");
        const txt = (res?.data?.text || "").replace(/[oO]/g, "0").replace(/[lI|]/g, "1");
        const m = txt.match(/\b(1[0-9]{2}|[5-9][0-9]|200|29\.7|30)\b/);
        if (m) return parseFloat(m[1]);
      } catch (_) {}
      return null;
    }

    function detectWallStickyNote(videoEl, mask, W, H) {
      if (!videoEl || !videoEl.videoWidth) return _autoStickyCalib;
      const SW = 144, SH = 256;
      if (!_stickyCanvas) {
        _stickyCanvas = document.createElement("canvas");
        _stickyCanvas.width = SW;
        _stickyCanvas.height = SH;
        _stickyCtx = _stickyCanvas.getContext("2d", { willReadFrequently: true });
      }
      try {
        _stickyCtx.drawImage(videoEl, 0, 0, SW, SH);
        const img = _stickyCtx.getImageData(0, 0, SW, SH).data;
        const uploadedCalib = state.calib?.height?.method === "sticky150" ? state.calib.height : null;
        const det = analyzeWallImageBuffer(img, SW, SH, W, H, mask, uploadedCalib);
        if (det) {
          if (!_autoStickyCalib || _autoStickyCalib.frameH !== H) {
            _autoStickyCalib = det;
          } else {
            _autoStickyCalib = {
              ...det,
              topY: 0.75 * _autoStickyCalib.topY + 0.25 * det.topY,
              botY: 0.75 * _autoStickyCalib.botY + 0.25 * det.botY,
              leftX: 0.75 * _autoStickyCalib.leftX + 0.25 * det.leftX,
              rightX: 0.75 * _autoStickyCalib.rightX + 0.25 * det.rightX,
              noteH: 0.75 * _autoStickyCalib.noteH + 0.25 * det.noteH,
              noteW: 0.75 * _autoStickyCalib.noteW + 0.25 * det.noteW
            };
          }
        }
      } catch (_) {}
      return _autoStickyCalib;
    }

    // TEST 1 — STANDING HEIGHT
    // Supports:
    //  A. Universal Wall Reference Mode (Uploaded Reference Photo of Sticky Note / A4 / Bare-Wall Mark,
    //     or Auto-Detected / 1-Tap Wall Mark at ANY height e.g. 100 cm, 120 cm, 150 cm, 160 cm)
    //  B. Full-Body Standing Mode with 2.50 m Floor-Zone Gate
    function evalHeight(lm, mask, W, H, calib, stickyNote) {
      const p = (i) => P(lm, i, W, H);
      const activeCalib = calib || getCalib("height", W, H);
      const hasSticky150 = !!(stickyNote && stickyNote.topY > 0) || (activeCalib && activeCalib.method === "sticky150");
      const sticky = (activeCalib && activeCalib.method === "sticky150")
        ? {
            ...activeCalib,
            ...(stickyNote || {}),
            markCm: activeCalib.markCm || stickyNote?.markCm || 150.0,
            objSizeCm: activeCalib.objSizeCm || stickyNote?.objSizeCm || 7.62
          }
        : stickyNote;

      // When a wall reference mark (e.g. 100 cm or 150 cm) is locked on the wall, only head + shoulders (0, 11, 12) need to be visible
      // (because a desk/table at the bottom of the wall may hide the lower legs/feet!).
      const reqIds = hasSticky150 ? [0, 11, 12] : [0, 11, 12, 23, 24, 25, 26, 27, 28];
      for (const i of reqIds) {
        if (!vis(lm, i, 0.40)) {
          return fail(t("Step into view", "कैमरे के सामने आएँ"),
            hasSticky150
              ? t("Stand next to your wall reference mark with your head and shoulders clearly visible.", "दीवार के निशान के पास खड़े हों ताकि सिर और कंधे साफ़ दिखें।")
              : t("Whole body — top of head to heels — must be inside the frame (or upload/mark a wall height reference).", "सिर से एड़ी तक पूरा शरीर फ्रेम में रखें (या दीवार के निशान की फोटो अपलोड करें)।"));
        }
      }

      const shMid = mid(p(11), p(12));
      const hasHips = vis(lm, 23, 0.35) && vis(lm, 24, 0.35);
      const hipMid = hasHips ? mid(p(23), p(24)) : { x: shMid.x, y: shMid.y + Math.abs(p(11).x - p(12).x) * 1.32 };
      const hasAnkles = vis(lm, 27, 0.38) && vis(lm, 28, 0.38);
      const anMid = hasAnkles ? mid(p(27), p(28)) : { x: shMid.x, y: Math.min(H - 5, hipMid.y + (hipMid.y - shMid.y) * 1.48) };
      const torsoPx = Math.max(H * 0.08, dist2D(shMid, hipMid));

      if (Math.abs(p(11).x - p(12).x) < 0.25 * torsoPx) {
        return fail(t("Face the camera", "कैमरे की ओर मुँह करें"), t("Stand facing the camera with shoulders square.", "कैमरे की ओर सीधा मुँह करके खड़े हों।"));
      }

      if (!hasSticky150 && hasAnkles) {
        const kneeMin = Math.min(angleDeg(p(23), p(25), p(27)), angleDeg(p(24), p(26), p(28)));
        const hipAng = angleDeg(shMid, hipMid, mid(p(25), p(26)));
        if (kneeMin < 155 || hipAng < 152) {
          return fail(`${t("Not upright", "सीधे नहीं")} (${t("knee", "घुटना")} ${kneeMin.toFixed(0)}°)`,
            t("Stand tall: heels against the wall, knees straight (≥155°).", "दीवार से एड़ी सटाकर, घुटने सीधे रखकर खड़े हों।"));
        }
      }

      // Joint-Ratio Keypoint Offset Correction (Sensors 2024):
      const eyeY = (vis(lm, 2, 0.35) && vis(lm, 5, 0.35)) ? (p(2).y + p(5).y) / 2 : p(0).y;
      const headNeckPx = Math.max(H * 0.025, shMid.y - eyeY);
      const rawLegTorsoPx = hasAnkles ? (anMid.y - shMid.y) : (torsoPx * 2.48);
      const anatomicalLegTorsoPx = Math.max(rawLegTorsoPx, headNeckPx * 7.35, torsoPx * 2.42);

      // Skull crown offset above eye midpoint:
      const crownOffsetPx = 0.50 * (0.62 * headNeckPx) + 0.50 * (0.075 * anatomicalLegTorsoPx);
      let vertexY = Math.max(0, eyeY - crownOffsetPx);
      let vertexSource = "joint_ratio_regression";

      if (mask) {
        const headIds = [0, 2, 5, 7, 8].filter(i => vis(lm, i, 0.35));
        const cx = headIds.reduce((s, i) => s + p(i).x, 0) / headIds.length;
        const earW = (vis(lm, 7, 0.35) && vis(lm, 8, 0.35)) ? Math.abs(p(7).x - p(8).x) : Math.abs(p(11).x - p(12).x) * 0.42;
        const halfBand = Math.max(earW * 0.55, W * 0.022);
        const minSkullY = Math.max(0, eyeY - 1.08 * crownOffsetPx);
        const maxSkullY = Math.max(0, eyeY - 0.88 * crownOffsetPx);
        const maskTopY = maskTopInBand(mask, W, H, cx, halfBand, minSkullY, eyeY);
        if (maskTopY !== null && maskTopY <= maxSkullY) {
          vertexY = Math.max(minSkullY, maskTopY);
          vertexSource = "segmentation_mask";
        }
      }

      if (vertexY <= H * 0.008) {
        return fail(t("Head cut off — Step BACK!", "सिर कट रहा है — पीछे हटें!"),
          t("🚫 Top of head touches the frame edge — tilt camera up slightly or step back.", "🚫 सिर फ्रेम के किनारे पर है — कैमरा थोड़ा ऊपर करें या पीछे हटें।"),
          { vertexY });
      }

      const headRoll = (vis(lm, 7, 0.35) && vis(lm, 8, 0.35))
        ? Math.abs(Math.atan2(p(8).y - p(7).y, Math.abs(p(8).x - p(7).x) + 1e-6) * 180 / Math.PI)
        : 1.5;

      // ---------------------------------------------------------------
      // MOTION & TABLE-LEAN GATE (Pauses recording while tapping Start/Stop or walking!)
      // ---------------------------------------------------------------
      const dVy = _prevHeightVertexY !== null ? Math.abs(vertexY - _prevHeightVertexY) : 0;
      const dSx = _prevHeightShX !== null ? Math.abs(shMid.x - _prevHeightShX) : 0;
      _prevHeightVertexY = vertexY;
      _prevHeightShX = shMid.x;

      if (dVy > H * 0.012 || dSx > W * 0.015) {
        return fail(
          t("⏸ Hold Still at Wall...", "⏸ दीवार पर स्थिर खड़े हों..."),
          t("⏸ Timer paused while you walk — stand completely still against the wall.", "⏸ चलते समय टाइमर रुका है — दीवार से सटकर बिल्कुल स्थिर खड़े हों।"),
          { vertexY }
        );
      }

      const vfovFactor = H >= W ? (34.61 / 25.4) : (25.96 / 25.4);
      const fPx = H / vfovFactor;
      const stationDistM = state.cameraDistanceM || 2.50;
      const cmPerPxOptics = (stationDistM * 100.0 * vfovFactor) / H;

      // ---------------------------------------------------------------
      // MODE A: UNIVERSAL WALL REFERENCE MODE (150 cm Sticky Note / Wall Mark)
      // Computes height directly relative to the wall mark (yMark) using the sticky note's
      // physical scale on the wall (~7.62 cm / noteH) blended with upper-body wall scale,
      // and automatically blocks frames where the athlete leans down to tap the phone on the table!
      // ---------------------------------------------------------------
      if (hasSticky150 && sticky && sticky.topY > 0) {
        const sy = H / (sticky.frameH || H);
        const yMark = sticky.topY * sy;
        const noteH = Math.max(H * 0.025, (sticky.noteH || H * 0.085) * sy);
        const markCm = Number(sticky.markCm) || 150.0;
        const rawObjCm = Number(sticky.objSizeCm) || 7.62;
        // Standard 3x3 inch sticky note is 7.62 cm tall; if user selected A4 (29.7 cm), use that
        const notePhysicalCm = (rawObjCm >= 12.0) ? rawObjCm : 7.62;

        // If the athlete is leaning down toward the table to press Start/Stop on the phone
        // (head drops far below the 150 cm sticky note or looms huge in front of the lens), pause timer!
        if (headNeckPx > H * 0.095 || (markCm >= 135 && vertexY > yMark + 0.35 * noteH)) {
          return fail(
            t("⏸ Stand Tall Against Wall Mark", "⏸ दीवार के निशान के पास सीधे खड़े हों"),
            t("⏸ Timer paused while reaching for the phone — stand tall with your back against the wall next to the 150 cm mark!",
              "⏸ फ़ोन छूते समय टाइमर रुका है — 150 सेमी निशान के पास दीवार से पीठ सटाकर सीधे खड़े हों!"),
            { vertexY, stickyTopY: yMark }
          );
        }

        // Local cm/px right at the wall plane where both the sticky note and the athlete's head sit:
        const cmPerPxNote = notePhysicalCm / noteH;
        const headToShoulderPx = Math.max(H * 0.06, shMid.y - vertexY);
        const cmPerPxUpper = 27.5 / headToShoulderPx;
        const cmPerPxWall = (noteH >= H * 0.045)
          ? (0.65 * cmPerPxNote + 0.35 * cmPerPxUpper)
          : cmPerPxOptics;

        const deltaAboveMarkPx = yMark - vertexY;
        const deltaCm = deltaAboveMarkPx * cmPerPxWall;
        const cmSticky = markCm + deltaCm;
        const estWallDistM = Math.max(0.95, Math.min(3.50, (fPx * cmPerPxWall) / 100.0));
        const virtualSoleY = Math.min(H - 4, vertexY + cmSticky / cmPerPxWall);

        return {
          postureOk: true,
          bodyPx: Math.round(cmSticky / cmPerPxWall),
          vertexY,
          soleY: virtualSoleY,
          stickyTopY: yMark,
          estDistM: estWallDistM,
          vertexSource,
          cm: cmSticky,
          cmPerPx: cmPerPxWall,
          calibMethod: "sticky150",
          headRoll,
          liveMetric: `📌 ${cmSticky.toFixed(1)} cm (${deltaCm >= 0 ? "+" : ""}${deltaCm.toFixed(1)} cm vs ${markCm} cm mark)`,
          reason: `✅ ${t("Wall Reference Locked", "दीवार संदर्भ लॉक")} (${markCm} cm) · ${t("Head is", "सिर")} ${deltaCm >= 0 ? "+" : ""}${deltaCm.toFixed(1)} cm ${t("vs mark", "निशान से")} → ${cmSticky.toFixed(1)} cm`
        };
      }

      // ---------------------------------------------------------------
      // MODE B: FULL-BODY 2.50 m FLOOR-ZONE MODE (When NO wall reference photo/mark is active)
      // ---------------------------------------------------------------
      let rawSoleY;
      if (vis(lm, 29, 0.35) && vis(lm, 30, 0.35)) {
        rawSoleY = Math.min(H - 1, 0.5 * (p(29).y + p(30).y) + 0.02 * headNeckPx);
      } else if (vis(lm, 29, 0.35) || vis(lm, 30, 0.35)) {
        const hy = vis(lm, 29, 0.35) ? p(29).y : p(30).y;
        rawSoleY = Math.min(H - 1, hy + 0.02 * headNeckPx);
      } else {
        rawSoleY = Math.min(H - 1, anMid.y + 0.10 * headNeckPx);
      }

      // Check if lower legs/feet are occluded by a table/desk at the bottom of the frame:
      const visibleLegPx = anMid.y - hipMid.y;
      const soleFromHips = vertexY + (hipMid.y - vertexY) / 0.470;
      const soleFromTorso = shMid.y + anatomicalLegTorsoPx + 0.08 * headNeckPx;
      const anatomicalSoleY = hasHips ? (0.55 * soleFromHips + 0.45 * soleFromTorso) : soleFromTorso;
      const isLowerLegOccluded = visibleLegPx < 1.28 * torsoPx || (anatomicalSoleY - rawSoleY) > 0.30 * torsoPx;

      if (isLowerLegOccluded && activeCalib.method !== "wall") {
        return fail(
          t("Feet Blocked by Table — Upload Wall Mark or Step Back", "मेज़ से पैर ढके हैं — दीवार का निशान अपलोड करें या पीछे हटें"),
          t("🚫 A table/object is hiding your feet! Either keep a 150 cm sticky note on the wall, or place the phone where your heels are visible.",
            "🚫 मेज़ आपके पैरों को ढक रही है! या तो दीवार पर 150 सेमी का स्टिकी नोट लगाएँ, या फ़ोन ऐसी जगह रखें जहाँ एड़ी साफ़ दिखे।"),
          { soleY: rawSoleY, vertexY }
        );
      }

      const soleY = rawSoleY;
      if (rawSoleY >= H * 0.992) {
        return fail(t("Feet cut off — Step BACK!", "पैर कट रहे हैं — पीछे हटें!"),
          t("🚫 Feet touch the bottom edge — step back until heels are inside the Green Zone.", "🚫 पैर नीचे किनारे पर हैं — पीछे हटें जब तक एड़ी हरे ज़ोन में न आ जाए।"),
          { soleY: rawSoleY, vertexY });
      }

      const bodyPx = soleY - vertexY;
      const estDistM = stationDistM;

      if (bodyPx < H * 0.28) {
        return fail(`${t("📏 TOO FAR — Step CLOSER!", "📏 बहुत दूर — पास आएँ!")}`,
          t("🚫 BLOCKED: Too far from camera! Step CLOSER until heels are inside the GREEN Floor Zone.",
            "🚫 अवरुद्ध: कैमरे से बहुत दूर हैं! पास आएँ जब तक एड़ी हरे ज़ोन में न आ जाए।"),
          { soleY: rawSoleY, vertexY, estDistM, distanceError: "TOO_FAR" });
      }
      if (Math.abs(shMid.x - anMid.x) > 0.14 * bodyPx) {
        return fail(t("Leaning — Stand Straight", "झुके हुए — सीधे खड़े हों"),
          t("🚫 Stand straight and vertical with weight evenly on both feet.", "🚫 बिल्कुल सीधे खड़े हों।"),
          { soleY: rawSoleY, vertexY, estDistM });
      }

      // ---------------------------------------------------------------
      // SAI 2-POINT WALL STADIOMETER MODE (Rung 2, GREEN)
      // ---------------------------------------------------------------
      if (activeCalib.method === "wall") {
        const sy = H / (activeCalib.frameH || H);
        const yF = activeCalib.yFloor * sy;
        const yM = activeCalib.yMark * sy;
        const k = Math.max(0.5, (yF - yM) / activeCalib.markCm);
        const cmPerPxWall = 1.0 / k;
        const deltaCm = (yM - vertexY) * cmPerPxWall;
        const cmW = activeCalib.markCm + deltaCm;
        return {
          postureOk: true,
          bodyPx,
          vertexY,
          soleY: yF,
          stickyTopY: yM,
          estDistM: (fPx * cmPerPxWall) / 100.0,
          vertexSource,
          cm: cmW,
          cmPerPx: cmPerPxWall,
          calibMethod: "wall",
          headRoll,
          wallFloorY: yF,
          liveMetric: `✅ ${cmW.toFixed(1)} cm (${deltaCm >= 0 ? "+" : ""}${deltaCm.toFixed(1)} cm vs ${activeCalib.markCm} cm mark)`,
          reason: `✅ ${t("Wall Mark Locked", "दीवार निशान लॉक")} (${activeCalib.markCm} cm) → ${cmW.toFixed(1)} cm`
        };
      }

      // ---------------------------------------------------------------
      // GUIDED 2.50 m FLOOR-ZONE MODE (Default Rung 4 Mode)
      // ---------------------------------------------------------------
      if (activeCalib.method === "distance") {
        if (rawSoleY > H * 0.855 || headNeckPx > H * 0.076) {
          return fail(t("📏 TOO CLOSE — Step BACK!", "📏 बहुत पास — पीछे हटें!"),
            t("🚫 BLOCKED: Athlete is TOO CLOSE! Step BACK until heels are inside the GREEN Floor Zone.",
              "🚫 अवरुद्ध: एथलीट कैमरे के बहुत पास है! पीछे हटें जब तक एड़ी हरे फ़र्श ज़ोन में न आ जाए।"),
            { soleY: rawSoleY, vertexY, estDistM: 1.95, distanceError: "TOO_CLOSE" });
        }
        if (rawSoleY < H * 0.735) {
          return fail(t("📏 TOO FAR — Step CLOSER!", "📏 बहुत दूर — पास आएँ!"),
            t("🚫 BLOCKED: Athlete is TOO FAR! Step CLOSER until heels are inside the GREEN Floor Zone.",
              "🚫 अवरुद्ध: एथलीट कैमरे से बहुत दूर है! थोड़ा पास आएँ जब तक एड़ी हरे फ़र्श ज़ोन में न आ जाए।"),
            { soleY: rawSoleY, vertexY, estDistM: 3.10, distanceError: "TOO_FAR" });
        }
      }

      const effCmPerPx = (activeCalib.method === "tape" || activeCalib.method === "person")
        ? activeCalib.cmPerPx
        : cmPerPxOptics;
      const cm = bodyPx * effCmPerPx;

      return {
        postureOk: true,
        bodyPx: Math.round(bodyPx),
        vertexY,
        soleY: Math.min(H - 4, soleY),
        estDistM,
        vertexSource,
        cm,
        cmPerPx: effCmPerPx,
        calibMethod: activeCalib.method,
        headRoll,
        liveMetric: `✅ ${t("DISTANCE OK", "दूरी सही")} · ${cm.toFixed(1)} cm (±1.5 cm)`,
        reason: `✅ ${t("Distance is CORRECT — Hold still!", "दूरी सही है — स्थिर खड़े रहें!")} · ${bodyPx.toFixed(0)} px × ${effCmPerPx.toFixed(4)} cm/px`
      };
    }

    // TEST 3 — SIT AND REACH
    // Uses Rung 1/2 (tapped ruler/box scale) when calibrated, OR Rung 3 (athlete's measured height / tibia scale) automatically!
    function evalSitReach(lm, mask, W, H, calib, athlete) {
      const s = sideChain(lm);
      for (const i of [s.sh, s.hip, s.kn, s.an]) {
        if (!vis(lm, i, 0.42)) {
          return fail(t("Side profile required", "बगल से दृश्य चाहिए"),
            t("Camera at your side: shoulder, hip, knee, ankle, toes and hands visible.", "कैमरा बगल में रखें: कंधा, कूल्हा, घुटना, टखना और हाथ दिखें।"));
        }
      }
      if (!vis(lm, s.wr, 0.38) && !vis(lm, s.idx, 0.38)) {
        return fail(t("Hands not visible", "हाथ नहीं दिख रहे"), t("Keep your reaching hands visible in frame.", "अपने हाथ फ्रेम में रखें।"));
      }
      const p = (i) => P(lm, i, W, H);
      const hip = p(s.hip), kn = p(s.kn), an = p(s.an), sh = p(s.sh);
      const wr = vis(lm, s.wr, 0.35) ? p(s.wr) : p(s.idx);
      const ft = vis(lm, s.ft, 0.35) ? p(s.ft) : an;
      const heel = vis(lm, s.heel, 0.35) ? p(s.heel) : an;

      const legLen = dist2D(hip, an);
      const legSlope = Math.abs(Math.atan2(an.y - hip.y, Math.abs(an.x - hip.x) + 1e-6)) * 180 / Math.PI;
      if (legSlope > 34 || legLen < 0.14 * Math.max(W, H)) {
        return fail(`${t("Not seated on floor", "ज़मीन पर नहीं बैठे")} (${legSlope.toFixed(0)}°)`,
          t("Wrong posture/exercise: Sit flat on the floor with legs extended horizontally!", "ज़मीन पर बैठकर पैर सीधे फैलाएँ (खड़े होने पर अमान्य)।"),
          { isWrongExercise: true });
      }
      if (sh.y > hip.y + 0.08 * legLen) {
        return fail(t("Lying flat (not seated)", "लेटे हुए हैं"),
          t("Sit upright with legs extended forward for Sit & Reach.", "सिट एंड रीच के लिए बैठकर आगे झुकें।"),
          { isWrongExercise: true });
      }

      const kneeDegPrimary = angleDeg(hip, kn, an);
      // Also check the opposite knee if clearly visible so bending either knee is caught
      const oHip = s.hip === 23 ? 24 : 23, oKn = s.kn === 25 ? 26 : 25, oAn = s.an === 27 ? 28 : 27;
      const kneeDegOther = (vis(lm, oHip, 0.50) && vis(lm, oKn, 0.50) && vis(lm, oAn, 0.50))
        ? angleDeg(p(oHip), p(oKn), p(oAn))
        : 180;
      const kneeDeg = Math.min(kneeDegPrimary, kneeDegOther);

      // Detect if the knee is lifted UP off the hip->ankle floor line ("knees up"):
      // On a flat floor, the knee Y must stay on/near the line connecting hip.y and an.y,
      // and the thigh (hip->kn) must not slope upward toward the chest.
      const floorYAtKnee = 0.5 * (hip.y + an.y);
      const kneeLiftRatio = (floorYAtKnee - kn.y) / legLen;
      const otherKneeLiftRatio = (vis(lm, oKn, 0.50)) ? ((floorYAtKnee - p(oKn).y) / legLen) : 0;
      const maxKneeLiftRatio = Math.max(kneeLiftRatio, otherKneeLiftRatio);
      const thighUpFoul = kn.y < (hip.y - 0.04 * legLen);

      const trunkDeg = angleDeg(sh, hip, kn);
      const u = { x: (an.x - hip.x) / legLen, y: (an.y - hip.y) / legLen };
      const handLm = vis(lm, s.idx, 0.38) ? p(s.idx) : wr;
      const lmProj = (handLm.x - ft.x) * u.x + (handLm.y - ft.y) * u.y;

      let tip = null;
      if (mask) {
        const handLen = Math.max(dist2D(wr, handLm), 0.03 * Math.max(W, H));
        const footLen = Math.max(dist2D(heel, ft), 1);
        const exclude = (x, y) => distToSegment(x, y, heel, ft) < 0.35 * footLen || distToSegment(x, y, an, ft) < 0.35 * footLen;
        const best = maskFarthestAlong(mask, W, H, handLm, handLen * 2.0, ft, u, exclude);
        if (best && best.proj >= lmProj) tip = best;
      }

      const reachPx = tip ? tip.proj : lmProj;
      const tipPt = tip ? { x: tip.x, y: tip.y } : handLm;
      // Projection of fingertips from hip along the leg axis (0.0 = hip, ~0.52 = knee, 1.0 = ankle)
      const handLegRatio = ((tipPt.x - hip.x) * u.x + (tipPt.y - hip.y) * u.y) / legLen;

      // Scale selection: Rung 1/2 (tapped ruler) -> Rung 3 (athlete's measured height / full leg & tibia length)
      let cmPerPx = calib?.cmPerPx || null;
      let scaleMode = calib ? "Rung 1/2 Ruler" : "Rung 3 Segment Scale";
      if (!cmPerPx) {
        const refHeightCm = getAthleteRefHeightCm(athlete);
        const tibiaCm = refHeightCm * 0.242;
        const tibiaPx = Math.max(legLen * 0.46, dist2D(kn, an));
        cmPerPx = tibiaCm / tibiaPx;
      }

      const reachCm = reachPx * cmPerPx; // relative to the toes, used for posture gating only
      const boxOffset = state.boxZeroCm !== undefined ? state.boxZeroCm : 23.0; // tape mark that sits on the heel line (23 cm)
      // Revised handbook: the score is the tape reading and 23 cm is the heel line, so measure from the heel, not the toes.
      const heelOffsetCm = Math.max(0, ((ft.x - heel.x) * u.x + (ft.y - heel.y) * u.y) * cmPerPx);
      const scoreCm = boxOffset + reachCm + heelOffsetCm;
      // Knees are flat & straight ONLY if angle >= 165°, knee is not lifted above floor line, thigh doesn't point up, and trunk-thigh angle >= 22°
      const kneeUp = maxKneeLiftRatio > 0.058 || thighUpFoul || trunkDeg < 22;
      const kneeOk = kneeDeg >= 165 && !kneeUp;
      const isReaching = handLegRatio >= 0.68 && trunkDeg <= 78 && reachCm >= -18.0;

      // SAI Handbook Test III Two-Hand Symmetry Check (hands must be on top of each other or side-by-side, not a one-arm reach):
      let handAsymmetryCm = 0;
      if (vis(lm, 15, 0.55) && vis(lm, 16, 0.55)) {
        const wL = p(15), wR = p(16);
        const diffProjPx = Math.abs((wL.x - wR.x) * u.x + (wL.y - wR.y) * u.y);
        handAsymmetryCm = diffProjPx * cmPerPx;
      }

      return {
        postureOk: true,
        kneeOk,
        kneeUp,
        kneeDeg,
        maxKneeLiftRatio,
        trunkDeg,
        handLegRatio,
        handAsymmetryCm,
        isReaching,
        reachPx,
        reachCm,
        heelOffsetCm,
        scoreCm,
        cmPerPx,
        scaleMode,
        tipX: tip ? tip.x : handLm.x,
        tipY: tip ? tip.y : handLm.y,
        toeX: ft.x,
        toeY: ft.y,
        tipSource: tip ? "mask" : "landmark",
        liveMetric: !kneeOk
          ? `${t("FOUL: Knees up/bent", "फाउल: घुटने उठे/मुड़े")} (${kneeDeg.toFixed(0)}°)`
          : (isReaching
              ? `${scoreCm.toFixed(1)} cm (${t("tape reading", "टेप रीडिंग")})`
              : t("Seated — bend forward & reach toward toes", "बैठे हैं — आगे झुकें और पंजों की ओर हाथ बढ़ाएँ")),
        reason: !kneeOk
          ? `${t("FOUL: Keep knees flat on floor", "फाउल: घुटने ज़मीन पर सीधे रखें")} (${kneeDeg.toFixed(0)}° < 165°)`
          : (isReaching
              ? `${scaleMode} · ${t("Knee", "घुटना")} ${kneeDeg.toFixed(0)}° ✓ · ${t("Reach", "पहुँच")} ${scoreCm.toFixed(1)} cm`
              : `${t("Trunk", "धड़")} ${trunkDeg.toFixed(0)}° — ${t("Lean forward and slide hands past knees toward toes", "आगे झुकें और हाथों को घुटनों से आगे पंजों की ओर ले जाएँ")}`)
      };
    }

    // TEST 4 — STANDING VERTICAL JUMP
    function evalJump(lm, mask, W, H) {
      for (const i of [11, 12, 23, 24, 25, 26, 27, 28]) {
        if (!vis(lm, i, 0.45)) {
          return fail(t("Full body needed", "पूरा शरीर चाहिए"),
            t("Shoulders, hips, knees and ankles must stay clearly in frame.", "कंधे, कूल्हे, घुटने और टखने फ्रेम में रहें।"));
        }
      }
      const p = (i) => P(lm, i, W, H);
      const shMid = mid(p(11), p(12));
      const hipMid = mid(p(23), p(24));
      // Use consistent ankle landmarks (27, 28) — NEVER switch dynamically between toes (31,32) and ankles (27,28),
      // because toe visibility flickering across frames causes a false ~7 cm vertical jump when standing still!
      // Using Math.max(p(27).y, p(28).y) ensures BOTH ankles must leave the ground for footY to rise.
      const footY = Math.max(p(27).y, p(28).y);
      const ankleMidX = 0.5 * (p(27).x + p(28).x);
      const ankleMidY = 0.5 * (p(27).y + p(28).y);
      const kneeDeg = Math.min(angleDeg(p(23), p(25), p(27)), angleDeg(p(24), p(26), p(28)));
      return {
        postureOk: true,
        shY: shMid.y,
        hipX: hipMid.x,
        hipY: hipMid.y,
        ankX: ankleMidX,
        footY,
        ankleMidY,
        kneeDeg,
        hipToFootPx: Math.max(H * 0.12, ankleMidY - hipMid.y),
        shToFootPx: Math.max(H * 0.22, ankleMidY - shMid.y),
        liveMetric: `${t("Knee", "घुटना")} ${kneeDeg.toFixed(0)}° · ${t("Ready", "तैयार")}`,
        reason: t("Stand still ~1 s, then jump straight up and land in frame.", "~1 सेकंड स्थिर खड़े रहें, फिर सीधा ऊपर कूदें।")
      };
    }

    // TEST 9 — SIT-UPS (Scale-free isotropic joint angles + revised KHOJ handbook, Rule 2a, 2b, 2c)
    // Enforces:
    //  - Rule 1: Lying on floor (rejects standing or upright swinging without lying flat on back <= 28°)
    //  - Setup: Knees MUST be bent (60°–120°; the handbook says under 90°, relaxed for pose-estimation noise) with knee apex raised above the hip-ankle floor line
    //  - Rule 2a: Hands clasped behind neck/head
    //  - Rule 2b: Curl torso up (>= 46°) until elbows reach knees WITHOUT pushing off the floor with the elbow
    //  - Rule 2c: Return shoulder blades & elbows flat to floor (torsoDeg <= 28° and hipDeg >= 104°) before next rep counts
    function evalSitUps(lm, mask, W, H) {
      const s = sideChain(lm);
      for (const i of [s.sh, s.hip, s.kn, s.an]) {
        if (!vis(lm, i, 0.38)) {
          return fail(t("Side profile needed (Show Full Legs)", "बगल से दृश्य चाहिए (पूरे पैर दिखाएँ)"),
            t("Lie side-on to the camera: shoulder, hip, bent knees, and ankles must all be visible.", "कैमरे की ओर बगल से लेटें: कंधा, कूल्हा, मुड़े घुटने और टखने साफ़ दिखने चाहिए।"));
        }
      }
      const p = (i) => P(lm, i, W, H);
      const sh = p(s.sh), hip = p(s.hip), kn = p(s.kn), an = p(s.an);
      const femur = Math.max(dist2D(hip, kn), 1);
      const tibia = Math.max(dist2D(kn, an), 1);
      const torso = Math.max(dist2D(sh, hip), 1);

      // Gate 1: Reject standing upright or kneeling (when ankles are vertically far below hips)
      const legVertDrop = an.y - hip.y;
      if (legVertDrop > 0.70 * (femur + tibia) || (an.y - sh.y > 1.45 * Math.max(Math.abs(sh.x - an.x), 1) && hip.y < kn.y - 0.35 * femur)) {
        return fail(
          t("🚫 FOUL: Standing — Lie on Floor!", "🚫 फाउल: खड़े हैं — ज़मीन पर लेटें!"),
          t("Sit-Ups must be performed lying on the floor with knees bent (standing/vertical posture is rejected).",
            "सिट-अप्स ज़मीन पर पीठ के बल लेटकर घुटने मोड़कर करें (खड़े होना अमान्य है)।"),
          { isWrongExercise: true }
        );
      }

      const hipDeg = angleDeg(sh, hip, kn);
      // True torso angle relative to horizontal floor: 0° = lying flat on back, 90° = sitting straight upright
      const torsoDeg = Math.atan2(Math.max(0, hip.y - sh.y), Math.abs(sh.x - hip.x) + 1e-6) * 180 / Math.PI;
      const kneeDeg = angleDeg(hip, kn, an);

      // Knee apex must rise above (smaller Y than) the hip-to-ankle floor baseline AND knee angle must be bent (≤ 120°)
      const floorLineY = 0.5 * (hip.y + an.y);
      const kneeApexRiseRatio = (floorLineY - kn.y) / femur;
      const kneeBentOk = kneeDeg <= 120 && kneeDeg >= 40 && kneeApexRiseRatio >= 0.12;

      const hasEl = vis(lm, s.el, 0.35);
      const elPt = hasEl ? p(s.el) : null;
      const elbowKnee = hasEl ? dist2D(elPt, kn) / femur : null;
      const elbowY = hasEl ? elPt.y : sh.y;
      const wristEar = (vis(lm, s.wr, 0.35) && vis(lm, s.ear, 0.35))
        ? Math.min(dist2D(p(s.wr), p(s.ear)), vis(lm, 0, 0.35) ? dist2D(p(s.wr), p(0)) : 999) / torso
        : null;

      const isSupineFlat = torsoDeg <= 28 && hipDeg >= 104;
      const isCurledUp = torsoDeg >= 46 && hipDeg <= 90;

      let stateText;
      if (!kneeBentOk) {
        stateText = `🚫 ${t("FOUL: Knees Straight", "फाउल: घुटने सीधे हैं")} (${kneeDeg.toFixed(0)}° > 120°) — ${t("BEND KNEES!", "घुटने मोड़ें!")}`;
      } else if (isSupineFlat) {
        stateText = `✅ ${t("FLAT ON BACK", "पीठ के बल लेटे हैं")} (${torsoDeg.toFixed(0)}°) · ${t("Knee", "घुटना")} ${kneeDeg.toFixed(0)}° ✓ — ⬆️ ${t("Curl Up!", "ऊपर उठें!")}`;
      } else if (isCurledUp) {
        stateText = `⬆️ ${t("TOP CURL", "ऊपर उठे")} (Hip ${hipDeg.toFixed(0)}°) · ${t("Knee", "घुटना")} ${kneeDeg.toFixed(0)}° ✓ — ⬇️ ${t("Return Flat!", "वापस सीधा लेटें!")}`;
      } else {
        stateText = `${t("Torso", "धड़")} ${torsoDeg.toFixed(0)}° · ${t("Hip", "कूल्हा")} ${hipDeg.toFixed(0)}° · ${t("Knee", "घुटना")} ${kneeDeg.toFixed(0)}° ✓`;
      }

      return {
        postureOk: true,
        hipDeg,
        torsoDeg,
        kneeDeg,
        kneeBentOk,
        kneeApexRiseRatio,
        isSupineFlat,
        isCurledUp,
        elbowKnee,
        elbowY,
        torsoPx: torso,
        wristEar,
        shX: sh.x, shY: sh.y,
        hipX: hip.x, hipY: hip.y,
        knX: kn.x, knY: kn.y,
        anX: an.x, anY: an.y,
        liveMetric: stateText,
        reason: !kneeBentOk
          ? t("🚫 FOUL (Setup): Your knees are straight! Bend your knees (~90°) with feet flat on the floor.", "🚫 फाउल (सेटअप): आपके घुटने सीधे हैं! घुटनों को ~90° मोड़ें और पैर ज़मीन पर रखें।")
          : t("Start flat on back (Torso ≤28°) → Curl up to knees (Torso ≥46°, Hip ≤88°) → Return flat to floor (≤28°).",
              "पीठ के बल सीधा लेटें (धड़ ≤28°) → घुटनों तक उठें (धड़ ≥46°) → वापस सीधा लेटें (≤28°)।")
      };
    }

    // TEST 5 — STANDING BROAD JUMP (Side-Profile Horizontal Two-Foot Jump: Take-Off Toe to Nearest Landing Heel)
    function evalBroadJump(lm, mask, W, H, calib, athlete) {
      const s = sideChain(lm);
      for (const i of [s.sh, s.hip, s.kn, s.an]) {
        if (!vis(lm, i, 0.40)) {
          return fail(t("Full body side profile needed", "पूरा शरीर बगल से दिखना चाहिए"),
            t("Stand sideways (90° side profile) so shoulder, hip, knee and ankle stay clearly inside the frame.", "कैमरे के सामने बगल से (90° साइड प्रोफ़ाइल) खड़े हों ताकि कंधा, कूल्हा, घुटना और टखना साफ़ दिखें।"));
        }
      }
      const p = (i) => P(lm, i, W, H);
      const bothSh = vis(lm, 11, 0.35) && vis(lm, 12, 0.35);
      const bothHip = vis(lm, 23, 0.35) && vis(lm, 24, 0.35);
      const bothAnk = vis(lm, 27, 0.35) && vis(lm, 28, 0.35);

      const shMid = bothSh ? mid(p(11), p(12)) : p(s.sh);
      const hipMid = bothHip ? mid(p(23), p(24)) : p(s.hip);
      const ankleMidX = bothAnk ? 0.5 * (p(27).x + p(28).x) : p(s.an).x;
      const ankleMidY = bothAnk ? 0.5 * (p(27).y + p(28).y) : p(s.an).y;
      const footY = bothAnk ? Math.max(p(27).y, p(28).y) : p(s.an).y;
      const ankleSpreadX = bothAnk ? Math.abs(p(27).x - p(28).x) : 0;
      const torsoPx = Math.max(H * 0.08, dist2D(shMid, hipMid));

      // Gate 1: Reject sitting or lying down during Broad Jump
      if (ankleMidY - hipMid.y < 0.55 * torsoPx) {
        return fail(
          t("🚫 FOUL: Seated/Lying — Stand Upright!", "🚫 फाउल: बैठे/लेटे हैं — सीधे खड़े हों!"),
          t("Standing Broad Jump starts from an upright two-foot standing posture.", "स्टैंडिंग ब्रॉड जंप सीधे खड़े होकर दोनों पैरों से किया जाता है।"),
          { isWrongExercise: true }
        );
      }

      // Gate 2: Side-Profile Gate — Reject facing the camera directly!
      // Because a 2D camera measures horizontal jump distance across the screen (left <-> right),
      // facing the camera (where shoulder width and hip width are wide horizontally) MUST be blocked!
      const shWidthPx = bothSh ? Math.abs(p(11).x - p(12).x) : 0;
      const hipWidthPx = bothHip ? Math.abs(p(23).x - p(24).x) : 0;
      if (shWidthPx > 0.46 * torsoPx && hipWidthPx > 0.28 * torsoPx) {
        return fail(
          t("🚫 Turn Sideways (Side Profile Required)!", "🚫 बगल की ओर मुड़ें (साइड प्रोफ़ाइल आवश्यक)!"),
          t("You are facing the camera! Turn 90° sideways so you jump across the screen (left-to-right or right-to-left).",
            "आप कैमरे की ओर मुँह करके खड़े हैं! 90° बगल की ओर मुड़ें ताकि आप स्क्रीन के एक तरफ़ से दूसरी तरफ़ कूद सकें।")
        );
      }

      const nearLegPx = dist2D(p(s.hip), p(s.kn)) + dist2D(p(s.kn), p(s.an));
      const legL = (vis(lm, 23, 0.35) && vis(lm, 25, 0.35) && vis(lm, 27, 0.35)) ? (dist2D(p(23), p(25)) + dist2D(p(25), p(27))) : nearLegPx;
      const legR = (vis(lm, 24, 0.35) && vis(lm, 26, 0.35) && vis(lm, 28, 0.35)) ? (dist2D(p(24), p(26)) + dist2D(p(26), p(28))) : nearLegPx;
