          t("Feet Blocked by Table — Upload Wall Mark or Step Back", "मेज़ से पैर ढके हैं — दीवार का निशान अपलोड करें या पीछे हटें"),
          t("🚫 A table/object is hiding your feet! Either keep a 150 cm sticky note on the wall, or place the phone where your heels are visible.",
            "🚫 मेज़ आपके पैरों को ढक रही है! या तो दीवार पर 150 सेमी का स्टिकी नोट लगाएँ, या फ़ोन ऐसी जगह रखें जहाँ एड़ी साफ़ दिखे।"),
          { soleY: rawSoleY, vertexY }
        );
      }

      const soleY = rawSoleY;
      if (rawSoleY >= H * 0.992) {
        return fail(t("Feet cut off — Step BACK!", "पैर कट रहे हैं — पीछे हटें!"),
          t("🚫 Feet touch the bottom edge — step back until heels are inside the Green Zone.", "🚫 पैर नीचे किनारे पर हैं — पीछे हटें जब तक एड़ी हरे ज़ोन में न आ जाए।"),
          { soleY: rawSoleY, vertexY });
      }

      const bodyPx = soleY - vertexY;
      const estDistM = stationDistM;

      if (bodyPx < H * 0.28) {
        return fail(`${t("📏 TOO FAR — Step CLOSER!", "📏 बहुत दूर — पास आएँ!")}`,
          t("🚫 BLOCKED: Too far from camera! Step CLOSER until heels are inside the GREEN Floor Zone.",
            "🚫 अवरुद्ध: कैमरे से बहुत दूर हैं! पास आएँ जब तक एड़ी हरे ज़ोन में न आ जाए।"),
          { soleY: rawSoleY, vertexY, estDistM, distanceError: "TOO_FAR" });
      }
      if (Math.abs(shMid.x - anMid.x) > 0.14 * bodyPx) {
        return fail(t("Leaning — Stand Straight", "झुके हुए — सीधे खड़े हों"),
          t("🚫 Stand straight and vertical with weight evenly on both feet.", "🚫 बिल्कुल सीधे खड़े हों।"),
          { soleY: rawSoleY, vertexY, estDistM });
      }

      // ---------------------------------------------------------------
      // SAI 2-POINT WALL STADIOMETER MODE (Rung 2, GREEN)
      // ---------------------------------------------------------------
      if (activeCalib.method === "wall") {
        const sy = H / (activeCalib.frameH || H);
        const yF = activeCalib.yFloor * sy;
        const yM = activeCalib.yMark * sy;
        const k = Math.max(0.5, (yF - yM) / activeCalib.markCm);
        const cmPerPxWall = 1.0 / k;
        const deltaCm = (yM - vertexY) * cmPerPxWall;
        const cmW = activeCalib.markCm + deltaCm;
        return {
          postureOk: true,
          bodyPx,
          vertexY,
          soleY: yF,
          stickyTopY: yM,
          estDistM: (fPx * cmPerPxWall) / 100.0,
          vertexSource,
          cm: cmW,
          cmPerPx: cmPerPxWall,
          calibMethod: "wall",
          headRoll,
          wallFloorY: yF,
          liveMetric: `✅ ${cmW.toFixed(1)} cm (${deltaCm >= 0 ? "+" : ""}${deltaCm.toFixed(1)} cm vs ${activeCalib.markCm} cm mark)`,
          reason: `✅ ${t("Wall Mark Locked", "दीवार निशान लॉक")} (${activeCalib.markCm} cm) → ${cmW.toFixed(1)} cm`
        };
      }

      // ---------------------------------------------------------------
      // GUIDED 2.50 m FLOOR-ZONE MODE (Default Rung 4 Mode)
      // ---------------------------------------------------------------
      if (activeCalib.method === "distance") {
        if (rawSoleY > H * 0.855 || headNeckPx > H * 0.076) {
          return fail(t("📏 TOO CLOSE — Step BACK!", "📏 बहुत पास — पीछे हटें!"),
            t("🚫 BLOCKED: Athlete is TOO CLOSE! Step BACK until heels are inside the GREEN Floor Zone.",
              "🚫 अवरुद्ध: एथलीट कैमरे के बहुत पास है! पीछे हटें जब तक एड़ी हरे फ़र्श ज़ोन में न आ जाए।"),
            { soleY: rawSoleY, vertexY, estDistM: 1.95, distanceError: "TOO_CLOSE" });
        }
        if (rawSoleY < H * 0.735) {
          return fail(t("📏 TOO FAR — Step CLOSER!", "📏 बहुत दूर — पास आएँ!"),
            t("🚫 BLOCKED: Athlete is TOO FAR! Step CLOSER until heels are inside the GREEN Floor Zone.",
              "🚫 अवरुद्ध: एथलीट कैमरे से बहुत दूर है! थोड़ा पास आएँ जब तक एड़ी हरे फ़र्श ज़ोन में न आ जाए।"),
            { soleY: rawSoleY, vertexY, estDistM: 3.10, distanceError: "TOO_FAR" });
        }
      }

      const effCmPerPx = (activeCalib.method === "tape" || activeCalib.method === "person")
        ? activeCalib.cmPerPx
        : cmPerPxOptics;
      const cm = bodyPx * effCmPerPx;

      return {
        postureOk: true,
        bodyPx: Math.round(bodyPx),
        vertexY,
        soleY: Math.min(H - 4, soleY),
        estDistM,
        vertexSource,
        cm,
        cmPerPx: effCmPerPx,
        calibMethod: activeCalib.method,
        headRoll,
        liveMetric: `✅ ${t("DISTANCE OK", "दूरी सही")} · ${cm.toFixed(1)} cm (${t("estimate", "अनुमान")})`,
        reason: `✅ ${t("Distance is CORRECT — Hold still!", "दूरी सही है — स्थिर खड़े रहें!")} · ${bodyPx.toFixed(0)} px × ${effCmPerPx.toFixed(4)} cm/px`
      };
    }

    // TEST 3 — SIT AND REACH
    // Uses Rung 1/2 (tapped ruler/box scale) when calibrated, OR Rung 3 (athlete's measured height / tibia scale) automatically!
    function evalSitReach(lm, mask, W, H, calib, athlete) {
      const s = sideChain(lm);
      for (const i of [s.sh, s.hip, s.kn, s.an]) {
        if (!vis(lm, i, 0.42)) {
          return fail(t("Side profile required", "बगल से दृश्य चाहिए"),
            t("Camera at your side: shoulder, hip, knee, ankle, toes and hands visible.", "कैमरा बगल में रखें: कंधा, कूल्हा, घुटना, टखना और हाथ दिखें।"));
        }
      }
      if (!vis(lm, s.wr, 0.38) && !vis(lm, s.idx, 0.38)) {
        return fail(t("Hands not visible", "हाथ नहीं दिख रहे"), t("Keep your reaching hands visible in frame.", "अपने हाथ फ्रेम में रखें।"));
      }
      const p = (i) => P(lm, i, W, H);
      const hip = p(s.hip), kn = p(s.kn), an = p(s.an), sh = p(s.sh);
      const wr = vis(lm, s.wr, 0.35) ? p(s.wr) : p(s.idx);
      const ft = vis(lm, s.ft, 0.35) ? p(s.ft) : an;
      const heel = vis(lm, s.heel, 0.35) ? p(s.heel) : an;

      const legLen = dist2D(hip, an);
      const legSlope = Math.abs(Math.atan2(an.y - hip.y, Math.abs(an.x - hip.x) + 1e-6)) * 180 / Math.PI;
      if (legSlope > 34 || legLen < 0.14 * Math.max(W, H)) {
        return fail(`${t("Not seated on floor", "ज़मीन पर नहीं बैठे")} (${legSlope.toFixed(0)}°)`,
          t("Wrong posture/exercise: Sit flat on the floor with legs extended horizontally!", "ज़मीन पर बैठकर पैर सीधे फैलाएँ (खड़े होने पर अमान्य)।"),
          { isWrongExercise: true });
      }
      if (sh.y > hip.y + 0.08 * legLen) {
        return fail(t("Lying flat (not seated)", "लेटे हुए हैं"),
          t("Sit upright with legs extended forward for Sit & Reach.", "सिट एंड रीच के लिए बैठकर आगे झुकें।"),
          { isWrongExercise: true });
      }

      const kneeDegPrimary = angleDeg(hip, kn, an);
      // Also check the opposite knee if clearly visible so bending either knee is caught
      const oHip = s.hip === 23 ? 24 : 23, oKn = s.kn === 25 ? 26 : 25, oAn = s.an === 27 ? 28 : 27;
      const kneeDegOther = (vis(lm, oHip, 0.50) && vis(lm, oKn, 0.50) && vis(lm, oAn, 0.50))
        ? angleDeg(p(oHip), p(oKn), p(oAn))
        : 180;
      const kneeDeg = Math.min(kneeDegPrimary, kneeDegOther);

      // Detect if the knee is lifted UP off the hip->ankle floor line ("knees up"):
      // On a flat floor, the knee Y must stay on/near the line connecting hip.y and an.y,
      // and the thigh (hip->kn) must not slope upward toward the chest.
      const floorYAtKnee = 0.5 * (hip.y + an.y);
      const kneeLiftRatio = (floorYAtKnee - kn.y) / legLen;
      const otherKneeLiftRatio = (vis(lm, oKn, 0.50)) ? ((floorYAtKnee - p(oKn).y) / legLen) : 0;
      const maxKneeLiftRatio = Math.max(kneeLiftRatio, otherKneeLiftRatio);
      const thighUpFoul = kn.y < (hip.y - 0.04 * legLen);

      const trunkDeg = angleDeg(sh, hip, kn);
      const u = { x: (an.x - hip.x) / legLen, y: (an.y - hip.y) / legLen };
      const handLm = vis(lm, s.idx, 0.38) ? p(s.idx) : wr;
      const lmProj = (handLm.x - ft.x) * u.x + (handLm.y - ft.y) * u.y;

      let tip = null;
      if (mask) {
        const handLen = Math.max(dist2D(wr, handLm), 0.03 * Math.max(W, H));
        const footLen = Math.max(dist2D(heel, ft), 1);
        const exclude = (x, y) => distToSegment(x, y, heel, ft) < 0.35 * footLen || distToSegment(x, y, an, ft) < 0.35 * footLen;
        const best = maskFarthestAlong(mask, W, H, handLm, handLen * 2.0, ft, u, exclude);
        if (best && best.proj >= lmProj) tip = best;
      }

      // Handbook Test III: the 23 cm mark is on the HEEL line, so reach is measured from the heels, not the toes.
      // The toes point up and sit a few cm past the heels; add that gap when the heel is visible.
      const heelSeen = vis(lm, s.heel, 0.35);
      const toeAheadOfHeelPx = heelSeen ? (ft.x - heel.x) * u.x + (ft.y - heel.y) * u.y : 0;
      // Capped at half the foot length so a misplaced heel point cannot add a large jump.
      const heelGapPx = Math.min(Math.max(0, toeAheadOfHeelPx), 0.5 * dist2D(heel, ft));
      const reachPx = (tip ? tip.proj : lmProj) + heelGapPx;
      const refLine = heelSeen ? t("vs heel line", "एड़ी रेखा से") : t("vs toes", "पंजों से");
      const tipPt = tip ? { x: tip.x, y: tip.y } : handLm;
      // Projection of fingertips from hip along the leg axis (0.0 = hip, ~0.52 = knee, 1.0 = ankle)
      const handLegRatio = ((tipPt.x - hip.x) * u.x + (tipPt.y - hip.y) * u.y) / legLen;

      // Scale selection: Rung 1/2 (tapped ruler) -> Rung 3 (athlete's measured height / full leg & tibia length)
      let cmPerPx = calib?.cmPerPx || null;
      let scaleMode = calib ? "Rung 1/2 Ruler" : "Rung 3 Segment Scale";
      if (!cmPerPx) {
        const refHeightCm = getAthleteRefHeightCm(athlete);
        const tibiaCm = refHeightCm * 0.242;
        const tibiaPx = Math.max(legLen * 0.46, dist2D(kn, an));
        cmPerPx = tibiaCm / tibiaPx;
      }

      const reachCm = reachPx * cmPerPx;
      const boxOffset = state.boxZeroCm !== undefined ? state.boxZeroCm : 23.0;
      const scoreCm = boxOffset + reachCm;
      // Knees are flat & straight ONLY if angle >= 165°, knee is not lifted above floor line, thigh doesn't point up, and trunk-thigh angle >= 22°
      const kneeUp = maxKneeLiftRatio > 0.058 || thighUpFoul || trunkDeg < 22;
      const kneeOk = kneeDeg >= 165 && !kneeUp;
      const isReaching = handLegRatio >= 0.68 && trunkDeg <= 78 && reachCm >= -18.0;

      // SAI Handbook Test III Two-Hand Symmetry Check (hands must be on top of each other or side-by-side, not a one-arm reach):
      let handAsymmetryCm = 0;
      if (vis(lm, 15, 0.55) && vis(lm, 16, 0.55)) {
        const wL = p(15), wR = p(16);
        const diffProjPx = Math.abs((wL.x - wR.x) * u.x + (wL.y - wR.y) * u.y);
        handAsymmetryCm = diffProjPx * cmPerPx;
      }

      return {
        postureOk: true,
        kneeOk,
        kneeUp,
        kneeDeg,
        maxKneeLiftRatio,
        trunkDeg,
        handLegRatio,
        handAsymmetryCm,
        isReaching,
        reachPx,
        reachCm,
        scoreCm,
        cmPerPx,
        scaleMode,
        refLine,
        tipX: tip ? tip.x : handLm.x,
        tipY: tip ? tip.y : handLm.y,
        toeX: ft.x,
        toeY: ft.y,
        tipSource: tip ? "mask" : "landmark",
        liveMetric: !kneeOk
          ? `${t("FOUL: Knees up/bent", "फाउल: घुटने उठे/मुड़े")} (${kneeDeg.toFixed(0)}°)`
          : (isReaching
              ? `${scoreCm.toFixed(1)} cm (${reachCm >= 0 ? "+" : ""}${reachCm.toFixed(1)} cm ${refLine})`
              : t("Seated — bend forward & reach toward toes", "बैठे हैं — आगे झुकें और पंजों की ओर हाथ बढ़ाएँ")),
        reason: !kneeOk
          ? `${t("FOUL: Keep knees flat on floor", "फाउल: घुटने ज़मीन पर सीधे रखें")} (${kneeDeg.toFixed(0)}° < 165°)`
          : (isReaching
              ? `${scaleMode} · ${t("Knee", "घुटना")} ${kneeDeg.toFixed(0)}° ✓ · ${t("Reach", "पहुँच")} ${scoreCm.toFixed(1)} cm`
              : `${t("Trunk", "धड़")} ${trunkDeg.toFixed(0)}° — ${t("Lean forward and slide hands past knees toward toes", "आगे झुकें और हाथों को घुटनों से आगे पंजों की ओर ले जाएँ")}`)
      };
    }

    // TEST 4 — STANDING VERTICAL JUMP
    function evalJump(lm, mask, W, H) {
      for (const i of [11, 12, 23, 24, 25, 26, 27, 28]) {
        if (!vis(lm, i, 0.45)) {
          return fail(t("Full body needed", "पूरा शरीर चाहिए"),
            t("Shoulders, hips, knees and ankles must stay clearly in frame.", "कंधे, कूल्हे, घुटने और टखने फ्रेम में रहें।"));
        }
      }
      const p = (i) => P(lm, i, W, H);
      const shMid = mid(p(11), p(12));
      const hipMid = mid(p(23), p(24));
      // Use consistent ankle landmarks (27, 28) — NEVER switch dynamically between toes (31,32) and ankles (27,28),
      // because toe visibility flickering across frames causes a false ~7 cm vertical jump when standing still!
      // Using Math.max(p(27).y, p(28).y) ensures BOTH ankles must leave the ground for footY to rise.
      const footY = Math.max(p(27).y, p(28).y);
      const ankleMidX = 0.5 * (p(27).x + p(28).x);
      const ankleMidY = 0.5 * (p(27).y + p(28).y);
      const kneeDeg = Math.min(angleDeg(p(23), p(25), p(27)), angleDeg(p(24), p(26), p(28)));
      return {
        postureOk: true,
        shY: shMid.y,
        hipX: hipMid.x,
        hipY: hipMid.y,
        ankX: ankleMidX,
        footY,
        ankleMidY,
        kneeDeg,
        hipToFootPx: Math.max(H * 0.12, ankleMidY - hipMid.y),
        shToFootPx: Math.max(H * 0.22, ankleMidY - shMid.y),
        liveMetric: `${t("Knee", "घुटना")} ${kneeDeg.toFixed(0)}° · ${t("Ready", "तैयार")}`,
        reason: t("Stand still ~1 s, then jump straight up and land in frame.", "~1 सेकंड स्थिर खड़े रहें, फिर सीधा ऊपर कूदें।")
      };
    }

    // TEST 9 — SIT-UPS (Scale-free isotropic joint angles + SAI Handbook Rules 1, 2, 3a, 3b, 3c)
    // Enforces:
    //  - Rule 1: Lying on floor (rejects standing or upright swinging without lying flat on back <= 28°)
    //  - Rule 2: Knees MUST be bent (60°–100°) with knee apex raised above the hip-ankle floor line + No resting > 3.0s between reps
    //  - Rule 3a: Hands clasped behind neck/head
    //  - Rule 3b: Curl torso up (>= 46°) until elbows reach knees WITHOUT pushing off the floor with the elbow
    //  - Rule 3c: Return shoulder blades & elbows flat to floor (torsoDeg <= 28° and hipDeg >= 104°) before next rep counts
    function evalSitUps(lm, mask, W, H) {
      const s = sideChain(lm);
      for (const i of [s.sh, s.hip, s.kn, s.an]) {
        if (!vis(lm, i, 0.38)) {
          return fail(t("Side profile needed (Show Full Legs)", "बगल से दृश्य चाहिए (पूरे पैर दिखाएँ)"),
            t("Lie side-on to the camera: shoulder, hip, bent knees, and ankles must all be visible.", "कैमरे की ओर बगल से लेटें: कंधा, कूल्हा, मुड़े घुटने और टखने साफ़ दिखने चाहिए।"));
        }
      }
      const p = (i) => P(lm, i, W, H);
      const sh = p(s.sh), hip = p(s.hip), kn = p(s.kn), an = p(s.an);
      const femur = Math.max(dist2D(hip, kn), 1);
      const tibia = Math.max(dist2D(kn, an), 1);
      const torso = Math.max(dist2D(sh, hip), 1);

      // Gate 1: Reject standing upright or kneeling (when ankles are vertically far below hips)
      const legVertDrop = an.y - hip.y;
      if (legVertDrop > 0.70 * (femur + tibia) || (an.y - sh.y > 1.45 * Math.max(Math.abs(sh.x - an.x), 1) && hip.y < kn.y - 0.35 * femur)) {
        return fail(
          t("🚫 FOUL: Standing — Lie on Floor!", "🚫 फाउल: खड़े हैं — ज़मीन पर लेटें!"),
          t("Sit-Ups must be performed lying on the floor with knees bent (standing/vertical posture is rejected).",
            "सिट-अप्स ज़मीन पर पीठ के बल लेटकर घुटने मोड़कर करें (खड़े होना अमान्य है)।"),
          { isWrongExercise: true }
        );
      }

      const hipDeg = angleDeg(sh, hip, kn);
      // True torso angle relative to horizontal floor: 0° = lying flat on back, 90° = sitting straight upright
      const torsoDeg = Math.atan2(Math.max(0, hip.y - sh.y), Math.abs(sh.x - hip.x) + 1e-6) * 180 / Math.PI;
      const kneeDeg = angleDeg(hip, kn, an);

      // Knee apex must rise above (smaller Y than) the hip-to-ankle floor baseline AND knee angle must be bent (≤ 100°)
      const floorLineY = 0.5 * (hip.y + an.y);
      const kneeApexRiseRatio = (floorLineY - kn.y) / femur;
      const kneeBentOk = kneeDeg <= 100 && kneeDeg >= 40 && kneeApexRiseRatio >= 0.12;

      const hasEl = vis(lm, s.el, 0.35);
      const elPt = hasEl ? p(s.el) : null;
      const elbowKnee = hasEl ? dist2D(elPt, kn) / femur : null;
      const elbowY = hasEl ? elPt.y : sh.y;
      const wristEar = (vis(lm, s.wr, 0.35) && vis(lm, s.ear, 0.35))
        ? Math.min(dist2D(p(s.wr), p(s.ear)), vis(lm, 0, 0.35) ? dist2D(p(s.wr), p(0)) : 999) / torso
        : null;

      const isSupineFlat = torsoDeg <= 28 && hipDeg >= 104;
      const isCurledUp = torsoDeg >= 46 && hipDeg <= 90;

      let stateText;
      if (!kneeBentOk) {
        stateText = `🚫 ${t("FOUL: Knees Straight", "फाउल: घुटने सीधे हैं")} (${kneeDeg.toFixed(0)}° > 100°) — ${t("BEND KNEES!", "घुटने मोड़ें!")}`;
      } else if (isSupineFlat) {
        stateText = `✅ ${t("FLAT ON BACK", "पीठ के बल लेटे हैं")} (${torsoDeg.toFixed(0)}°) · ${t("Knee", "घुटना")} ${kneeDeg.toFixed(0)}° ✓ — ⬆️ ${t("Curl Up!", "ऊपर उठें!")}`;
      } else if (isCurledUp) {
        stateText = `⬆️ ${t("TOP CURL", "ऊपर उठे")} (Hip ${hipDeg.toFixed(0)}°) · ${t("Knee", "घुटना")} ${kneeDeg.toFixed(0)}° ✓ — ⬇️ ${t("Return Flat!", "वापस सीधा लेटें!")}`;
      } else {
        stateText = `${t("Torso", "धड़")} ${torsoDeg.toFixed(0)}° · ${t("Hip", "कूल्हा")} ${hipDeg.toFixed(0)}° · ${t("Knee", "घुटना")} ${kneeDeg.toFixed(0)}° ✓`;
      }

      return {
        postureOk: true,
        hipDeg,
        torsoDeg,
        kneeDeg,
        kneeBentOk,
        kneeApexRiseRatio,
        isSupineFlat,
        isCurledUp,
        elbowKnee,
        elbowY,
        torsoPx: torso,
        wristEar,
        shX: sh.x, shY: sh.y,
        hipX: hip.x, hipY: hip.y,
        knX: kn.x, knY: kn.y,
        anX: an.x, anY: an.y,
        liveMetric: stateText,
        reason: !kneeBentOk
          ? t("🚫 FOUL (Rule 2): Your knees are straight! Bend your knees (~90°) with feet flat on the floor.", "🚫 फाउल (नियम 2): आपके घुटने सीधे हैं! घुटनों को ~90° मोड़ें और पैर ज़मीन पर रखें।")
          : t("Start flat on back (Torso ≤28°) → Curl up to knees (Torso ≥46°, Hip ≤88°) → Return flat to floor (≤28°).",
              "पीठ के बल सीधा लेटें (धड़ ≤28°) → घुटनों तक उठें (धड़ ≥46°) → वापस सीधा लेटें (≤28°)।")
      };
    }

    // TEST 5 — STANDING BROAD JUMP (Side-Profile Horizontal Two-Foot Jump: Take-Off Toe to Nearest Landing Heel)
    function evalBroadJump(lm, mask, W, H, calib, athlete) {
      const s = sideChain(lm);
      for (const i of [s.sh, s.hip, s.kn, s.an]) {
        if (!vis(lm, i, 0.40)) {
          return fail(t("Full body side profile needed", "पूरा शरीर बगल से दिखना चाहिए"),
            t("Stand sideways (90° side profile) so shoulder, hip, knee and ankle stay clearly inside the frame.", "कैमरे के सामने बगल से (90° साइड प्रोफ़ाइल) खड़े हों ताकि कंधा, कूल्हा, घुटना और टखना साफ़ दिखें।"));
        }
      }
      const p = (i) => P(lm, i, W, H);
      const bothSh = vis(lm, 11, 0.35) && vis(lm, 12, 0.35);
      const bothHip = vis(lm, 23, 0.35) && vis(lm, 24, 0.35);
      const bothAnk = vis(lm, 27, 0.35) && vis(lm, 28, 0.35);

      const shMid = bothSh ? mid(p(11), p(12)) : p(s.sh);
      const hipMid = bothHip ? mid(p(23), p(24)) : p(s.hip);
      const ankleMidX = bothAnk ? 0.5 * (p(27).x + p(28).x) : p(s.an).x;
      const ankleMidY = bothAnk ? 0.5 * (p(27).y + p(28).y) : p(s.an).y;
      const footY = bothAnk ? Math.max(p(27).y, p(28).y) : p(s.an).y;
      const ankleSpreadX = bothAnk ? Math.abs(p(27).x - p(28).x) : 0;
      const torsoPx = Math.max(H * 0.08, dist2D(shMid, hipMid));

      // Gate 1: Reject sitting or lying down during Broad Jump
      if (ankleMidY - hipMid.y < 0.55 * torsoPx) {
        return fail(
          t("🚫 FOUL: Seated/Lying — Stand Upright!", "🚫 फाउल: बैठे/लेटे हैं — सीधे खड़े हों!"),
          t("Standing Broad Jump starts from an upright two-foot standing posture.", "स्टैंडिंग ब्रॉड जंप सीधे खड़े होकर दोनों पैरों से किया जाता है।"),
          { isWrongExercise: true }
        );
      }

      // Gate 2: Side-Profile Gate — Reject facing the camera directly!
      // Because a 2D camera measures horizontal jump distance across the screen (left <-> right),
      // facing the camera (where shoulder width and hip width are wide horizontally) MUST be blocked!
      const shWidthPx = bothSh ? Math.abs(p(11).x - p(12).x) : 0;
      const hipWidthPx = bothHip ? Math.abs(p(23).x - p(24).x) : 0;
      if (shWidthPx > 0.46 * torsoPx && hipWidthPx > 0.28 * torsoPx) {
        return fail(
          t("🚫 Turn Sideways (Side Profile Required)!", "🚫 बगल की ओर मुड़ें (साइड प्रोफ़ाइल आवश्यक)!"),
          t("You are facing the camera! Turn 90° sideways so you jump across the screen (left-to-right or right-to-left).",
            "आप कैमरे की ओर मुँह करके खड़े हैं! 90° बगल की ओर मुड़ें ताकि आप स्क्रीन के एक तरफ़ से दूसरी तरफ़ कूद सकें।")
        );
      }

      const nearLegPx = dist2D(p(s.hip), p(s.kn)) + dist2D(p(s.kn), p(s.an));
      const legL = (vis(lm, 23, 0.35) && vis(lm, 25, 0.35) && vis(lm, 27, 0.35)) ? (dist2D(p(23), p(25)) + dist2D(p(25), p(27))) : nearLegPx;
      const legR = (vis(lm, 24, 0.35) && vis(lm, 26, 0.35) && vis(lm, 28, 0.35)) ? (dist2D(p(24), p(26)) + dist2D(p(26), p(28))) : nearLegPx;
      const legLengthPx = Math.max(H * 0.14, 0.5 * (legL + legR));
      const kneeDeg = angleDeg(p(s.hip), p(s.kn), p(s.an));

      // Track toe and heel X coordinates for SAI Handbook Test V (take-off toe line to nearest landing heel):
      const hasToes = vis(lm, s.ft, 0.35) || vis(lm, 31, 0.35) || vis(lm, 32, 0.35);
      const toeX = vis(lm, s.ft, 0.35)
        ? p(s.ft).x
        : (vis(lm, 31, 0.35) ? p(31).x : (vis(lm, 32, 0.35) ? p(32).x : ankleMidX));
      const hasHeels = vis(lm, s.heel, 0.35) || vis(lm, 29, 0.35) || vis(lm, 30, 0.35);
      const heelX = vis(lm, s.heel, 0.35)
        ? p(s.heel).x
        : (vis(lm, 29, 0.35) ? p(29).x : (vis(lm, 30, 0.35) ? p(30).x : ankleMidX));

      return {
        postureOk: true,
        shX: shMid.x,
        shY: shMid.y,
        hipX: hipMid.x,
        hipY: hipMid.y,
        ankX: ankleMidX,
        toeX,
        heelX,
        // Both feet, so landing can use the rear-most heel ("back of the heels", Handbook Test V)
        toeLX: vis(lm, 31, 0.35) ? p(31).x : toeX,
        toeRX: vis(lm, 32, 0.35) ? p(32).x : toeX,
        heelLX: vis(lm, 29, 0.35) ? p(29).x : heelX,
        heelRX: vis(lm, 30, 0.35) ? p(30).x : heelX,
        hasToes,
        hasHeels,
        ankleMidY,
        footY,
        ankleSpreadX,
        legLengthPx,
        torsoPx,
        kneeDeg,
        liveMetric: `✅ ${t("Side Profile OK", "साइड प्रोफ़ाइल सही")} · ${t("Knee", "घुटना")} ${kneeDeg.toFixed(0)}°`,
        reason: t("Stand sideways ~1s on both feet, jump forward across the screen, and land on both feet.",
                  "~1 सेकंड दोनों पैरों पर बगल से स्थिर खड़े रहें, फिर स्क्रीन के पार आगे कूदें और दोनों पैरों पर उतरें।")
      };
    }

    function evaluateLiveFrame(testKey, lm, mask, W, H, calib, athlete, stickyNote) {
      if (testKey === "height") return evalHeight(lm, mask, W, H, calib, stickyNote);
      if (testKey === "sit_and_reach") return evalSitReach(lm, mask, W, H, calib, athlete);
      if (testKey === "vertical_jump") return evalJump(lm, mask, W, H);
      if (testKey === "broad_jump") return evalBroadJump(lm, mask, W, H, calib, athlete);
      if (testKey === "sit_ups") return evalSitUps(lm, mask, W, H);
      return { postureOk: true, liveMetric: "Ready", reason: "" };
    }

    // =========================================================================
    // Attempt Scoring Engine (30-Frame Trimmed Median + Rule Audit)
    // =========================================================================
    function rejected(test, method, detail) {
      return { valid: false, value: null, unit: test.unit, confidence: "RED", method, audit: [{ label: "Rejected", detail, valid: false }] };
    }

    // Tags every rejected result so the attempt counter can tell a rule foul (counts as an attempt)
    // from a capture failure or "nothing happened" result (free retake).
    function computeAttemptResult(test, athlete, recordedFrames, fps, calib) {
      const r = computeAttemptResultCore(test, athlete, recordedFrames, fps, calib);
      if (r && !r.valid && !r.rejectKind) {
        r.rejectKind = /FOUL|फाउल|नियम उल्लंघन/i.test(r.method || "") ? "foul" : "nothing";
      }
      return r;
    }

    function computeAttemptResultCore(test, athlete, recordedFrames, fps, calib) {
      const ok = recordedFrames.filter(f => f.postureOk);
      if (ok.length < 8) {
        const wrongEx = recordedFrames.find(f => f.isWrongExercise);
        const distErr = [...recordedFrames].reverse().find(f => f.distanceError);
        const last = [...recordedFrames].reverse().find(f => f.reason);
        const rejMethod = distErr
          ? (distErr.distanceError === "TOO_CLOSE"
              ? t("REJECTED — 📏 TOO CLOSE to camera (Step BACK)", "अस्वीकृत — कैमरे के बहुत पास (पीछे हटें)")
              : t("REJECTED — 📏 TOO FAR from camera (Step CLOSER)", "अस्वीकृत — कैमरे से बहुत दूर (पास आएँ)"))
          : t("REJECTED — posture / landmark gate", "अस्वीकृत — पोस्चर गेट");
        return rejected(test, rejMethod,
          wrongEx ? wrongEx.reason : (distErr ? distErr.reason : (last?.reason || t("Required posture not detected.", "आवश्यक पोस्चर नहीं मिला।"))));
      }

      // ---------------- TEST 1: HEIGHT ----------------
      if (test.key === "height") {
        const vals = ok.map(f => f.cm).filter(v => v !== null && Number.isFinite(v));
        // Stationary Standing Plateau Selector:
        // If the athlete walked back to the wall at the start of the clip or stepped forward at the end,
        // select the most stable contiguous standing window (~55% of valid frames, min 6 frames)
        // where the athlete stood still against the wall.
        let bestWindow = vals;
        const winLen = Math.max(6, Math.min(vals.length, Math.round(vals.length * 0.55)));
        if (vals.length > winLen) {
          let bestWinSpread = Infinity;
          for (let i = 0; i <= vals.length - winLen; i++) {
            const sub = vals.slice(i, i + winLen).sort((a, b) => a - b);
            const l0 = Math.floor(sub.length * 0.15);
            const h0 = Math.max(Math.ceil(sub.length * 0.85), l0 + 1);
            const sp = sub[h0 - 1] - sub[l0];
            if (sp < bestWinSpread) {
              bestWinSpread = sp;
              bestWindow = vals.slice(i, i + winLen);
            }
          }
        }
        const s = [...bestWindow].sort((a, b) => a - b);
        const lo = Math.floor(s.length * 0.20);
        const hi = Math.max(Math.ceil(s.length * 0.80), lo + 1);
        const core = s.slice(lo, hi);
        const h = median(core);
        const spread = core.length > 1 ? (core[core.length - 1] - core[0]) : 0.0;
        const roll = median(ok.map(f => f.headRoll || 0));
        const medDistM = median(ok.map(f => f.estDistM || 2.50));
        const medCmPerPx = median(ok.map(f => f.cmPerPx));
        const sample = ok[ok.length - 1];
        const isRung12 = sample.calibMethod === "tape" || sample.calibMethod === "person" || sample.calibMethod === "wall" || sample.calibMethod === "sticky150" || sample.calibMethod === "a4marker";
        const isWall = sample.calibMethod === "wall" || sample.calibMethod === "sticky150" || sample.calibMethod === "a4marker";
        // Wall-mark frames only need head and shoulders; if the legs were not visible the standing posture was never checked
        const postureVerified = ok.filter(f => f.postureVerified !== false).length >= 0.8 * ok.length;
        const band = (isRung12 && spread <= 3.5 && roll <= 10 && postureVerified) ? "GREEN" : "AMBER";
        const valid = spread <= 5.0;
        // No numeric tolerance is claimed: accuracy has not been field-validated (see Known Issues).
        const tol = sample.calibMethod === "a4marker" ? "A4 marker scale, unvalidated"
          : isWall ? "wall reference, unvalidated"
          : (isRung12 ? "tape/person reference, unvalidated" : "assumes camera distance, unvalidated");

        return {
          valid,
          // A rejected attempt carries no number (it used to keep e.g. 194.6 and pre-fill the manual-entry box)
          value: valid ? Number(h.toFixed(1)) : null,
          unit: "cm",
          confidence: valid ? band : "RED",
          method: `Height: ${h.toFixed(1)} cm (${tol}) · Dist ${medDistM.toFixed(2)} m · ${vals.length} frames median`,
          audit: [{
            label: "Standing Height",
            detail: `Height: ${h.toFixed(1)} cm (${tol}) · Dist ${medDistM.toFixed(2)} m · Body ${median(ok.map(f => f.bodyPx)).toFixed(0)} px × ${medCmPerPx.toFixed(4)} cm/px · vertex: ${sample.vertexSource}${isWall ? ` · off-wall ${median(ok.map(f => f.offWallCm || 0)).toFixed(0)} cm (corrected)` : ""} · spread ${spread.toFixed(1)} cm${postureVerified ? "" : " · ⚠ posture not verified (legs not in view)"} · build ${BUILD_ID}`,
            valid
          }]
        };
      }

      // ---------------- TEST 3: SIT AND REACH ----------------
      if (test.key === "sit_and_reach") {
        // IMPORTANT: Do NOT filter out bent-knee frames first!
        // Previously, `ok.filter(f => f.kneeOk)` discarded all frames where the knees were up/bent
        // and passed the attempt if even 5 transition frames had straight knees!
        const rAll = medianFilter(ok.map(f => f.reachCm), 5);
        const kneeSm = medianFilter(ok.map(f => f.kneeDeg), 3);
        const trunkSm = medianFilter(ok.map(f => f.trunkDeg ?? 65), 3);
        const startReach = Math.max(-35.0, pct(rAll, 0.12));
        const peakReachAll = pct(rAll, 0.88);
        const excursion = Math.min(45.0, Math.max(0.0, peakReachAll - startReach));

        const reachingIndices = [];
        for (let i = 0; i < ok.length; i++) {
          if ((ok[i].handLegRatio ?? 0.85) >= 0.68 && rAll[i] >= -18.0 && trunkSm[i] <= 78) {
            reachingIndices.push(i);
          }
        }

        if (reachingIndices.length < 5 || peakReachAll < -18.0) {
          return rejected(test, t("REJECTED — no forward reach attempt", "अस्वीकृत — आगे झुकने का प्रयास नहीं किया गया"),
            t("Sitting upright without reaching: Bend your torso forward (≤78°) and slide both hands past your knees toward your toes.", "बिना झुके बैठे हैं: कमर से आगे झुकें और दोनों हाथों को घुटनों से आगे पंजों की ओर बढ़ाएँ।"));
        }

        if (excursion < 5.0) {
          return rejected(test, t("REJECTED — sitting still (<5.0 cm forward reach)", "अस्वीकृत — स्थिर बैठे हैं (<5.0 सेमी गति)"),
            t("No forward reach movement detected. Start seated, slide your hands forward along the scale, and hold your maximum reach for 1–2s.", "आगे झुकने की गति नहीं मिली। बैठकर हाथों को आगे पंजों की ओर बढ़ाएँ और 1–2 सेकंड रोकें।"));
        }

        // Audit knee straightness and flatness across ALL reaching frames and especially the peak reach window:
        // If knees bend (<165°) or lift up off the floor (kneeUp / trunk <22°) during the reach, NULLIFY the attempt!
        const peakIndices = reachingIndices.filter(i => rAll[i] >= peakReachAll - 5.0);
        const auditIndices = peakIndices.length >= 3 ? peakIndices : reachingIndices;
        const minKneeDuringReach = Math.min(...reachingIndices.map(i => kneeSm[i]));
        const minKneeAtPeak = Math.min(...auditIndices.map(i => kneeSm[i]));
        const minTrunkAtPeak = Math.min(...auditIndices.map(i => trunkSm[i]));
        const kneeUpCount = auditIndices.filter(i => ok[i].kneeUp || kneeSm[i] < 165 || trunkSm[i] < 22).length;
        const kneeFoulRatio = kneeUpCount / auditIndices.length;

        if (minKneeAtPeak < 165 || minKneeDuringReach < 162 || kneeFoulRatio > 0.15 || minTrunkAtPeak < 22) {
          const worstKnee = Math.min(minKneeAtPeak, minKneeDuringReach);
          const why = minTrunkAtPeak < 22
            ? `knees pulled up (trunk-thigh ${minTrunkAtPeak.toFixed(0)}° < 22°)`
            : `knees bent/lifted (${worstKnee.toFixed(0)}° < 165°)`;
          return rejected(test, `FOUL — ${why}`,
            t(`Attempt nullified: Knees bent or lifted off the floor during reach (${worstKnee.toFixed(0)}°, must stay flat ≥165°).`,
              `फाउल: पहुँचते समय घुटने मुड़ गए या ज़मीन से उठ गए (${worstKnee.toFixed(0)}°, ≥165° आवश्यक)।`));
        }

        // SAI Handbook Test III Two-Hand Symmetry Check (both hands must reach together, not a one-arm reach):
        const asymVals = auditIndices.map(i => ok[i].handAsymmetryCm || 0).filter(v => v > 0);
        if (asymVals.length >= 3 && median(asymVals) > 5.0) {
          return rejected(test, t("FOUL — One-handed / uneven reach", "फाउल — एक हाथ आगे / असमान पहुँच"),
            t(`SAI Rule Foul: Both hands must be placed on top of each other or side-by-side (hand offset ${median(asymVals).toFixed(1)} cm > 5 cm).`,
              `SAI नियम उल्लंघन: दोनों हाथ एक-दूसरे के ऊपर या बराबर में होने चाहिए।`));
        }

        const reachingFrames = reachingIndices.map(i => ok[i]);
        const r = reachingIndices.map(i => rAll[i]);
        // SAI Handbook Test III Hold Check ("hold for about two seconds — no jerky bouncing"):
        const nearPeakFrames = reachingIndices.filter(i => rAll[i] >= peakReachAll - 4.5).map(i => ok[i]);
        const nearPeakHoldMs = nearPeakFrames.length >= 2
          ? (nearPeakFrames[nearPeakFrames.length - 1].t - nearPeakFrames[0].t)
          : 0;
        // Handbook (Oct 2026): hold the maximum reach for 2 seconds. 1.9 s allows for the gap between video frames.
        if (nearPeakFrames.length < 3 || nearPeakHoldMs < 1900) {
          return rejected(test, t("FOUL — Jerky bounce (reach not held 2 s)", "फाउल — झटके से छूना (2 सेकंड नहीं रोका)"),
            t(`SAI Rule Foul: Do not bounce! Reach forward smoothly and hold your maximum reach steady for 2 seconds (held ${(nearPeakHoldMs / 1000).toFixed(1)} s).`,
              `SAI नियम उल्लंघन: झटका न दें! आगे झुककर अधिकतम पहुँच को 2 सेकंड तक स्थिर रखें (${(nearPeakHoldMs / 1000).toFixed(1)} सेकंड रोका)।`));
        }

        // Prefer a held plateau window (≥450 ms with spread ≤2.5 cm), fallback to 85th percentile valid reach
        // Score the BEST steady plateau (not the last one), falling back to the 85th percentile of the reach
        let heldReach = pct(r, 0.85);
        let bestPlateau = -Infinity;
        for (let i = 0; i < reachingFrames.length; i++) {
          let j = i;
          while (j < reachingFrames.length && (reachingFrames[j].t - reachingFrames[i].t) < 450) j++;
          if (j >= reachingFrames.length) break;
          const win = r.slice(i, j + 1);
          const sp = Math.max(...win) - Math.min(...win);
          if (sp <= 2.5) bestPlateau = Math.max(bestPlateau, median(win));
        }
        if (bestPlateau > -Infinity && bestPlateau >= heldReach - 1.5) heldReach = bestPlateau;

        const boxOffset = state.boxZeroCm !== undefined ? state.boxZeroCm : 23.0;
        const score = Math.max(0.0, boxOffset + heldReach);
        const minKnee = Math.min(minKneeAtPeak, minKneeDuringReach);
        const isCalib = !!calib && calib.method !== "distance";
        // The two-hands rule can only be verified when both wrists were visible; otherwise do not claim GREEN
        const handsChecked = asymVals.length >= 3;

        return {
          valid: true,
          value: Number(score.toFixed(1)),
          unit: "cm",
          confidence: (isCalib && handsChecked) ? "GREEN" : "AMBER",
          method: `${reachingFrames[0].scaleMode} · Held reach ${score.toFixed(1)} cm (${heldReach >= 0 ? "+" : ""}${heldReach.toFixed(1)} cm ${reachingFrames[0].refLine})${calib ? "" : " · " + refHeightNote(athlete)}`,
          audit: [{
            label: "Peak Held Reach",
            detail: `${score.toFixed(1)} cm (${heldReach >= 0 ? "+" : ""}${heldReach.toFixed(1)} cm ${reachingFrames[0].refLine}) · Excursion ${excursion.toFixed(1)} cm · Hold ${(nearPeakHoldMs / 1000).toFixed(2)}s · Knee ≥${minKnee.toFixed(0)}° PASS`,
            valid: true
          }]
        };
      }

      // ---------------- TEST 4: VERTICAL JUMP ----------------
      // Whole-Body Coupled Ballistic Jump Detector:
      // Requires BOTH ankles, hips, and shoulders to rise simultaneously above their local upright standing baselines
      // and return to the same floor level. Standing still, toe-landmark flicker, walking back, or squatting = REJECTED.
      if (test.key === "vertical_jump") {
        const footSm = medianFilter(ok.map(f => f.footY), 3);
        const hipSm = medianFilter(ok.map(f => f.hipY), 3);
        const hipXSm = medianFilter(ok.map(f => f.hipX ?? 0), 3);
        const shSm = medianFilter(ok.map(f => f.shY), 3);
        const shFoot = median(ok.map(f => f.shToFootPx));

        const refHeightCm = getAthleteRefHeightCm(athlete);
        const shToFootCm = refHeightCm * 0.78;
        const cmPerPx = calib?.cmPerPx || (shToFootCm / shFoot);

        // Local running floor level (+/- 20 frames) so walking back/forward from camera is tracked smoothly
        const n = ok.length;
        const localFloor = footSm.map((_, i) => {
          const w = footSm.slice(Math.max(0, i - 20), Math.min(n, i + 21));
          return pct(w, 0.75);
        });

        // Minimum simultaneous ankle lift to enter airborne state: at least 3.2 cm above local floor
        const liftThrPx = Math.max(3.2 / cmPerPx, 0.026 * shFoot);

        // Find contiguous airborne intervals [sIdx .. eIdx] bounded by ground contact before AND after
        const candidates = [];
        let horizontalRunupFoul = false;
        let sIdx = -1;
        for (let i = 0; i < n; i++) {
          const isAir = footSm[i] < (localFloor[i] - liftThrPx);
          if (isAir && sIdx < 0) {
            sIdx = i;
          } else if ((!isAir || i === n - 1) && sIdx >= 0) {
            const eIdx = isAir ? i : (i - 1);
            const airFrames = eIdx - sIdx + 1;
            // Must be airborne for at least 2 consecutive frames and bounded by ground frames before & after
            if (airFrames >= 2 && sIdx >= 3 && eIdx <= n - 4) {
              const preFloor = median(footSm.slice(Math.max(0, sIdx - 8), sIdx));
              const postFloor = median(footSm.slice(eIdx + 1, Math.min(n, eIdx + 9)));
              const floorDiffCm = Math.abs(preFloor - postFloor) * cmPerPx;
              // One floor level for both the airborne threshold and the clearance (they used to differ by up to the 6 cm tolerance)
              const meanFloorY = 0.5 * (preFloor + postFloor);
              const floorY = meanFloorY;

              // Grounded frames before takeoff and after landing:
              // Taking the 20th percentile of Y (highest upright position while grounded) automatically ignores
              // any pre-jump crouch or post-landing squat (which have larger Y) AND prevents step-back drift!
              const preGroundHips = [], preGroundShs = [], preGroundHipXs = [];
              for (let k = Math.max(0, sIdx - 25); k < sIdx; k++) {
                if (Math.abs(footSm[k] - preFloor) <= liftThrPx * 1.1) {
                  preGroundHips.push(hipSm[k]);
                  preGroundShs.push(shSm[k]);
                  preGroundHipXs.push(hipXSm[k]);
                }
              }
              const postGroundHips = [], postGroundShs = [], postGroundHipXs = [];
              for (let k = eIdx + 1; k <= Math.min(n - 1, eIdx + 25); k++) {
                if (Math.abs(footSm[k] - postFloor) <= liftThrPx * 1.1) {
                  postGroundHips.push(hipSm[k]);
                  postGroundShs.push(shSm[k]);
                  postGroundHipXs.push(hipXSm[k]);
                }
              }

              if (floorDiffCm <= 6.0 && preGroundHips.length >= 2 && postGroundHips.length >= 2) {
                const standingHipY = Math.min(pct(preGroundHips, 0.25), pct(postGroundHips, 0.25));
                const standingShY = Math.min(pct(preGroundShs, 0.25), pct(postGroundShs, 0.25));
                const horizDriftCm = Math.abs(median(postGroundHipXs) - median(preGroundHipXs)) * cmPerPx;

                // Sub-frame linear interpolation for takeoff and landing timestamps
                const thrY = meanFloorY - liftThrPx;
                const y0 = footSm[sIdx - 1], y1 = footSm[sIdx];
                const fracTake = (y0 > y1) ? Math.max(0, Math.min(1, (y0 - thrY) / (y0 - y1))) : 0.5;
                const tTake = ok[sIdx - 1].t + fracTake * (ok[sIdx].t - ok[sIdx - 1].t);

                const y2 = footSm[eIdx], y3 = footSm[eIdx + 1];
                const fracLand = (y3 > y2) ? Math.max(0, Math.min(1, (thrY - y2) / (y3 - y2))) : 0.5;
                const tLand = ok[eIdx].t + fracLand * (ok[eIdx + 1].t - ok[eIdx].t);

                const dtAboveThrSec = (tLand - tTake) / 1000.0;
                const liftThrCm = liftThrPx * cmPerPx;
                const rawFlightCm = liftThrCm + 0.125 * 9.81 * dtAboveThrSec * dtAboveThrSec * 100.0;
                const flightSec = Math.sqrt(Math.max(0, (8.0 * (rawFlightCm / 100.0)) / 9.81));

                if (dtAboveThrSec >= 0.06 && flightSec <= 0.75) {
                  const rawFootWin = ok.slice(sIdx, eIdx + 1).map(f => f.footY);
                  const rawHipWin = ok.slice(sIdx, eIdx + 1).map(f => f.hipY);
                  const rawShWin = ok.slice(sIdx, eIdx + 1).map(f => f.shY);

                  const apexFootY = Math.min(...footSm.slice(sIdx, eIdx + 1), median(rawFootWin.slice().sort((a, b) => a - b).slice(0, 2)));
                  const apexHipY = Math.min(...hipSm.slice(sIdx, eIdx + 1), median(rawHipWin.slice().sort((a, b) => a - b).slice(0, 2)));
                  const apexShY = Math.min(...shSm.slice(sIdx, eIdx + 1), median(rawShWin.slice().sort((a, b) => a - b).slice(0, 2)));

                  const footClearanceCm = (floorY - apexFootY) * cmPerPx;
                  const hipRiseCm = (standingHipY - apexHipY) * cmPerPx;
                  const shRiseCm = (standingShY - apexShY) * cmPerPx;

                  // Rigid-Body Coupling Check:
                  // In a real jump, both ankles, hips, and shoulders ALL rise together by at least 3.5 cm
                  // above BOTH pre-jump and post-jump upright standing levels.
                  const coMRiseCm = 0.55 * hipRiseCm + 0.45 * shRiseCm;
                  const minBodyPartRiseCm = Math.min(footClearanceCm, hipRiseCm, shRiseCm);

                  if (minBodyPartRiseCm >= 3.5 && coMRiseCm >= 3.8 && footClearanceCm >= 3.8) {
                    // SAI Handbook Test IV: jump from the spot, no shuffling or approach steps (drift over 20 cm is a foul)
                    if (horizDriftCm > 20.0) {
                      horizontalRunupFoul = true;
                    } else {
                      const kinematicCm = Math.min(footClearanceCm * 1.08, coMRiseCm);
                      const boundedFlightCm = Math.min(rawFlightCm, kinematicCm * 1.12);
                      const jumpCm = 0.65 * kinematicCm + 0.35 * boundedFlightCm;

                      candidates.push({
                        jumpCm,
                        kinematicCm,
                        footClearanceCm,
                        hipRiseCm,
                        shRiseCm,
                        flightSec,
                        flightCm: rawFlightCm
                      });
                    }
                  }
                }
              }
            }
            sIdx = -1;
          }
        }

        if (!candidates.length) {
          if (horizontalRunupFoul) {
            return rejected(test, t("FOUL — Horizontal run-up / broad jump", "फाउल — दौड़कर या आगे कूदना अमान्य है"),
              t("SAI Rule Foul: Standing Vertical Jump must be performed straight up from a stationary two-foot stance (no horizontal run-up or broad jump).",
                "SAI नियम उल्लंघन: एक स्थान पर स्थिर खड़े होकर सीधा ऊपर कूदें (आगे की ओर कूदना अमान्य है)।"));
          }
          return rejected(test, t("No vertical jump detected", "कोई वर्टिकल जंप नहीं मिली"),
            t("Stand still on your spot for 1s, jump straight up with both feet, and land on the same spot.", "एक स्थान पर 1 सेकंड स्थिर खड़े रहें, दोनों पैरों से सीधा ऊपर कूदें और उसी स्थान पर उतरें।"));
        }

        const best = candidates.reduce((a, b) => (b.jumpCm > a.jumpCm ? b : a), candidates[0]);
        return {
          valid: true,
          value: Number(best.jumpCm.toFixed(1)),
          unit: "cm",
          confidence: calib ? "GREEN" : "AMBER",
          method: `AI Ballistic Jump · Foot lift ${best.footClearanceCm.toFixed(1)} cm · CoM rise ${best.kinematicCm.toFixed(1)} cm · Flight ${(best.flightSec * 1000).toFixed(0)} ms${calib?.cmPerPx ? "" : " · " + refHeightNote(athlete)}`,
          audit: candidates.map((c, idx) => ({
            label: `Jump #${idx + 1}`,
            detail: `${c.jumpCm.toFixed(1)} cm (Ankles +${c.footClearanceCm.toFixed(1)} cm · Hips +${c.hipRiseCm.toFixed(1)} cm · Shoulders +${c.shRiseCm.toFixed(1)} cm · Airborne ${(c.flightSec * 1000).toFixed(0)} ms)`,
            valid: true
          }))
        };
      }

      // ---------------- TEST 5: STANDING BROAD JUMP ----------------
      // SAI Handbook Test V:
      //  1. Stationary two-foot stance behind take-off line (no preliminary walk-up or run-up).
      //  2. Two-foot takeoff and two-foot landing simultaneously.
      //  3. Perpendicular distance measured from take-off line (toes) to nearest landing contact (rear heel).
      //  4. Stepping or falling backward after landing reduces score to rear contact / flags foul.
      if (test.key === "broad_jump") {
        const n = ok.length;
        const refHeightCm = getAthleteRefHeightCm(athlete);
        const medLegPx = median(ok.map(f => f.legLengthPx || 220));
        // Anatomical hip-to-ankle segment (femur + tibia) is 47.5% of total stature (Winter 2009)
        const cmPerPx = (calib && calib.cmPerPx) ? calib.cmPerPx : ((0.475 * refHeightCm) / Math.max(50, medLegPx));

        const ankXSm = medianFilter(ok.map(f => f.ankX), 3);
        const toeXSm = medianFilter(ok.map(f => f.toeX ?? f.ankX), 3);
        const heelXSm = medianFilter(ok.map(f => f.heelX ?? f.ankX), 3);
        const hipXSm = medianFilter(ok.map(f => f.hipX), 3);
        const footYSm = medianFilter(ok.map(f => f.footY), 3);
        const spreadXSm = medianFilter(ok.map(f => f.ankleSpreadX || 0), 3);
        const kneeSm = medianFilter(ok.map(f => f.kneeDeg || 170), 3);

        // Locate peak horizontal jump impulse [takeIdx .. landIdx]
        let peakVelCmPerSec = 0;
        let impulseIdx = Math.floor(n / 2);
        const velArr = new Float32Array(n);
        for (let i = 1; i < n; i++) {
          const dtSec = Math.max(0.016, (ok[i].t - ok[i - 1].t) / 1000.0);
          const v = (Math.abs(hipXSm[i] - hipXSm[i - 1]) * cmPerPx) / dtSec;
          velArr[i] = v;
          if (v > peakVelCmPerSec) {
            peakVelCmPerSec = v;
            impulseIdx = i;
          }
        }

        const velThr = Math.max(35.0, peakVelCmPerSec * 0.25);
        let takeIdx = impulseIdx;
        while (takeIdx > 1 && velArr[takeIdx - 1] >= velThr) takeIdx--;
        let landIdx = impulseIdx;
        while (landIdx < n - 2 && velArr[landIdx + 1] >= velThr) landIdx++;

        const preStart = Math.max(0, takeIdx - 12);
        const preEnd = Math.max(preStart + 2, takeIdx);
        const postStart = Math.min(n - 2, landIdx);
        const postEnd = Math.min(n, landIdx + 12);

        const startAnkX = median(ankXSm.slice(preStart, preEnd));
        const endAnkX = median(ankXSm.slice(postStart, postEnd));
        const startHipX = median(hipXSm.slice(preStart, preEnd));
        const endHipX = median(hipXSm.slice(postStart, postEnd));
        const dir = (endHipX - startHipX) >= 0 ? 1 : -1;

        const ankTravelCm = Math.abs(endAnkX - startAnkX) * cmPerPx;
        const hipTravelCm = Math.abs(endHipX - startHipX) * cmPerPx;
        const horizDispCm = Math.max(ankTravelCm, hipTravelCm);

        // 1. Reject standing in place without jumping horizontally
        if (horizDispCm < 25.0 || hipTravelCm < 20.0) {
          return rejected(
            test,
            t(`REJECTED — No horizontal jump (${horizDispCm.toFixed(1)} cm < 25 cm)`, "अस्वीकृत — आगे की ओर कूद नहीं मिली"),
            t("Stand still on both feet, bend your knees, and jump forward horizontally across the frame.", "दोनों पैरों पर स्थिर खड़े हों, घुटने मोड़ें और आगे की ओर कूदें।")
          );
        }

        // 2. Check for preliminary walk-up / run-up before takeoff (SAI Handbook Rule: must start stationary behind take-off line)
        if (preStart >= 4) {
          const initialAnkX = median(ankXSm.slice(0, Math.min(5, preStart)));
          const preWalkCm = (startAnkX - initialAnkX) * dir * cmPerPx;
          if (preWalkCm > 25.0) {
            return rejected(
              test,
              t(`FOUL — Preliminary walk-up before takeoff (${preWalkCm.toFixed(0)} cm)`, "फाउल — कूदने से पहले आगे चलना अमान्य है"),
              t("SAI Rule Foul: Stand stationary behind the take-off line before jumping (no walk-up or run-up permitted).",
                "SAI नियम उल्लंघन: कूदने से पहले टेक-ऑफ लाइन के पीछे स्थिर खड़े रहें (चलकर या दौड़कर कूदना अमान्य है)।")
            );
          }
        }

        // 3. Check for two-foot takeoff & two-foot landing vs walking/stepping foul
        const minKnee = Math.min(...kneeSm);
        const startSpreadCm = median(spreadXSm.slice(preStart, preEnd)) * cmPerPx;
        const endSpreadCm = median(spreadXSm.slice(postStart, postEnd)) * cmPerPx;
        const maxSpreadCm = pct(spreadXSm.slice(takeIdx, landIdx + 1), 0.90) * cmPerPx;
        const baselineFootY = Math.max(median(footYSm.slice(preStart, preEnd)), median(footYSm.slice(postStart, postEnd)));
        const minFootY = Math.min(...footYSm.slice(Math.max(0, takeIdx - 2), Math.min(n, landIdx + 3)));
        const verticalClearanceCm = Math.max(0, (baselineFootY - minFootY) * cmPerPx);

        if ((maxSpreadCm > 38.0 && verticalClearanceCm < 2.2) || startSpreadCm > 26.0 || endSpreadCm > 28.0 || peakVelCmPerSec < 55.0) {
          return rejected(
            test,
            t("FOUL — Walking / Single-foot step detected", "फाउल — चलना या एक पैर से कूदना अमान्य है"),
            t(`SAI Rule Foul: You must take off and land with BOTH feet together (foot separation ${Math.max(startSpreadCm, endSpreadCm, maxSpreadCm).toFixed(0)} cm, vertical lift ${verticalClearanceCm.toFixed(1)} cm).`,
              `SAI नियम उल्लंघन: दोनों पैरों से एक साथ कूदें और दोनों पैरों पर उतरें।`)
          );
        }

        // 4. Check for stepping or falling backward after landing (SAI Handbook Rule)
        if (postEnd < n - 2) {
          const afterLandRearX = dir > 0
            ? Math.min(...ankXSm.slice(postStart))
            : Math.max(...ankXSm.slice(postStart));
          const stepBackCm = (endAnkX - afterLandRearX) * dir * cmPerPx;
          if (stepBackCm > 15.0) {
            return rejected(
              test,
              t(`FOUL — Stepped/fell backward after landing (-${stepBackCm.toFixed(0)} cm)`, "फाउल — उतरने के बाद पीछे कदम रखना/गिरना"),
              t("SAI Rule Foul: Do not fall or step backward after landing! Hold your two-foot landing steady.",
                "SAI नियम उल्लंघन: उतरने के बाद पीछे न हटें! दोनों पैरों पर संतुलन बनाए रखें।")
            );
          }
        }

        // 5. SAI Handbook Test V Distance: Take-off Toe Line to Nearest Landing Heel
        // Lead toe at take-off, rear-most heel at landing (nearest point of contact to the line).
        const leadToe = (f) => dir > 0 ? Math.max(f.toeLX ?? f.toeX, f.toeRX ?? f.toeX) : Math.min(f.toeLX ?? f.toeX, f.toeRX ?? f.toeX);
        const rearHeel = (f) => dir > 0 ? Math.min(f.heelLX ?? f.heelX, f.heelRX ?? f.heelX) : Math.max(f.heelLX ?? f.heelX, f.heelRX ?? f.heelX);
        const startToeX = median(ok.slice(preStart, preEnd).map(leadToe));
        const landHeelX = median(ok.slice(postStart, postEnd).map(rearHeel));
        const rawToeToHeelCm = Math.max(0, (landHeelX - startToeX) * dir * cmPerPx);
        const centerTravelCm = 0.60 * ankTravelCm + 0.40 * hipTravelCm;
        // The score is the Handbook distance (toe-to-heel). Body travel is only a sanity check: it includes the
        // foot offset, so blending it into the score over-read by roughly 8-12 cm.
        const jumpCm = rawToeToHeelCm;
        const travelAgrees = rawToeToHeelCm >= 0.65 * centerTravelCm && rawToeToHeelCm <= 1.05 * centerTravelCm;

        return {
          valid: true,
          value: Number(jumpCm.toFixed(1)),
          unit: "cm",
          confidence: (calib && travelAgrees) ? "GREEN" : "AMBER",
          method: `AI Broad Jump (Toe-to-Heel) · ${jumpCm.toFixed(1)} cm · Two-foot lift +${verticalClearanceCm.toFixed(1)} cm · Knee ${minKnee.toFixed(0)}°${calib?.cmPerPx ? "" : " · " + refHeightNote(athlete)}`,
          audit: [{
            label: "Standing Broad Jump",
            detail: `✅ Valid Two-Foot Jump: ${jumpCm.toFixed(1)} cm (Toe→Heel ${rawToeToHeelCm.toFixed(1)} cm · CoM ΔX ${centerTravelCm.toFixed(1)} cm · Lift +${verticalClearanceCm.toFixed(1)} cm · Landing spread ${endSpreadCm.toFixed(1)} cm ✓)${travelAgrees ? "" : " ⚠ toe/heel landmarks disagree with body travel — confidence lowered"}`,
            valid: true
          }]
        };
      }

      // ---------------- TEST 9: SIT-UPS ----------------
      // Enforces ALL SAI Handbook Test IX Rules:
      //  - Window cutoff: 30s for Under-12 (age < 12), 45s for 12+ (age >= 12)
      //  - Rule 1: Supine on floor with knees bent (<= 100°), rejects standing or upright swinging
      //  - Rule 2: No resting between sit-ups (> 3.0s gap at bottom flags Rule 2 foul)
      //  - Rule 3a: Fingers clasped behind the neck (wristEar <= 0.85)
      //  - Rule 3b: Elbows brought forward to touch knees WITHOUT pushing off the floor with the elbow during rise
      //  - Rule 3c: Return to starting position with back & elbows flat on the surface before next rep
      if (test.key === "sit_ups") {
        const athleteAge = Number(athlete?.age) || 16;
        const windowSec = athleteAge < 12 ? 30 : 45;
        const t0 = ok[0].t;
        const windowCutMs = t0 + windowSec * 1000.0;

        const hipSm = medianFilter(ok.map(f => f.hipDeg), 3);
        const torsoSm = medianFilter(ok.map(f => f.torsoDeg ?? 45), 3);
        const kneeSm = medianFilter(ok.map(f => f.kneeDeg ?? 90), 3);
        const elYSm = medianFilter(ok.map(f => f.elbowY ?? f.shY ?? 0), 3);
        const medTorsoPx = Math.max(40, median(ok.map(f => f.torsoPx || 120)));
        const floorElbowY = pct(elYSm, 0.88);

        const minHip = pct(hipSm, 0.05), maxHip = pct(hipSm, 0.95), hipRange = maxHip - minHip;
        const minTorso = pct(torsoSm, 0.08), maxTorso = pct(torsoSm, 0.92), torsoRange = maxTorso - minTorso;
        const medKnee = median(kneeSm);
        const straightKneeRatio = ok.filter((f, idx) => kneeSm[idx] > 100 || f.kneeBentOk === false).length / ok.length;

        // 1. Check Bent Knees across the attempt
        if (medKnee > 100 || straightKneeRatio > 0.65) {
          return {
            valid: false, value: null, unit: "reps", confidence: "RED",
            method: t(`FOUL (Rule 2) — Knees straight (${medKnee.toFixed(0)}° > 100°)`, `फाउल (नियम 2) — घुटने सीधे हैं (${medKnee.toFixed(0)}° > 100°)`),
            audit: [{
              label: "Rule 2 Foul (Knees Straight)",
              detail: `Attempt rejected: Knees remained straight (${medKnee.toFixed(0)}° > 100° max allowed). You must bend your knees (~90°) with feet flat on the floor.`,
              valid: false
            }]
          };
        }

        // 2. Check Rule 1 & 3c: Swinging/rocking in an upright seated position without ever lying flat on back (torso <= 28°)
        if (minTorso > 28 || maxHip < 102) {
          return {
            valid: false, value: null, unit: "reps", confidence: "RED",
            method: t(`FOUL (Rule 1/3c) — Swinging upright without lying flat (min torso ${minTorso.toFixed(0)}° > 28°)`,
                      `फाउल — पीठ के बल सीधा लेटे बिना ऊपर ही झूलना (न्यूनतम धड़ ${minTorso.toFixed(0)}° > 28°)`),
            audit: [{
              label: "Upright Swinging Rejected",
              detail: `Attempt rejected: Athlete stayed upright (min torso angle ${minTorso.toFixed(0)}° above floor; must lie flat ≤28° with hip ≥104° between every rep).`,
              valid: false
            }]
          };
        }

        // 3. Check minimum range of motion (both hip flexion and torso elevation off floor)
        if (hipRange < 25 || torsoRange < 24) {
          return {
            valid: false, value: null, unit: "reps", confidence: "RED",
            method: t(`No sit-up curl cycle (Torso Δ${torsoRange.toFixed(0)}°, Hip Δ${hipRange.toFixed(0)}°)`, "सिट-अप गति नहीं मिली"),
            audit: [{
              label: "Insufficient Range of Motion",
              detail: `Torso lifted only ${torsoRange.toFixed(0)}° and hip flexed ${hipRange.toFixed(0)}° (requires ≥25° full curl from flat supine to knees and back).`,
              valid: false
            }]
          };
        }

        // State machine:
        // WAIT_SUPINE -> must first lie genuinely flat on back (torsoSm <= 28° AND hipSm >= 104°) to enter DOWN
        // DOWN        -> begins rising when torsoSm > 32° or hipSm < 100°; reaches UP when torsoSm >= 46° AND hipSm <= 90°
        // UP          -> completes rep when returning shoulder blades & elbows flat to floor (torsoSm <= 28° AND hipSm >= 104°)
        let phase = "WAIT_SUPINE";
        let down = [], up = [];
        let prevRepEndTimeMs = null;
        let riseStartTimeMs = null;
        let riseMinElbowY = Infinity;
        let elbowPushoffDetected = false;
        const audit = [];
        let validReps = 0;

        for (let i = 0; i < ok.length; i++) {
          if (ok[i].t > windowCutMs) break; // Handbook rule: count stops at whistle (30s U-12 / 45s 12+)

          const hAng = hipSm[i], tAng = torsoSm[i], kAng = kneeSm[i], eY = elYSm[i];
          const f = { ...ok[i], hipSm: hAng, torsoSm: tAng, kneeSm: kAng, elYSm: eY };

          if (phase === "WAIT_SUPINE") {
            if (tAng <= 28 && hAng >= 104) {
              phase = "DOWN";
              down = [f];
              riseStartTimeMs = null;
              riseMinElbowY = eY;
              elbowPushoffDetected = false;
            }
          } else if (phase === "DOWN") {
            down.push(f);
            if (tAng > 32 && riseStartTimeMs === null) {
              riseStartTimeMs = f.t;
              riseMinElbowY = eY;
            }
            if (riseStartTimeMs !== null) {
              riseMinElbowY = Math.min(riseMinElbowY, eY);
              // Rule 3b: elbow driving downward toward floor (Y increasing) while torso rises
              if ((eY - riseMinElbowY) > 0.25 * medTorsoPx) {
                elbowPushoffDetected = true;
              }
            }
            if (tAng >= 46 && hAng <= 90) {
              if (riseStartTimeMs === null) riseStartTimeMs = f.t;
              phase = "UP";
              up = [f];
            }
          } else if (phase === "UP") {
            up.push(f);
            // Complete rep only when returning flat on back (Rule 3c: torso <= 28° and hip >= 104°)
            if (tAng <= 28 && hAng >= 104) {
              const repFrames = [...down, ...up];
              const ek = up.map(x => x.elbowKnee).filter(v => v !== null);
              const we = repFrames.map(x => x.wristEar).filter(v => v !== null);
              const repKnees = repFrames.map(x => x.kneeSm);
              const maxKneeInRep = pct(repKnees, 0.85);
              const straightFramesInRep = repFrames.filter(x => x.kneeSm > 100 || x.kneeBentOk === false).length;
              const minHipInUp = Math.min(...up.map(x => x.hipSm));
              const maxTorsoInUp = Math.max(...up.map(x => x.torsoSm));
              const minTorsoInDown = Math.min(...down.map(x => x.torsoSm));
              const restSec = (prevRepEndTimeMs !== null && riseStartTimeMs !== null)
                ? Math.max(0, (riseStartTimeMs - prevRepEndTimeMs) / 1000.0)
                : 0;

              const fouls = [];
              // Rule 2: No resting between sit-ups (> 3.0s) & knees must stay bent (<= 100°)
              if (restSec > 3.0) {
                fouls.push(`Rule 2: rested ${restSec.toFixed(1)}s between sit-ups (>3.0s max)`);
              }
              if (maxKneeInRep > 100 || straightFramesInRep > repFrames.length * 0.30) {
                fouls.push(`Rule 2: knees straight (${maxKneeInRep.toFixed(0)}° > 100°)`);
              }
              // Rule 3a: Fingers clasped behind neck
              if (we.length && median(we) > 0.85) {
                fouls.push("Rule 3a: hands unclasped from neck/head");
              }
              // Rule 3b: Elbows forward to touch knees WITHOUT pushing off floor with elbow
              if (elbowPushoffDetected) {
                fouls.push("Rule 3b: pushed off the floor with elbow during rise");
              }
              if (maxTorsoInUp < 46 || (maxTorsoInUp - minTorsoInDown) < 24) {
                fouls.push(`Rule 3b: partial curl (torso ${maxTorsoInUp.toFixed(0)}° < 46°)`);
              }
              if (ek.length && Math.min(...ek) > 0.68) {
                fouls.push("Rule 3b: elbows did not reach knees");
              }
              // Rule 3c: Return elbows & back flat to surface
              if (eY < floorElbowY - 0.55 * medTorsoPx) {
                fouls.push("Rule 3c: elbows did not return flat to the floor");
              }

              const repOk = fouls.length === 0;
              if (repOk) validReps++;
              audit.push({
                label: `Rep #${audit.length + 1}`,
                detail: repOk
                  ? `✅ Valid rep · Flat ${minTorsoInDown.toFixed(0)}° → Curl ${maxTorsoInUp.toFixed(0)}° (Hip ${minHipInUp.toFixed(0)}°, Knee ${median(repKnees).toFixed(0)}° ✓) → Flat ${tAng.toFixed(0)}°`
                  : `🚫 FOUL — ${fouls.join(" · ")}`,
                valid: repOk
              });
              prevRepEndTimeMs = f.t;
              phase = "DOWN";
              down = [f];
              riseStartTimeMs = null;
              riseMinElbowY = eY;
              elbowPushoffDetected = false;
            }
          }
        }

        // If athlete curled up at the end and oscillated upright without returning flat to floor (Rule 3c violation):
        if (phase === "UP" && up.length >= 4) {
          const endTorso = up[up.length - 1].torsoSm;
          audit.push({
            label: `Rep #${audit.length + 1}`,
            detail: `🚫 FOUL — Rule 3c: Did not return flat to floor after curl (ended upright at torso ${endTorso.toFixed(0)}° > 28°)`,
            valid: false
          });
        }

        if (!audit.length || validReps === 0) {
          const firstFoul = audit.find(a => !a.valid)?.detail || "Complete a full supine (≤28°) → curl up to knees (≥46°) → supine (≤28°) cycle with knees bent (≤100°).";
          return {
            valid: false,
            value: null,
            unit: "reps",
            confidence: "RED",
            method: audit.length
              ? t(`REJECTED — 0/${audit.length} valid reps (Rule Foul)`, `अस्वीकृत — 0/${audit.length} मान्य सिट-अप (नियम उल्लंघन)`)
              : t("REJECTED — 0 complete sit-up cycles", "अस्वीकृत — 0 पूर्ण सिट-अप"),
            audit: audit.length ? audit : [{ label: "No valid reps", detail: firstFoul, valid: false }]
          };
        }

        return {
          valid: true,
          value: validReps,
          unit: "reps",
          confidence: "GREEN",
          method: `AI State Machine (${windowSec}s window) · ${validReps}/${audit.length} valid reps · Knee ${medKnee.toFixed(0)}° ✓`,
          audit
        };
      }

      return null;
    }

          state.extraAttempts = state.extraAttempts || {};
          state.extraAttempts[key] = { at: Date.now(), reason: attemptRule.extra.en };
          persist();
          render();
        };
      }

      if (correctBtn) {
        correctBtn.onclick = () => {
          const v = parseFloat(document.getElementById("inpCorrectVal").value);
          const fixedHist = correctLastEntry(history, v, Date.now());
          if (!fixedHist) return;
          const bestFixed = pickBest(test, fixedHist) || fixedHist[fixedHist.length - 1];
          state.results[key] = { ...bestFixed, attemptsHistory: fixedHist };
          render();
        };
      }
      const clearBtn = document.getElementById("btnClearAttempts");
      if (clearBtn) {
        clearBtn.onclick = () => {
          delete state.results[key];
          if (state.extraAttempts) delete state.extraAttempts[key];
          persist();
          render();

      }
      const btnCellUp = document.getElementById("btnCellUploadRef");

      }
      const btnCellClr = document.getElementById("btnCellClearRef");
      if (btnCellClr) {
        btnCellClr.onclick = () => {
          if (state.calib) delete state.calib.height;
          _autoStickyCalib = null;
          persist();
          render();
        };
      }
      const camBtn = document.getElementById("btnOpenCamera");
      if (camBtn) {
        camBtn.onclick = () => { state.route = "capture"; render(); };
      }
      const saveManualBtn = document.getElementById("btnSaveManual");
      if (saveManualBtn) saveManualBtn.onclick = () => {
        const val = parseFloat(document.getElementById("inpManualVal").value);
        if (isNaN(val)) return;
        const prevHist = state.results[key]?.attemptsHistory || [];
        if (isExhausted(test, prevHist, key)) {
          const msg = document.getElementById("attemptMsg");
          if (msg) msg.textContent = t(
            `All ${allowedAttempts(test, key)} attempt(s) are used. To fix a typing mistake in the last entry, use "Correct the last entry" below.`,
            `सभी ${allowedAttempts(test, key)} प्रयास पूरे हो चुके हैं। अंतिम प्रविष्टि की गलती सुधारने के लिए नीचे "अंतिम प्रविष्टि सुधारें" का उपयोग करें।`);
          return;
        }
        const entry = {
          valid: true,
          value: val,
          unit: test.unit,
          confidence: test.mode === "Manual" ? "GREEN" : "AMBER",
          method: test.mode === "Manual" ? "Assessor Protocol Entry" : "Rung 5 Manual Override",
          audit: [{ label: "Manual", detail: `Assessor entered ${val} ${test.unit}`, valid: true }]
        };
        // Store a plain copy in the history (the entry used to contain itself, which JSON.stringify cannot save),
        // and keep the score of record per the test's rule (best, not simply the last typed value).
        const newHist = [...prevHist, { ...entry }];
        const bestManual = pickBest(test, newHist) || entry;
        state.results[key] = { ...bestManual, attemptsHistory: newHist };
        state.route = "session";
        render();
      };
    }

    function openRefPhotoEditor(file, targetPanel, W0, H0, onSaved) {
      if (!file || !targetPanel) return;
      const url = URL.createObjectURL(file);
      const imgEl = new Image();
      imgEl.onload = async () => {
        const SW = 144, SH = 256;
        const off = document.createElement("canvas");
        off.width = SW; off.height = SH;
        const octx = off.getContext("2d", { willReadFrequently: true });
        octx.drawImage(imgEl, 0, 0, SW, SH);
        const buf = octx.getImageData(0, 0, SW, SH).data;
        let det = analyzeWallImageBuffer(buf, SW, SH, W0, H0, null, null);
        if (!det) {
          det = {
            topY: H0 * 0.20,
            botY: H0 * 0.28,
            leftX: W0 * 0.42,
            rightX: W0 * 0.58,
            noteH: H0 * 0.08,
            noteW: W0 * 0.16,
            cxNorm: 0.50,
            cyNorm: 0.24,
            noteHNorm: 0.08,
            noteWNorm: 0.16,
            markCm: state.lastWallMarkCm || 150.0,
            objSizeCm: 9.5,
            frameW: W0,
            frameH: H0
          };
        }

        targetPanel.style.display = "block";
        targetPanel.innerHTML = `
          <div style="font-weight:800;color:var(--primary);margin-bottom:6px;">
            📸 ${t("Reference Photo Setup (Saved automatically for all future attempts):", "संदर्भ फोटो सेटअप (सभी अगले प्रयासों के लिए स्वतः सहेजा जाएगा):")}
          </div>
          <div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;">
            <canvas id="refPhotoCanvas" width="180" height="320" style="width:140px;height:248px;border-radius:8px;border:2px solid var(--primary);cursor:crosshair;touch-action:none;"></canvas>
            <div style="flex:1;min-width:190px;">
              <div id="ocrStatusMsg" style="font-size:11px;font-weight:700;color:var(--green-fg,#137333);margin-bottom:6px;">
                🔍 ${t("Scanning reference mark & reading written height...", "निशान और लिखी हुई ऊँचाई पढ़ी जा रही है...")}
              </div>
              <label style="font-size:11px;font-weight:700;display:block;margin-bottom:3px;">${t("1. Reference Object / Marking Type:", "1. संदर्भ वस्तु / निशान का प्रकार:")}</label>
              <select id="selRefObjType" style="width:100%;padding:6px;border-radius:6px;border:1px solid var(--border);font-weight:700;margin-bottom:8px;">
                <option value="9.5" selected>📌 ${t("Sticky Note / Written Wall Mark (~8–10 cm)", "स्टिकी नोट / दीवार पर लिखा निशान")}</option>
                <option value="29.7">📄 ${t("A4 Sheet Portrait on Wall (29.7 cm tall)", "दीवार पर A4 शीट (29.7 सेमी)")}</option>
                <option value="21.0">📄 ${t("A4 Sheet Landscape on Wall (21.0 cm tall)", "A4 शीट लैंडस्केप (21.0 सेमी)")}</option>
                <option value="30.0">📏 ${t("30 cm Ruler / Scale on Wall", "30 सेमी स्केल / रूलर")}</option>
                <option value="15.0">📏 ${t("15 cm Small Scale on Wall", "15 सेमी छोटा स्केल")}</option>
              </select>
              <label style="font-size:11px;font-weight:700;display:block;margin-bottom:3px;">${t("2. Height Written on Mark / Wall (cm from floor):", "2. निशान की फ़र्श से ऊँचाई (cm):")}</label>
              <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;">
                <input id="inpPhotoMarkCm" type="number" step="0.5" value="${det.markCm || 150}" style="width:76px;padding:5px 6px;border-radius:6px;border:1px solid var(--border);font-weight:800;" />
                <button class="lang-btn" data-hpreset="100" style="font-size:10px;padding:3px 6px;">100 cm</button>
                <button class="lang-btn" data-hpreset="120" style="font-size:10px;padding:3px 6px;">120 cm</button>
                <button class="lang-btn" data-hpreset="140" style="font-size:10px;padding:3px 6px;">140 cm</button>
                <button class="lang-btn" data-hpreset="150" style="font-size:10px;padding:3px 6px;">150 cm</button>
                <button class="lang-btn" data-hpreset="160" style="font-size:10px;padding:3px 6px;">160 cm</button>
              </div>
              <button class="btn primary" id="btnLockRefPhoto" style="margin-top:4px;padding:8px 10px;">✅ ${t("Save & Keep Using This Reference", "सहेजें और इसी संदर्भ का उपयोग जारी रखें")}</button>
            </div>
          </div>
        `;

        const pCan = targetPanel.querySelector("#refPhotoCanvas");
        const pCtx = pCan.getContext("2d");

        function drawPreview() {
          pCtx.clearRect(0, 0, pCan.width, pCan.height);
          pCtx.drawImage(imgEl, 0, 0, pCan.width, pCan.height);
          const sx = pCan.width / W0, sy = pCan.height / H0;
          pCtx.strokeStyle = "#FFD166";
          pCtx.lineWidth = 2;
          pCtx.strokeRect(det.leftX * sx, det.topY * sy, (det.rightX - det.leftX) * sx, (det.botY - det.topY) * sy);
          pCtx.strokeStyle = "#00E6A8";
          pCtx.lineWidth = 3;
          pCtx.beginPath();
          pCtx.moveTo(0, det.topY * sy);
          pCtx.lineTo(pCan.width, det.topY * sy);
          pCtx.stroke();
          pCtx.fillStyle = "rgba(0,0,0,0.72)";
          pCtx.fillRect(4, Math.max(4, det.topY * sy - 20), pCan.width - 8, 18);
          pCtx.fillStyle = "#00E6A8";
          pCtx.font = "bold 11px -apple-system, sans-serif";
          const curCm = parseFloat(targetPanel.querySelector("#inpPhotoMarkCm")?.value) || det.markCm || 150;
          pCtx.fillText(`📌 ${curCm} cm MARK`, 8, Math.max(16, det.topY * sy - 7));
        }

        function applyPhotoCalib(closePanel) {
          drawPreview();
          const markCm = parseFloat(targetPanel.querySelector("#inpPhotoMarkCm")?.value) || 150.0;
          const objSizeCm = parseFloat(targetPanel.querySelector("#selRefObjType")?.value) || 9.5;
          state.lastWallMarkCm = markCm;
          const refLabel = `${markCm} cm (${objSizeCm === 29.7 ? "A4" : objSizeCm === 30 ? "Ruler" : "Wall Note/Mark"})`;
          let thumbDataUrl = state.calib?.height?.thumbDataUrl || "";
          try {
            const tCan = document.createElement("canvas");
            tCan.width = 90; tCan.height = 160;
            tCan.getContext("2d").drawImage(pCan, 0, 0, 90, 160);
            thumbDataUrl = tCan.toDataURL("image/jpeg", 0.68);
          } catch (_) {}
          const stationDistCm = (state.cameraDistanceM || 2.50) * 100.0;
          const vfovFactor = H0 >= W0 ? (34.61 / 25.4) : (25.96 / 25.4);
          const calibObj = {
            ...det,
            method: "sticky150",
            lockedFromPhoto: true,
            lockedFromLiveTap: false,
            thumbDataUrl,
            markCm,
            objSizeCm,
            refLabel,
            cmPerPx: (stationDistCm * vfovFactor) / H0,
            refCm: markCm,
            refPx: det.noteH,
            frameW: W0,
            frameH: H0,
            at: Date.now()
          };
          _autoStickyCalib = null;
          if (!state.calib) state.calib = {};
          state.calib.height = calibObj;
          persist();
          if (closePanel) {
            targetPanel.style.display = "none";
          }
          if (onSaved) onSaved(closePanel);
        }

        applyPhotoCalib(false);

        pCan.addEventListener("pointerdown", (ev) => {
          const r = pCan.getBoundingClientRect();
          const ny = Math.max(0.04, Math.min(0.85, (ev.clientY - r.top) / r.height));
          const nx = Math.max(0.10, Math.min(0.90, (ev.clientX - r.left) / r.width));
          det.topY = ny * H0;
          det.botY = Math.min(H0 - 10, det.topY + det.noteH);
          det.leftX = Math.max(10, nx * W0 - det.noteW / 2);
          det.rightX = Math.min(W0 - 10, det.leftX + det.noteW);
          det.cxNorm = nx;
          det.cyNorm = ny + (det.noteH / H0) * 0.45;
          applyPhotoCalib(false);
        });

        targetPanel.querySelectorAll("[data-hpreset]").forEach(b => {
          b.onclick = () => {
            targetPanel.querySelector("#inpPhotoMarkCm").value = b.dataset.hpreset;
            applyPhotoCalib(false);
          };
        });
        targetPanel.querySelector("#inpPhotoMarkCm").oninput = () => applyPhotoCalib(false);
        targetPanel.querySelector("#selRefObjType").onchange = () => applyPhotoCalib(false);
        targetPanel.querySelector("#btnLockRefPhoto").onclick = () => applyPhotoCalib(true);

        const ocrBox = {
          leftX: (det.leftX / W0) * imgEl.width,
          rightX: (det.rightX / W0) * imgEl.width,
          topY: (det.topY / H0) * imgEl.height,
          botY: (det.botY / H0) * imgEl.height
        };
        const ocrCm = await ocrReadHeightFromPhoto(imgEl, ocrBox, imgEl.width, imgEl.height);
        const ocrEl = targetPanel.querySelector("#ocrStatusMsg");
        if (ocrCm && ocrCm >= 50 && ocrCm <= 220) {
          const inp = targetPanel.querySelector("#inpPhotoMarkCm");
          if (inp) inp.value = String(ocrCm);
          if (ocrEl) ocrEl.textContent = `✅ ${t("Auto-read from photo:", "फोटो से स्वतः पढ़ा गया:")} ${ocrCm} cm — ${t("Saved for all attempts!", "सभी प्रयासों के लिए सहेजा गया!")}`;
          applyPhotoCalib(false);
        } else if (ocrEl) {
          ocrEl.textContent = `✅ ${t("Reference mark saved! Confirm height (e.g. 150 cm or 100 cm) below.", "संदर्भ निशान सहेजा गया! नीचे ऊँचाई की पुष्टि करें।")}`;
        }
      };
      imgEl.src = url;
    }

      function currentCalib() {

      function refreshCalStatus() {
        const el = document.getElementById("calStatus");
        if (!el) return;
        const c = state.calib?.[test.key];
        if (c && c.cmPerPx) {
          el.innerHTML = `✅ ${calibLabel(c)} · ${c.cmPerPx.toFixed(4)} cm/px (GREEN)`;
          el.style.color = "var(--green-fg, #137333)";

          el.innerHTML = `✅ ${t("Guided 2.50 m Floor-Zone Gate Active — keep heels in Green Zone (or Lock Wall / Tape)", "2.50 मी फ़र्श-ज़ोन गेट सक्रिय — एड़ी हरे ज़ोन में रखें")}`;
          el.style.color = "var(--primary)";
        } else {
          const hVal = state.results[cellKey(athlete.id, "height")]?.value;
          el.innerHTML = hVal
            ? `📏 Rung 3 Athlete Height Scale (${hVal} cm) Active`
            : `📏 Rung 3/4 Auto Kinematic Scale Active`;
          el.style.color = "var(--primary)";

        const savedTitle = document.getElementById("savedRefTitle");

          }
        }
      }

      function saveCalib(method, refCm, refPx) {
        if (!state.calib) state.calib = {};
        state.calib[test.key] = {
          cmPerPx: refCm / refPx,
          refCm,
          refPx,
          method,
          frameW: frameW || 720,
          frameH: frameH || 1280,
          at: Date.now()
        };
        persist();
        cal.mode = null;
        cal.pts = [];
        canvasEl.style.pointerEvents = "none";
        if (calPanel) calPanel.style.display = "none";
        refreshCalStatus();
      }

              : `A–B = ${refPx.toFixed(1)} px`}

          ${n === 2 ? `

              <button class="btn secondary" id="btnTapReset" style="margin-top:0;">${t("Re-tap", "फिर टैप करें")}</button>
            </div>

          document.getElementById("btnTapReset").onclick = () => { cal.pts = []; renderTapPanel(); };

      function renderWallPanel() {
        const n = cal.pts.length;
        calPanel.style.display = "block";
        calPanel.innerHTML = `

          cal.pts[cal.active].x += dx;
          cal.pts[cal.active].y += dy;
          renderWallPanel();
