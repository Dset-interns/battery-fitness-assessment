          while (j < reachingFrames.length && (reachingFrames[j].t - reachingFrames[i].t) < 450) j++;
          if (j >= reachingFrames.length) break;
          const win = r.slice(i, j + 1);
          const sp = Math.max(...win) - Math.min(...win);
          if (sp <= 2.5) {
            const v = median(win);
            if (v >= heldReach - 1.5) {
              heldReach = v;
            }
          }
        }

        const boxOffset = state.boxZeroCm !== undefined ? state.boxZeroCm : 23.0;
        const score = Math.max(0.0, boxOffset + heldReach);
        const minKnee = Math.min(minKneeAtPeak, minKneeDuringReach);
        const isCalib = !!calib && calib.method !== "distance";

        return {
          valid: true,
          value: Number(score.toFixed(1)),
          unit: "cm",
          confidence: isCalib ? "GREEN" : "AMBER",
          method: `${reachingFrames[0].scaleMode} · Held reach ${score.toFixed(1)} cm (${heldReach >= 0 ? "+" : ""}${heldReach.toFixed(1)} cm vs toes)`,
          audit: [{
            label: "Peak Held Reach",
            detail: `${score.toFixed(1)} cm (${heldReach >= 0 ? "+" : ""}${heldReach.toFixed(1)} cm vs toes) · Excursion ${excursion.toFixed(1)} cm · Trunk ${minTrunkAtPeak.toFixed(0)}° · Knee ≥${minKnee.toFixed(0)}° PASS`,
            valid: true
          }]
        };
      }

      // ---------------- TEST 4: VERTICAL JUMP ----------------
      // Whole-Body Coupled Ballistic Jump Detector:
      // Requires BOTH ankles, hips, and shoulders to rise simultaneously above their local upright standing baselines
      // and return to the same floor level. Standing still, toe-landmark flicker, walking back, or squatting = REJECTED.
      if (test.key === "vertical_jump") {
        const footSm = medianFilter(ok.map(f => f.footY), 3);
        const hipSm = medianFilter(ok.map(f => f.hipY), 3);
        const shSm = medianFilter(ok.map(f => f.shY), 3);
        const shFoot = median(ok.map(f => f.shToFootPx));

        const refHeightCm = getAthleteRefHeightCm(athlete);
        const shToFootCm = refHeightCm * 0.78;
        const cmPerPx = calib?.cmPerPx || (shToFootCm / shFoot);

        // Local running floor level (+/- 20 frames) so walking back/forward from camera is tracked smoothly
        const n = ok.length;
        const localFloor = footSm.map((_, i) => {
          const w = footSm.slice(Math.max(0, i - 20), Math.min(n, i + 21));
          return pct(w, 0.75);
        });

        // Minimum simultaneous ankle lift to enter airborne state: at least 3.2 cm above local floor
        const liftThrPx = Math.max(3.2 / cmPerPx, 0.026 * shFoot);

        // Find contiguous airborne intervals [sIdx .. eIdx] bounded by ground contact before AND after
        const candidates = [];
        let sIdx = -1;
        for (let i = 0; i < n; i++) {
          const isAir = footSm[i] < (localFloor[i] - liftThrPx);
          if (isAir && sIdx < 0) {
            sIdx = i;
          } else if ((!isAir || i === n - 1) && sIdx >= 0) {
            const eIdx = isAir ? i : (i - 1);
            const airFrames = eIdx - sIdx + 1;
            // Must be airborne for at least 2 consecutive frames and bounded by ground frames before & after
            if (airFrames >= 2 && sIdx >= 3 && eIdx <= n - 4) {
              const preFloor = median(footSm.slice(Math.max(0, sIdx - 8), sIdx));
              const postFloor = median(footSm.slice(eIdx + 1, Math.min(n, eIdx + 9)));
              const floorDiffCm = Math.abs(preFloor - postFloor) * cmPerPx;
              // Use the higher on-screen floor (smaller Y) of pre and post so stepping back NEVER creates artificial lift
              const floorY = Math.min(preFloor, postFloor);
              const meanFloorY = 0.5 * (preFloor + postFloor);

              // Grounded frames before takeoff and after landing:
              // Taking the 20th percentile of Y (highest upright position while grounded) automatically ignores
              // any pre-jump crouch or post-landing squat (which have larger Y) AND prevents step-back drift!
              const preGroundHips = [], preGroundShs = [];
              for (let k = Math.max(0, sIdx - 25); k < sIdx; k++) {
                if (Math.abs(footSm[k] - preFloor) <= liftThrPx * 1.1) {
                  preGroundHips.push(hipSm[k]);
                  preGroundShs.push(shSm[k]);
                }
              }
              const postGroundHips = [], postGroundShs = [];
              for (let k = eIdx + 1; k <= Math.min(n - 1, eIdx + 25); k++) {
                if (Math.abs(footSm[k] - postFloor) <= liftThrPx * 1.1) {
                  postGroundHips.push(hipSm[k]);
                  postGroundShs.push(shSm[k]);
                }
              }

              if (floorDiffCm <= 6.0 && preGroundHips.length >= 2 && postGroundHips.length >= 2) {
                const standingHipY = Math.min(pct(preGroundHips, 0.25), pct(postGroundHips, 0.25));
                const standingShY = Math.min(pct(preGroundShs, 0.25), pct(postGroundShs, 0.25));

                // Sub-frame linear interpolation for takeoff and landing timestamps
                const thrY = meanFloorY - liftThrPx;
                const y0 = footSm[sIdx - 1], y1 = footSm[sIdx];
                const fracTake = (y0 > y1) ? Math.max(0, Math.min(1, (y0 - thrY) / (y0 - y1))) : 0.5;
                const tTake = ok[sIdx - 1].t + fracTake * (ok[sIdx].t - ok[sIdx - 1].t);

                const y2 = footSm[eIdx], y3 = footSm[eIdx + 1];
                const fracLand = (y3 > y2) ? Math.max(0, Math.min(1, (thrY - y2) / (y3 - y2))) : 0.5;
                const tLand = ok[eIdx].t + fracLand * (ok[eIdx + 1].t - ok[eIdx].t);

                const dtAboveThrSec = (tLand - tTake) / 1000.0;
                const liftThrCm = liftThrPx * cmPerPx;
                const rawFlightCm = liftThrCm + 0.125 * 9.81 * dtAboveThrSec * dtAboveThrSec * 100.0;
                const flightSec = Math.sqrt(Math.max(0, (8.0 * (rawFlightCm / 100.0)) / 9.81));

                if (dtAboveThrSec >= 0.06 && flightSec <= 0.75) {
                  const rawFootWin = ok.slice(sIdx, eIdx + 1).map(f => f.footY);
                  const rawHipWin = ok.slice(sIdx, eIdx + 1).map(f => f.hipY);
                  const rawShWin = ok.slice(sIdx, eIdx + 1).map(f => f.shY);

                  const apexFootY = Math.min(...footSm.slice(sIdx, eIdx + 1), median(rawFootWin.slice().sort((a, b) => a - b).slice(0, 2)));
                  const apexHipY = Math.min(...hipSm.slice(sIdx, eIdx + 1), median(rawHipWin.slice().sort((a, b) => a - b).slice(0, 2)));
                  const apexShY = Math.min(...shSm.slice(sIdx, eIdx + 1), median(rawShWin.slice().sort((a, b) => a - b).slice(0, 2)));

                  const footClearanceCm = (floorY - apexFootY) * cmPerPx;
                  const hipRiseCm = (standingHipY - apexHipY) * cmPerPx;
                  const shRiseCm = (standingShY - apexShY) * cmPerPx;

                  // Rigid-Body Coupling Check:
                  // In a real jump, both ankles, hips, and shoulders ALL rise together by at least 3.5 cm
                  // above BOTH pre-jump and post-jump upright standing levels.
                  const coMRiseCm = 0.55 * hipRiseCm + 0.45 * shRiseCm;
                  const minBodyPartRiseCm = Math.min(footClearanceCm, hipRiseCm, shRiseCm);

                  if (minBodyPartRiseCm >= 3.5 && coMRiseCm >= 3.8 && footClearanceCm >= 3.8) {
                    const kinematicCm = Math.min(footClearanceCm * 1.08, coMRiseCm);
                    const boundedFlightCm = Math.min(rawFlightCm, kinematicCm * 1.12);
                    const jumpCm = 0.65 * kinematicCm + 0.35 * boundedFlightCm;

                    candidates.push({
                      jumpCm,
                      kinematicCm,
                      footClearanceCm,
                      hipRiseCm,
                      shRiseCm,
                      flightSec,
                      flightCm: rawFlightCm
                    });
                  }
                }
              }
            }
            sIdx = -1;
          }
        }

        if (!candidates.length) {
          return rejected(test, t("No vertical jump detected", "कोई वर्टिकल जंप नहीं मिली"),
            t("Stand still on your spot for 1s, jump straight up with both feet, and land on the same spot.", "एक स्थान पर 1 सेकंड स्थिर खड़े रहें, दोनों पैरों से सीधा ऊपर कूदें और उसी स्थान पर उतरें।"));
        }

        const best = candidates.reduce((a, b) => (b.jumpCm > a.jumpCm ? b : a), candidates[0]);
        return {
          valid: true,
          value: Number(best.jumpCm.toFixed(1)),
          unit: "cm",
          confidence: calib ? "GREEN" : "AMBER",
          method: `AI Ballistic Jump · Foot lift ${best.footClearanceCm.toFixed(1)} cm · CoM rise ${best.kinematicCm.toFixed(1)} cm · Flight ${(best.flightSec * 1000).toFixed(0)} ms`,
          audit: candidates.map((c, idx) => ({
            label: `Jump #${idx + 1}`,
            detail: `${c.jumpCm.toFixed(1)} cm (Ankles +${c.footClearanceCm.toFixed(1)} cm · Hips +${c.hipRiseCm.toFixed(1)} cm · Shoulders +${c.shRiseCm.toFixed(1)} cm · Airborne ${(c.flightSec * 1000).toFixed(0)} ms)`,
            valid: true
          }))
        };
      }

      // ---------------- TEST 5: STANDING BROAD JUMP ----------------
      if (test.key === "broad_jump") {
        const n = ok.length;
        const refHeightCm = getAthleteRefHeightCm(athlete);
        const medLegPx = median(ok.map(f => f.legLengthPx || 220));
        // Anatomical hip-to-ankle segment (femur + tibia) is 47.5% of total stature (Winter 2009)
        const cmPerPx = (calib && calib.cmPerPx) ? calib.cmPerPx : ((0.475 * refHeightCm) / Math.max(50, medLegPx));

        const ankXSm = medianFilter(ok.map(f => f.ankX), 3);
        const hipXSm = medianFilter(ok.map(f => f.hipX), 3);
        const footYSm = medianFilter(ok.map(f => f.footY), 3);
        const spreadXSm = medianFilter(ok.map(f => f.ankleSpreadX || 0), 3);
        const kneeSm = medianFilter(ok.map(f => f.kneeDeg || 170), 3);

        const startWin = Math.max(3, Math.min(10, Math.floor(n * 0.22)));
        const endWin = Math.max(3, Math.min(10, Math.floor(n * 0.22)));

        const startAnkX = median(ankXSm.slice(0, startWin));
        const endAnkX = median(ankXSm.slice(n - endWin));
        const startHipX = median(hipXSm.slice(0, startWin));
        const endHipX = median(hipXSm.slice(n - endWin));

        const ankTravelCm = Math.abs(endAnkX - startAnkX) * cmPerPx;
        const hipTravelCm = Math.abs(endHipX - startHipX) * cmPerPx;
        const maxRangeAnkCm = (pct(ankXSm, 0.95) - pct(ankXSm, 0.05)) * cmPerPx;
        const horizDispCm = Math.max(ankTravelCm, 0.88 * maxRangeAnkCm);

        // 1. Reject standing in place without jumping horizontally
        if (horizDispCm < 25.0 || hipTravelCm < 20.0) {
          return rejected(
            test,
            t(`REJECTED — No horizontal jump (${horizDispCm.toFixed(1)} cm < 25 cm)`, "अस्वीकृत — आगे की ओर कूद नहीं मिली"),
            t("Stand still on both feet, bend your knees, and jump forward horizontally across the frame.", "दोनों पैरों पर स्थिर खड़े हों, घुटने मोड़ें और आगे की ओर कूदें।")
          );
        }

        // 2. Check for two-foot takeoff & landing vs walking/stepping foul:
        // Find the peak horizontal velocity impulse window
        let peakVelCmPerSec = 0;
        let impulseIdx = Math.floor(n / 2);
        for (let i = 1; i < n; i++) {
          const dtSec = Math.max(0.016, (ok[i].t - ok[i - 1].t) / 1000.0);
          const v = (Math.abs(ankXSm[i] - ankXSm[i - 1]) * cmPerPx) / dtSec;
          if (v > peakVelCmPerSec) {
            peakVelCmPerSec = v;
            impulseIdx = i;
          }
        }

        const minKnee = Math.min(...kneeSm);
        const startSpreadCm = median(spreadXSm.slice(0, startWin)) * cmPerPx;
        const endSpreadCm = median(spreadXSm.slice(n - endWin)) * cmPerPx;
        const maxSpreadCm = pct(spreadXSm, 0.90) * cmPerPx;
        const baselineFootY = Math.max(median(footYSm.slice(0, startWin)), median(footYSm.slice(n - endWin)));
        const minFootY = Math.min(...footYSm);
        const verticalClearanceCm = Math.max(0, (baselineFootY - minFootY) * cmPerPx);

        // Walking foul check: if ankles separate widely (> 38 cm) without simultaneous vertical lift (< 2.0 cm) or knee countermovement
        if ((maxSpreadCm > 38.0 && verticalClearanceCm < 2.2) || endSpreadCm > 28.0 || peakVelCmPerSec < 55.0) {
          return rejected(
            test,
            t("FOUL — Walking / Single-foot step detected", "फाउल — चलना या एक पैर से कूदना अमान्य है"),
            t(`SAI Rule Foul: You must take off and land with BOTH feet together (foot separation ${maxSpreadCm.toFixed(0)} cm, vertical lift ${verticalClearanceCm.toFixed(1)} cm).`,
              `SAI नियम उल्लंघन: दोनों पैरों से एक साथ कूदें और दोनों पैरों पर उतरें।`)
          );
        }

        // True horizontal broad jump distance (blending ankle and hip horizontal travel for stability):
        const jumpCm = Math.max(25.0, Math.min(320.0, 0.65 * horizDispCm + 0.35 * hipTravelCm));

        return {
          valid: true,
          value: Number(jumpCm.toFixed(1)),
          unit: "cm",
          confidence: calib ? "GREEN" : "AMBER",
          method: `AI Horizontal Broad Jump · ${jumpCm.toFixed(1)} cm · Two-foot lift +${verticalClearanceCm.toFixed(1)} cm · Knee ${minKnee.toFixed(0)}°`,
          audit: [{
            label: "Standing Broad Jump",
            detail: `✅ Valid Two-Foot Jump: ${jumpCm.toFixed(1)} cm (Ankles ΔX ${horizDispCm.toFixed(1)} cm · Hips ΔX ${hipTravelCm.toFixed(1)} cm · Lift +${verticalClearanceCm.toFixed(1)} cm · Landing spread ${endSpreadCm.toFixed(1)} cm ✓)`,
            valid: true
          }]
        };
      }

      // ---------------- TEST 9: SIT-UPS ----------------
      if (test.key === "sit_ups") {
        const hipSm = medianFilter(ok.map(f => f.hipDeg), 3);
        const torsoSm = medianFilter(ok.map(f => f.torsoDeg ?? 45), 3);
        const kneeSm = medianFilter(ok.map(f => f.kneeDeg ?? 90), 3);

        const minHip = pct(hipSm, 0.05), maxHip = pct(hipSm, 0.95), hipRange = maxHip - minHip;
        const minTorso = pct(torsoSm, 0.08), maxTorso = pct(torsoSm, 0.92), torsoRange = maxTorso - minTorso;
        const medKnee = median(kneeSm);
        const straightKneeRatio = ok.filter((f, idx) => kneeSm[idx] > 120 || f.kneeBentOk === false).length / ok.length;

        // 1. Check Rule 2: Straight knees across the attempt
        if (medKnee > 120 || straightKneeRatio > 0.65) {
          return {
            valid: false, value: null, unit: "reps", confidence: "RED",
            method: t(`FOUL (Rule 2) — Knees straight (${medKnee.toFixed(0)}° > 120°)`, `फाउल (नियम 2) — घुटने सीधे हैं (${medKnee.toFixed(0)}° > 120°)`),
            audit: [{
              label: "Rule 2 Foul (Knees Straight)",
              detail: `Attempt rejected: Knees remained straight (${medKnee.toFixed(0)}° > 120° max allowed). You must bend your knees (~90°) with feet flat on the floor.`,
              valid: false
            }]
          };
        }

        // 2. Check Rule 1 & 3c: Swinging/rocking in an upright seated position without ever lying flat on back (torso <= 28°)
        if (minTorso > 28 || maxHip < 102) {
          return {
            valid: false, value: null, unit: "reps", confidence: "RED",
            method: t(`FOUL (Rule 1/3c) — Swinging upright without lying flat (min torso ${minTorso.toFixed(0)}° > 28°)`,
                      `फाउल — पीठ के बल सीधा लेटे बिना ऊपर ही झूलना (न्यूनतम धड़ ${minTorso.toFixed(0)}° > 28°)`),
            audit: [{
              label: "Upright Swinging Rejected",
              detail: `Attempt rejected: Athlete stayed upright (min torso angle ${minTorso.toFixed(0)}° above floor; must lie flat ≤28° with hip ≥104° between every rep).`,
              valid: false
            }]
          };
        }

        // 3. Check minimum range of motion (both hip flexion and torso elevation off floor)
        if (hipRange < 25 || torsoRange < 24) {
          return {
            valid: false, value: null, unit: "reps", confidence: "RED",
            method: t(`No sit-up curl cycle (Torso Δ${torsoRange.toFixed(0)}°, Hip Δ${hipRange.toFixed(0)}°)`, "सिट-अप गति नहीं मिली"),
            audit: [{
              label: "Insufficient Range of Motion",
              detail: `Torso lifted only ${torsoRange.toFixed(0)}° and hip flexed ${hipRange.toFixed(0)}° (requires ≥25° full curl from flat supine to knees and back).`,
              valid: false
            }]
          };
        }

        // State machine:
        // WAIT_SUPINE -> must first lie genuinely flat on back (torsoSm <= 28° AND hipSm >= 104°) to enter DOWN
        // DOWN        -> must curl torso up off the floor (torsoSm >= 46° AND hipSm <= 90°) to enter UP
        // UP          -> must return shoulder blades flat to the floor (torsoSm <= 28° AND hipSm >= 104°) to complete rep
        let phase = "WAIT_SUPINE";
        let down = [], up = [];
        const audit = [];
        let validReps = 0;

        for (let i = 0; i < ok.length; i++) {
          const hAng = hipSm[i], tAng = torsoSm[i], kAng = kneeSm[i];
          const f = { ...ok[i], hipSm: hAng, torsoSm: tAng, kneeSm: kAng };

          if (phase === "WAIT_SUPINE") {
            if (tAng <= 28 && hAng >= 104) {
              phase = "DOWN";
              down = [f];
            }
          } else if (phase === "DOWN") {
            down.push(f);
            if (tAng >= 46 && hAng <= 90) {
              phase = "UP";
              up = [f];
            }
          } else if (phase === "UP") {
            up.push(f);
            // Complete rep only when returning flat on back (Rule 3c: torso <= 28° and hip >= 104°)
            if (tAng <= 28 && hAng >= 104) {
              const repFrames = [...down, ...up];
              const ek = up.map(x => x.elbowKnee).filter(v => v !== null);
              const we = repFrames.map(x => x.wristEar).filter(v => v !== null);
              const repKnees = repFrames.map(x => x.kneeSm);
              const maxKneeInRep = pct(repKnees, 0.85);
              const straightFramesInRep = repFrames.filter(x => x.kneeSm > 120 || x.kneeBentOk === false).length;
              const minHipInUp = Math.min(...up.map(x => x.hipSm));
              const maxTorsoInUp = Math.max(...up.map(x => x.torsoSm));
              const minTorsoInDown = Math.min(...down.map(x => x.torsoSm));

              const fouls = [];
              if (maxKneeInRep > 120 || straightFramesInRep > repFrames.length * 0.30) {
                fouls.push(`Rule 2: knees straight (${maxKneeInRep.toFixed(0)}° > 120°)`);
              }
              if (maxTorsoInUp < 46 || (maxTorsoInUp - minTorsoInDown) < 24) {
                fouls.push(`Rule 3b: partial curl (torso ${maxTorsoInUp.toFixed(0)}° < 46°)`);
              }
              if (ek.length && Math.min(...ek) > 0.68) {
                fouls.push("Rule 3b: elbows did not reach knees");
              }
              if (we.length && median(we) > 0.85) {
                fouls.push("Rule 3a: hands unclasped from neck/head");
              }

              const repOk = fouls.length === 0;
              if (repOk) validReps++;
              audit.push({
                label: `Rep #${audit.length + 1}`,
                detail: repOk
                  ? `✅ Valid rep · Flat ${minTorsoInDown.toFixed(0)}° → Curl ${maxTorsoInUp.toFixed(0)}° (Hip ${minHipInUp.toFixed(0)}°, Knee ${median(repKnees).toFixed(0)}° ✓) → Flat ${tAng.toFixed(0)}°`
                  : `🚫 FOUL — ${fouls.join(" · ")}`,
                valid: repOk
              });
              phase = "DOWN";
              down = [f];
            }
          }
        }

        // If athlete curled up at the end and oscillated upright without returning flat to floor (Rule 3c violation):
        if (phase === "UP" && up.length >= 4) {
          const endTorso = up[up.length - 1].torsoSm;
          audit.push({
            label: `Rep #${audit.length + 1}`,
            detail: `🚫 FOUL — Rule 3c: Did not return flat to floor after curl (ended upright at torso ${endTorso.toFixed(0)}° > 28°)`,
            valid: false
          });
        }

        if (!audit.length || validReps === 0) {
          const firstFoul = audit.find(a => !a.valid)?.detail || "Complete a full supine (≤28°) → curl up to knees (≥46°) → supine (≤28°) cycle with knees bent (≤120°).";
          return {
            valid: false,
            value: null,
            unit: "reps",
            confidence: "RED",
            method: audit.length
              ? t(`REJECTED — 0/${audit.length} valid reps (Rule Foul)`, `अस्वीकृत — 0/${audit.length} मान्य सिट-अप (नियम उल्लंघन)`)
              : t("REJECTED — 0 complete sit-up cycles", "अस्वीकृत — 0 पूर्ण सिट-अप"),
            audit: audit.length ? audit : [{ label: "No valid reps", detail: firstFoul, valid: false }]
          };
        }

        return {
          valid: true,
          value: validReps,
          unit: "reps",
          confidence: "GREEN",
          method: `AI State Machine · ${validReps}/${audit.length} valid reps (Knee ${medKnee.toFixed(0)}° ✓)`,
          audit
        };
      }

      return null;
    }

    // =========================================================================
    // View Renderer
    // =========================================================================
    function render() {
      persist();
      const root = document.getElementById("app");
      if (state.route === "home") renderHome(root);
      else if (state.route === "athletes") renderAthletes(root);
      else if (state.route === "setup") renderSessionSetup(root);
      else if (state.route === "session") renderSession(root);
      else if (state.route === "cell") renderCell(root);
      else if (state.route === "capture") renderCapture(root);
      else if (state.route === "report") renderReport(root);
    }

      root.innerHTML = `

          <button class="lang-btn" id="toggleLang">${state.lang === "en" ? "हिन्दी" : "English"}</button>

          </div>

            <div class="num">${prog.done}/${prog.total}</div>
            <div class="lbl">${t("Assessments", "मूल्यांकन")}</div>
            <div class="sub">${t("Resume or view reports", "जारी रखें या रिपोर्ट देखें")}</div>
          </div>
        </div>

        <div class="section-title">${t("10-Test Battery Reference", "10-टेस्ट बैटरी संदर्भ")}</div>
        <div class="section-sub">${t("4 Measured on-device by AI; 3 AI Planned; 3 Manual entry.", "4 AI द्वारा मापे गए; 3 प्रस्तावित AI; 3 मैनुअल प्रविष्टि।")}</div>

    function openRefPhotoEditor(file, targetPanel, W0, H0, onSaved) {

        const SW = 144, SH = 256;
        const off = document.createElement("canvas");
        off.width = SW; off.height = SH;
        const octx = off.getContext("2d", { willReadFrequently: true });
        octx.drawImage(imgEl, 0, 0, SW, SH);
        const buf = octx.getImageData(0, 0, SW, SH).data;
        let det = analyzeWallImageBuffer(buf, SW, SH, W0, H0, null, null);

            topY: H0 * 0.20,
            botY: H0 * 0.28,
            leftX: W0 * 0.42,
            rightX: W0 * 0.58,

            noteW: W0 * 0.16,

            cyNorm: 0.24,
            noteHNorm: 0.08,
            noteWNorm: 0.16,
            markCm: state.lastWallMarkCm || 150.0,

        function drawPreview() {
          pCtx.clearRect(0, 0, pCan.width, pCan.height);
          pCtx.drawImage(imgEl, 0, 0, pCan.width, pCan.height);
          const sx = pCan.width / W0, sy = pCan.height / H0;
          pCtx.strokeStyle = "#FFD166";
          pCtx.lineWidth = 2;
          pCtx.strokeRect(det.leftX * sx, det.topY * sy, (det.rightX - det.leftX) * sx, (det.botY - det.topY) * sy);
          pCtx.strokeStyle = "#00E6A8";
          pCtx.lineWidth = 3;
          pCtx.beginPath();
          pCtx.moveTo(0, det.topY * sy);
          pCtx.lineTo(pCan.width, det.topY * sy);
          pCtx.stroke();
          pCtx.fillStyle = "rgba(0,0,0,0.72)";
          pCtx.fillRect(4, Math.max(4, det.topY * sy - 20), pCan.width - 8, 18);
          pCtx.fillStyle = "#00E6A8";
          pCtx.font = "bold 11px -apple-system, sans-serif";
          const curCm = parseFloat(targetPanel.querySelector("#inpPhotoMarkCm")?.value) || det.markCm || 150;
          pCtx.fillText(`📌 ${curCm} cm MARK`, 8, Math.max(16, det.topY * sy - 7));
        }

        function applyPhotoCalib(closePanel) {
          drawPreview();
          const markCm = parseFloat(targetPanel.querySelector("#inpPhotoMarkCm")?.value) || 150.0;

          const refLabel = `${markCm} cm (${objSizeCm === 29.7 ? "A4" : objSizeCm === 30 ? "Ruler" : "Wall Note/Mark"})`;
          let thumbDataUrl = state.calib?.height?.thumbDataUrl || "";
          try {
            const tCan = document.createElement("canvas");
            tCan.width = 90; tCan.height = 160;
            tCan.getContext("2d").drawImage(pCan, 0, 0, 90, 160);
            thumbDataUrl = tCan.toDataURL("image/jpeg", 0.68);
          } catch (_) {}
          const stationDistCm = (state.cameraDistanceM || 2.50) * 100.0;
          const vfovFactor = H0 >= W0 ? (34.61 / 25.4) : (25.96 / 25.4);
          const calibObj = {
            ...det,
            method: "sticky150",
            lockedFromPhoto: true,
            lockedFromLiveTap: false,
            thumbDataUrl,
            markCm,
            objSizeCm,
            refLabel,
            cmPerPx: (stationDistCm * vfovFactor) / H0,
            refCm: markCm,
            refPx: det.noteH,
            frameW: W0,
            frameH: H0,
            at: Date.now()
          };
          _autoStickyCalib = null;
          if (!state.calib) state.calib = {};
          state.calib.height = calibObj;
          persist();
          if (closePanel) {
            targetPanel.style.display = "none";
          }
          if (onSaved) onSaved(closePanel);
        }

        applyPhotoCalib(false);

        pCan.addEventListener("pointerdown", (ev) => {
          const r = pCan.getBoundingClientRect();
          const ny = Math.max(0.04, Math.min(0.85, (ev.clientY - r.top) / r.height));
          const nx = Math.max(0.10, Math.min(0.90, (ev.clientX - r.left) / r.width));
          det.topY = ny * H0;
          det.botY = Math.min(H0 - 10, det.topY + det.noteH);
          det.leftX = Math.max(10, nx * W0 - det.noteW / 2);
          det.rightX = Math.min(W0 - 10, det.leftX + det.noteW);
          det.cxNorm = nx;
          det.cyNorm = ny + (det.noteH / H0) * 0.45;
          applyPhotoCalib(false);
        });

        targetPanel.querySelectorAll("[data-hpreset]").forEach(b => {

        const ocrBox = {
          leftX: (det.leftX / W0) * imgEl.width,
          rightX: (det.rightX / W0) * imgEl.width,
          topY: (det.topY / H0) * imgEl.height,
          botY: (det.botY / H0) * imgEl.height
        };
        const ocrCm = await ocrReadHeightFromPhoto(imgEl, ocrBox, imgEl.width, imgEl.height);
        const ocrEl = targetPanel.querySelector("#ocrStatusMsg");
        if (ocrCm && ocrCm >= 50 && ocrCm <= 220) {

          if (inp) inp.value = String(ocrCm);
          if (ocrEl) ocrEl.textContent = `✅ ${t("Auto-read from photo:", "फोटो से स्वतः पढ़ा गया:")} ${ocrCm} cm — ${t("Saved for all attempts!", "सभी प्रयासों के लिए सहेजा गया!")}`;
          applyPhotoCalib(false);

        }
      };
      imgEl.src = url;
    }

      function renderWallPanel() {
        const n = cal.pts.length;
        calPanel.style.display = "block";
        calPanel.innerHTML = `
          <div style="font-weight:700;margin-bottom:4px;">
            ${n === 0 ? t("Tap on the TOP edge of your 150 cm sticky note on the wall (1 tap is enough — even if a table blocks the floor!).", "दीवार पर लगे 150 cm स्टिकी नोट के ऊपरी किनारे पर टैप करें (केवल 1 टैप पर्याप्त है)!")
              : n === 1 ? t("✅ 150 cm Sticky Note tapped! Click 'Lock 150 cm Sticky Note' below (or tap Floor too if visible).", "✅ 150 cm निशान चुना गया! नीचे '150 cm स्टिकी नोट लॉक करें' दबाएँ।")
              : t("Fine-tune the marks, enter values, then Save.", "दोनों निशान ठीक करें, मान डालें, फिर सहेजें।")}
          </div>
          ${n >= 1 ? `
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;">
              <label style="font-weight:700;">${t("Sticky note height on wall (cm)", "निशान की ऊँचाई (cm)")}</label>
              <input id="inpMarkCm" type="number" step="0.1" value="${state.lastWallMarkCm || 150}" style="width:70px;padding:4px 6px;border-radius:6px;border:1px solid var(--border);" />
              <button class="lang-btn" data-mv="0,-1" style="padding:3px 8px;">▲</button>
              <button class="lang-btn" data-mv="0,1" style="padding:3px 8px;">▼</button>
            </div>
            <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;">
              <button class="btn primary" id="btnSticky150Save" style="margin-top:0;">📌 ${t("Lock 150 cm Sticky Note (1-Tap GREEN)", "150 cm स्टिकी नोट लॉक करें")}</button>
              ${n === 2 ? `<button class="btn secondary" id="btnWallSave" style="margin-top:0;">${t("Lock 2-Point Wall+Floor", "दीवार+फ़र्श लॉक करें")}</button>` : ""}
              <button class="btn secondary" id="btnWallReset" style="margin-top:0;">${t("Re-tap", "फिर टैप करें")}</button>
            </div>
            <div id="wallMsg" style="margin-top:6px;font-weight:700;color:var(--red-fg,#B3261E);"></div>
          ` : ""}
        `;
        calPanel.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => {
          const [dx, dy] = b.dataset.mv.split(",").map(Number);
          cal.pts[cal.active].x += dx;
          cal.pts[cal.active].y += dy;
          renderWallPanel();
        });
        const stickyBtn = document.getElementById("btnSticky150Save");
        if (stickyBtn) {
          stickyBtn.onclick = () => {
            const markCm = parseFloat(document.getElementById("inpMarkCm").value) || 150.0;
            state.lastWallMarkCm = markCm;
            const W0 = frameW || 720, H0 = frameH || 1280;
            const topY = n === 1 ? cal.pts[0].y : Math.min(cal.pts[0].y, cal.pts[1].y);
            const noteH = n === 2 ? Math.abs(cal.pts[1].y - cal.pts[0].y) : null;
            const vfovF = H0 >= W0 ? (34.61 / 25.4) : (25.96 / 25.4);
            const cmPerPxOpt = ((state.cameraDistanceM || 2.50) * 100.0 * vfovF) / H0;
            _autoStickyCalib = { topY, botY: topY + (noteH || H0 * 0.04), leftX: cal.pts[0].x - 25, rightX: cal.pts[0].x + 25, noteH, markCm, liveDetected: true, lockedFromLiveTap: true, frameW: W0, frameH: H0 };
            if (!state.calib) state.calib = {};
            state.calib.height = {
              method: "sticky150",
              lockedFromLiveTap: true,
              lockedFromPhoto: false,
              liveDetected: true,
              topY,
              noteH,
              markCm,
              cmPerPx: cmPerPxOpt,
              refCm: markCm,
              refPx: H0 - topY,
              frameW: W0,
              frameH: H0,
              at: Date.now()
            };
            persist();
            cal.mode = null;
            cal.pts = [];
            canvasEl.style.pointerEvents = "none";
            calPanel.style.display = "none";
            refreshCalStatus();
          };
          document.getElementById("btnWallReset").onclick = () => { cal.pts = []; renderWallPanel(); };
        }
        const saveBtn = document.getElementById("btnWallSave");
        if (saveBtn) {
          saveBtn.onclick = () => {
            const markCm = parseFloat(document.getElementById("inpMarkCm").value) || 150.0;
            const yFloor = Math.max(cal.pts[0].y, cal.pts[1].y);
            const yMark = Math.min(cal.pts[0].y, cal.pts[1].y);
            const refPx = Math.max(20, yFloor - yMark);
            state.lastWallMarkCm = markCm;
            const W0 = frameW || 720, H0 = frameH || 1280;
            if (!state.calib) state.calib = {};
            state.calib.height = {
              method: "wall",
              yFloor, yMark, markCm, camHcm: 100,
              cmPerPx: markCm / refPx,
              refCm: markCm, refPx,
              frameW: W0,
              frameH: H0,
              at: Date.now()
            };
            persist();
            cal.mode = null;
            cal.pts = [];
            canvasEl.style.pointerEvents = "none";
            calPanel.style.display = "none";
            refreshCalStatus();
          };
        }
      }

      canvasEl.addEventListener("pointerdown", (e) => {
        if ((cal.mode !== "tap" && cal.mode !== "wall") || !frameW) return;
        const rect = canvasEl.getBoundingClientRect();
        const s = Math.min(rect.width / frameW, rect.height / frameH);
        const ox = (rect.width - frameW * s) / 2, oy = (rect.height - frameH * s) / 2;
        const x = (e.clientX - rect.left - ox) / s, y = (e.clientY - rect.top - oy) / s;
        if (x < 0 || y < 0 || x > frameW || y > frameH) return;
        if (cal.pts.length < 2) {
          cal.pts.push({ x, y });
          cal.active = cal.pts.length - 1;
        } else {
          const d0 = dist2D(cal.pts[0], { x, y }), d1 = dist2D(cal.pts[1], { x, y });
          cal.active = d0 <= d1 ? 0 : 1;
          cal.pts[cal.active] = { x, y };
        }
        if (cal.mode === "wall") renderWallPanel(); else renderTapPanel();
      });

      function renderPersonPanel() {
        calPanel.style.display = "block";
        calPanel.innerHTML = `
          <div style="margin-bottom:6px;">${t(
            "Stand at the floor mark and enter your known height (cm) to lock the exact pixel-to-cm scale at this distance:",
            "इस दूरी पर सटीक स्केल लॉक करने के लिए अपनी ज्ञात ऊँचाई (cm) दर्ज करें:")}</div>
          <div style="display:flex;gap:6px;align-items:center;">
            <input id="inpPersonCm" type="number" step="0.5" placeholder="e.g. 156" value="156" style="width:90px;padding:6px;border-radius:6px;border:1px solid var(--border);font-weight:700;" />
            <button class="btn primary" id="btnPersonLock" style="margin-top:0;padding:8px 12px;width:auto;">${t("Lock Scale at Current Pose", "वर्तमान पोज़ पर स्केल लॉक करें")}</button>
          </div>
          <div id="personMsg" style="margin-top:6px;font-weight:700;color:var(--primary);"></div>
        `;
        document.getElementById("btnPersonLock").onclick = () => {
          const cm = parseFloat(document.getElementById("inpPersonCm").value);
          if (!(cm >= 80 && cm <= 230)) return;
          if (latestValidEv && latestValidEv.bodyPx > 50) {
            saveCalib("person", cm, latestValidEv.bodyPx);
          } else {
            document.getElementById("personMsg").textContent = t(
              "Step into full-body view first so your VERTEX and HEELS are visible, then tap Lock Scale!",
              "पहले पूरे शरीर के साथ फ्रेम में खड़े हों, फिर लॉक करें!"
            );
          }
        };
      }

      function renderRefPhotoPanel(file) {
        openRefPhotoEditor(file, calPanel, frameW || 720, frameH || 1280, () => refreshCalStatus());
      }

      if (supportsCalib) {
        const btnUp = document.getElementById("btnUploadRefPhoto");
        const inpUp = document.getElementById("inpRefPhoto");
        if (btnUp && inpUp) {
          btnUp.onclick = () => inpUp.click();
          inpUp.onchange = (e) => {
            const f = e.target.files?.[0];
            if (f) renderRefPhotoPanel(f);
          };
        }
        const rngDist = document.getElementById("rngDist");
        if (rngDist) {
          rngDist.oninput = (e) => {
            state.cameraDistanceM = parseFloat(e.target.value);
            document.getElementById("lblDistVal").textContent = `${state.cameraDistanceM.toFixed(2)} m`;
            if (state.calib && state.calib.height && state.calib.height.method !== "wall" && state.calib.height.method !== "sticky150") delete state.calib.height;
            persist();
            refreshCalStatus();
          };
        }
        document.getElementById("btnCalTap").onclick = () => {
          cal.mode = "tap";
          cal.pts = [];
          canvasEl.style.pointerEvents = "auto";
          renderTapPanel();
        };
        const bw = document.getElementById("btnCalWall");
        if (bw) bw.onclick = () => {
          enableTiltSensor();
          cal.mode = "wall";
          cal.pts = [];
          canvasEl.style.pointerEvents = "auto";
          renderWallPanel();
        };
        const bp = document.getElementById("btnCalPerson");
        if (bp) bp.onclick = () => {
          cal.mode = "person";
          canvasEl.style.pointerEvents = "none";
          renderPersonPanel();
        };
        document.getElementById("btnCalClear").onclick = () => {
          if (state.calib) delete state.calib[test.key];
          _autoStickyCalib = null;
          state.cameraDistanceM = 2.50;
          const rd = document.getElementById("rngDist");
          if (rd) {
            rd.value = "2.50";
            document.getElementById("lblDistVal").textContent = "2.50 m";
          }
          persist();
          cal.mode = null;
          cal.pts = [];
          canvasEl.style.pointerEvents = "none";
          calPanel.style.display = "none";
          refreshCalStatus();
        };
        const bz = document.getElementById("inpBoxZero");
        if (bz) bz.oninput = (e) => { state.boxZeroCm = parseFloat(e.target.value) || 0; persist(); };
        refreshCalStatus();
      }

      let token = 0;
      let lastFrameTime = performance.now();
      let lastVideoTime = -1;
      const useRVFC = "requestVideoFrameCallback" in HTMLVideoElement.prototype;

      async function startStream() {
        stopCamera();
        token = captureToken;
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }
          });
          videoEl.srcObject = mediaStream;
          await videoEl.play();
        } catch (err) {
          hudLive.textContent = t("Camera blocked: open the https:// link in Safari and allow camera access.", "कैमरा ब्लॉक: Safari में https:// लिंक खोलें और अनुमति दें।");
          return;
        }
        try {
          await ensureMediaPipeLoaded();
          hudFps.textContent = t("Pose AI ready", "पोज़ AI तैयार");
        } catch (err) {
          hudLive.textContent = t("Could not load MediaPipe model — check internet on first load.", "MediaPipe मॉडल लोड नहीं हुआ — इंटरनेट जांचें।");
          return;
        }
        schedule();
      }

      function schedule() {
        if (token !== captureToken) return;
        if (useRVFC) videoEl.requestVideoFrameCallback(onFrame);
        else animFrameId = requestAnimationFrame((now) => onFrame(now, null));
      }

      function drawSkeleton(lm, color) {
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 3;
        const pairs = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[27,29],[27,31],[29,31],[24,26],[26,28],[28,30],[28,32],[30,32]];
        for (const [i, j] of pairs) {
          if (vis(lm, i, 0.35) && vis(lm, j, 0.35)) {
            ctx.beginPath();
            ctx.moveTo(lm[i].x * frameW, lm[i].y * frameH);
            ctx.lineTo(lm[j].x * frameW, lm[j].y * frameH);
            ctx.stroke();
          }
        }
        for (let i = 0; i < lm.length; i++) {
          if (vis(lm, i, 0.35)) {
            ctx.beginPath();
            ctx.arc(lm[i].x * frameW, lm[i].y * frameH, 4, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      let latestLiveEv = null;

      function drawMeasureOverlay(ev) {
        ctx.save();
        const fontMain = Math.max(16, Math.round(frameH * 0.018));
        ctx.font = `bold ${fontMain}px -apple-system, sans-serif`;
        if (test.key === "height") {
          if (ev.postureOk) {
            ctx.strokeStyle = "#00E5FF";
            ctx.fillStyle = "#00E5FF";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, ev.vertexY); ctx.lineTo(frameW, ev.vertexY);
            ctx.moveTo(0, ev.soleY); ctx.lineTo(frameW, ev.soleY);
            ctx.stroke();
            ctx.fillText(`▲ VERTEX (${ev.vertexSource})`, 14, Math.max(22, ev.vertexY - 8));
            ctx.fillText(`▼ ${ev.liveMetric}`, 14, Math.min(frameH - 10, ev.soleY + 24));

            if (isRecording) {
              const bw = Math.min(frameW - 24, 620);
              const bx = (frameW - bw) / 2;
              const by = Math.max(68, frameH * 0.08);
              ctx.fillStyle = "rgba(0, 180, 120, 0.88)";
              ctx.fillRect(bx, by, bw, Math.round(fontMain * 2.5));
              ctx.fillStyle = "#FFFFFF";
              ctx.textAlign = "center";
              ctx.fillText(ev.liveMetric, frameW / 2, by + Math.round(fontMain * 1.6));
              ctx.textAlign = "left";
            }
          } else {
            // Draw live RED error banner + heel guide on video so the person can adjust distance while recording!
            const bw = Math.min(frameW - 20, 660);
            const bh = Math.round(fontMain * 3.6);
            const bx = (frameW - bw) / 2;
            const by = Math.max(68, frameH * 0.08);
            ctx.fillStyle = "rgba(210, 25, 35, 0.92)";
            ctx.fillRect(bx, by, bw, bh);
            ctx.strokeStyle = "#FFFFFF";
            ctx.lineWidth = 2;
            ctx.strokeRect(bx, by, bw, bh);
            ctx.fillStyle = "#FFFFFF";
            ctx.textAlign = "center";
            ctx.font = `bold ${Math.round(fontMain * 1.1)}px -apple-system, sans-serif`;
            ctx.fillText(`🚫 BLOCKED: ${ev.liveMetric}`, frameW / 2, by + Math.round(fontMain * 1.45));
            ctx.font = `bold ${Math.round(fontMain * 0.85)}px -apple-system, sans-serif`;
            ctx.fillText(
              isRecording
                ? t("⏸ Recording PAUSED — Adjust position to continue!", "⏸ रिकॉर्डिंग रुकी है — जारी रखने के लिए स्थिति सुधारें!")
                : t("Stand next to your 150 cm sticky note (or place heels in Green Zone)!", "150 सेमी स्टिकी नोट के पास खड़े हों (या एड़ी हरे ज़ोन में रखें)!"),
              frameW / 2,
              by + Math.round(fontMain * 2.85)
            );
            ctx.textAlign = "left";

            if (typeof ev.soleY === "number") {
              const targetY = frameH * 0.795;
              ctx.strokeStyle = "#FF3B30";
              ctx.fillStyle = "#FF3B30";
              ctx.lineWidth = 4;
              ctx.beginPath();
              ctx.moveTo(0, ev.soleY); ctx.lineTo(frameW, ev.soleY);
              ctx.stroke();
              const distTxt = ev.estDistM ? ` (~${ev.estDistM.toFixed(2)} m)` : "";
              ctx.font = `bold ${fontMain}px -apple-system, sans-serif`;
              ctx.fillText(
                ev.soleY > targetY
                  ? `▼ YOUR HEELS${distTxt} — ⬆️ STEP BACK INTO GREEN ZONE!`
                  : `▼ YOUR HEELS${distTxt} — ⬇️ STEP CLOSER INTO GREEN ZONE!`,
                14,
                Math.min(frameH - 12, Math.max(30, ev.soleY - 10))
              );
            }
          }
        }
        if (test.key === "sit_and_reach" && ev.postureOk) {
          ctx.strokeStyle = "#FFD166";
          ctx.fillStyle = "#FFD166";
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(ev.toeX, ev.toeY, 7, 0, Math.PI * 2); ctx.stroke();
          ctx.beginPath(); ctx.arc(ev.tipX, ev.tipY, 7, 0, Math.PI * 2); ctx.fill();
          ctx.fillText("TOES (23 cm)", ev.toeX + 10, ev.toeY + 20);
          ctx.fillText(`REACH (${ev.scoreCm.toFixed(1)} cm)`, ev.tipX + 10, ev.tipY - 10);
        }
        if (test.key === "sit_ups" && ev.postureOk) {
          if (ev.kneeBentOk === false) {
            const bw = Math.min(frameW - 20, 660);
            const bh = Math.round(fontMain * 3.2);
            const bx = (frameW - bw) / 2;
            const by = Math.max(68, frameH * 0.08);
            ctx.fillStyle = "rgba(210, 25, 35, 0.92)";
            ctx.fillRect(bx, by, bw, bh);
            ctx.strokeStyle = "#FFFFFF";
            ctx.lineWidth = 2;
            ctx.strokeRect(bx, by, bw, bh);
            ctx.fillStyle = "#FFFFFF";
            ctx.textAlign = "center";
            ctx.font = `bold ${Math.round(fontMain * 1.05)}px -apple-system, sans-serif`;
            ctx.fillText(`🚫 FOUL (Rule 2): KNEES STRAIGHT (${ev.kneeDeg.toFixed(0)}° > 120°)`, frameW / 2, by + Math.round(fontMain * 1.35));
            ctx.font = `bold ${Math.round(fontMain * 0.85)}px -apple-system, sans-serif`;
            ctx.fillText(t("Bend your knees (~90°) with feet flat on the floor!", "घुटनों को (~90°) मोड़ें और पैर ज़मीन पर रखें!"), frameW / 2, by + Math.round(fontMain * 2.55));
            ctx.textAlign = "left";
          } else {
            ctx.fillStyle = ev.isSupineFlat ? "#00E6A8" : (ev.isCurledUp ? "#FFD166" : "#00E5FF");
            ctx.fillText(`Knee ${ev.kneeDeg.toFixed(0)}° ✓`, (ev.knX || 40) + 10, Math.max(28, (ev.knY || 80) - 10));
            ctx.fillText(`Torso ${ev.torsoDeg.toFixed(0)}°`, (ev.shX || 40) + 10, Math.max(28, (ev.shY || 80) - 10));
          }
        }
        ctx.restore();
      }

      function drawCalibOverlay() {
        const c = (cal.mode === "tap" || cal.mode === "wall") ? cal.pts : [];
        const wc = state.calib?.height;
        const liveSticky = (_autoStickyCalib && _autoStickyCalib.liveDetected)
          ? _autoStickyCalib
          : (wc && wc.method === "sticky150" && wc.lockedFromLiveTap ? wc : null);
        if (test.key === "height" && !cal.mode) {
          ctx.save();
          if (liveSticky && liveSticky.topY > 0) {
            const sy = frameH / (liveSticky.frameH || frameH);
            const sx = frameW / (liveSticky.frameW || frameW);
            const yM = liveSticky.topY * sy;
            if (liveSticky.leftX !== undefined && liveSticky.botY !== undefined) {
              ctx.strokeStyle = "#FFD166";
              ctx.lineWidth = 3;
              ctx.strokeRect(liveSticky.leftX * sx, yM, (liveSticky.rightX - liveSticky.leftX) * sx, (liveSticky.botY - liveSticky.topY) * sy);
            }
            ctx.setLineDash([10, 6]);
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#FFD166";
            ctx.beginPath(); ctx.moveTo(0, yM); ctx.lineTo(frameW, yM); ctx.stroke();
            ctx.fillStyle = "#FFD166";
            ctx.font = `bold ${Math.max(15, Math.round(frameH * 0.017))}px -apple-system, sans-serif`;
            ctx.fillText(`📌 ${(wc?.markCm || liveSticky.markCm || 150).toFixed(1)} cm WALL STICKY NOTE LOCKED`, 12, Math.max(24, yM - 8));
          } else if (wc && wc.method === "sticky150" && latestLiveEv && latestLiveEv.postureOk && latestLiveEv.cmPerPx > 0) {
            const markCm = Number(wc.markCm) || 150.0;
            const yM = latestLiveEv.vertexY + (latestLiveEv.cm - markCm) / latestLiveEv.cmPerPx;
            ctx.setLineDash([10, 6]);
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#FFD166";
            ctx.beginPath(); ctx.moveTo(0, yM); ctx.lineTo(frameW, yM); ctx.stroke();
            ctx.fillStyle = "#FFD166";
            ctx.font = `bold ${Math.max(15, Math.round(frameH * 0.017))}px -apple-system, sans-serif`;
            ctx.fillText(`📌 ${markCm.toFixed(1)} cm WALL REFERENCE LINE`, 12, Math.max(24, yM - 8));
          } else if (wc && wc.method === "wall") {
            const sy = frameH / (wc.frameH || frameH);
            ctx.setLineDash([10, 6]);
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#FFD166";
            ctx.beginPath(); ctx.moveTo(0, wc.yMark * sy); ctx.lineTo(frameW, wc.yMark * sy); ctx.stroke();
            ctx.fillStyle = "#FFD166";
            ctx.font = `bold ${Math.max(14, Math.round(frameH * 0.016))}px -apple-system, sans-serif`;
            ctx.fillText(`📌 ${wc.markCm} cm WALL MARK`, 10, Math.max(24, wc.yMark * sy - 6));
          } else if (!wc || wc.method === "distance") {
            const yTop = frameH * 0.735;
            const yBot = frameH * 0.855;
            ctx.fillStyle = "rgba(0, 230, 168, 0.14)";
            ctx.fillRect(0, yTop, frameW, yBot - yTop);
            ctx.setLineDash([8, 6]);
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#00E6A8";
            ctx.beginPath();
            ctx.moveTo(0, yTop); ctx.lineTo(frameW, yTop);
            ctx.moveTo(0, yBot); ctx.lineTo(frameW, yBot);
            ctx.stroke();
            ctx.fillStyle = "#00E6A8";
            ctx.font = `bold ${Math.max(14, Math.round(frameH * 0.016))}px -apple-system, sans-serif`;
            ctx.fillText(t("🎯 VALID HEEL ZONE — Or stick a 150 cm yellow note on the wall!", "🎯 मान्य एड़ी ज़ोन — या दीवार पर 150 सेमी पीला नोट लगाएँ!"), 12, yTop - 6);
          }
          ctx.restore();
        }
        if (!c.length) return;
        ctx.save();
        ctx.strokeStyle = "#FFD166";
        ctx.fillStyle = "#FFD166";
        ctx.lineWidth = 3;
        ctx.font = `bold ${Math.max(16, Math.round(frameH * 0.02))}px -apple-system, sans-serif`;
        c.forEach((pt, k) => {
          ctx.beginPath();
          ctx.moveTo(pt.x - 14, pt.y); ctx.lineTo(pt.x + 14, pt.y);
          ctx.moveTo(pt.x, pt.y - 14); ctx.lineTo(pt.x, pt.y + 14);
          ctx.stroke();
          ctx.fillText(k === 0 ? "A" : "B", pt.x + 10, pt.y - 8);
        });
        if (c.length === 2) {
          ctx.setLineDash([6, 4]);
          ctx.beginPath(); ctx.moveTo(c[0].x, c[0].y); ctx.lineTo(c[1].x, c[1].y); ctx.stroke();
        }
        ctx.restore();
      }

      function showEval(ev) {
        const isFoul = !ev.postureOk || ev.kneeBentOk === false || ev.kneeOk === false;
        hudFps.textContent = `${Math.round(fps)} fps · ${!isFoul ? t("POSE VALID", "पोज़ मान्य") : t("FOUL / GATE BLOCKED", "फाउल / गेट अवरुद्ध")}`;
        hudMetric.className = `hud-live-metric ${!isFoul ? "" : "bad"}`;
        hudMetricTitle.textContent = !isFoul ? t("LIVE AI READOUT:", "लाइव AI रीडआउट:") : t("🚫 FOUL / ADJUST POSITION:", "🚫 फाउल / स्थिति सुधारें:");
        hudMetricVal.textContent = ev.liveMetric;
        hudLive.textContent = ev.reason;
      }

      function onFrame(nowArg, meta) {
        if (token !== captureToken) return;
        const now = performance.now();
        const dt = (now - lastFrameTime) / 1000;
        lastFrameTime = now;
        if (dt > 0 && dt < 1) fps = 0.9 * fps + 0.1 * (1 / dt);

        const fresh = useRVFC || videoEl.currentTime !== lastVideoTime;
        if (videoEl.readyState >= 2 && poseLandmarker && fresh && videoEl.videoWidth) {
          lastVideoTime = videoEl.currentTime;
          const W = videoEl.videoWidth, H = videoEl.videoHeight;
          if (W !== frameW || H !== frameH) {
            frameW = W; frameH = H;
            canvasEl.width = W; canvasEl.height = H;
            refreshCalStatus();
          }
          ctx.clearRect(0, 0, W, H);
          const lvl = phoneLevel();
          hudTilt.textContent = lvl.known ? `${lvl.ok ? "✅" : "⚠️"} ${lvl.text}` : lvl.text;

          const tsMs = Math.max(lastMpTimestampMs + 1, Math.round(now));
          lastMpTimestampMs = tsMs;
          const tFrame = meta && meta.mediaTime ? meta.mediaTime * 1000 : now;
          let res = null;
          try {
            res = poseLandmarker.detectForVideo(videoEl, tsMs);
          } catch (err) {
            hudLive.textContent = `Pose AI error: ${err?.message || err}`;
          }
          if (res) {
            const masks = res.segmentationMasks || [];
            try {
              let ev;
              const people = res.landmarks || [];
              const mask = people.length ? maskReader(masks[0]) : null;
              const stickyNote = test.key === "height" ? detectWallStickyNote(videoEl, mask, W, H) : null;
              const secondVisible = people.length > 1 &&
                [0, 11, 12, 23, 24].reduce((s, i) => s + (people[1][i]?.visibility ?? 0), 0) / 5 > 0.55;
              if (!people.length) {
                ev = fail(
                  stickyNote
                    ? t("📌 150 cm Note Locked — Step into frame!", "📌 150 सेमी नोट लॉक — फ्रेम में आएँ!")
                    : t("NO PERSON — Step into frame", "कोई व्यक्ति नहीं — फ्रेम में आएँ"),
                  stickyNote
                    ? t("✅ 150.0 cm wall note detected! Stand next to the note so your head is visible.", "✅ 150.0 सेमी निशान मिल गया! नोट के पास खड़े हों।")
                    : t("Step into the frame (or point at your 150 cm yellow sticky note).", "फ्रेम में आएँ (या 150 सेमी पीले स्टिकी नोट की ओर कैमरा करें)।")
                );
                drawMeasureOverlay(ev);
              } else if (secondVisible) {
                ev = fail(t("Multiple people", "एक से अधिक व्यक्ति"), t("Only the athlete may be in the frame.", "फ्रेम में केवल एथलीट रहे।"));
                drawSkeleton(people[1], "#FF4D4F");
                drawMeasureOverlay(ev);
              } else {
                const lm = people[0];
                ev = evaluateLiveFrame(test.key, lm, mask, W, H, currentCalib(), athlete, stickyNote);
                if (ev.postureOk) latestValidEv = ev;
                const skelOk = ev.postureOk && ev.kneeBentOk !== false && ev.kneeOk !== false;
                drawSkeleton(lm, skelOk ? "#00E6A8" : "#FF4D4F");
                drawMeasureOverlay(ev);
              }
              latestLiveEv = ev;
              showEval(ev);
              if (isRecording) recordedFrames.push({ ...ev, t: tFrame });
            } catch (err) {
              hudLive.textContent = `Analysis error: ${err?.message || err}`;
            } finally {
              masks.forEach(m => { try { m.close(); } catch (_) {} });
            }
          }
          drawCalibOverlay();
        }
        schedule();
      }

      function finishRecording() {
        const calibUsed = currentCalib();
        stopCamera();
        const key = cellKey(athlete.id, test.key);
        const prevHistory = state.results[key]?.attemptsHistory || [];
        const attemptOut = computeAttemptResult(test, athlete, recordedFrames, fps, calibUsed);
        const newHistory = [...prevHistory, attemptOut];
        const validAttempts = newHistory.filter(a => a.valid && a.value !== null);
        if (validAttempts.length > 0) {
          const best = test.key === "height"
            ? validAttempts[validAttempts.length - 1]
            : validAttempts.reduce((b, c) => (c.value > b.value ? c : b), validAttempts[0]);
          state.results[key] = { ...best, attemptsHistory: newHistory };
        } else {
          state.results[key] = { ...attemptOut, attemptsHistory: newHistory };
        }
        state.route = "cell";
        render();
      }

      document.getElementById("btnCancelCam").onclick = () => {
        stopCamera();
        state.route = "cell";
        render();
      };
      document.getElementById("btnFlipCam").onclick = () => {
        facingMode = facingMode === "environment" ? "user" : "environment";
        startStream();
      };

      btnRec.onclick = () => {
        enableTiltSensor();
        if (!isRecording) {
          cal.mode = null;
          canvasEl.style.pointerEvents = "none";
          if (calPanel) calPanel.style.display = "none";
          isRecording = true;
          captureElapsed = 0;
          let validSec = 0;
          recordedFrames.length = 0;
          btnRec.disabled = true;
          btnRec.textContent = `${t("Recording...", "रिकॉर्डिंग...")} (${test.minSec}s min)`;
          captureTimer = setInterval(() => {
            captureElapsed++;
            const validCount = recordedFrames.filter(f => f.postureOk).length;
            if (test.key === "height") {
              const isCurrentlyValid = !!(latestLiveEv && latestLiveEv.postureOk);
              if (isCurrentlyValid) validSec++;
              hudTimer.textContent = isCurrentlyValid
                ? `✅ ${validSec}s / ${test.minSec}s (${validCount} ${t("valid frames", "मान्य फ्रेम")})`
                : `⏸ ${t("PAUSED — Adjust Distance", "रुका है — दूरी सुधारें")} (${validCount} ${t("valid", "मान्य")})`;
              if (captureElapsed >= 2) {
                btnRec.disabled = false;
              }
              if (!isCurrentlyValid) {
                btnRec.textContent = `🚫 ${latestLiveEv?.liveMetric || t("Adjust position into Green Zone", "हरे ज़ोन में आएँ")} (■ ${t("Stop", "रोकें")})`;
              } else if (validSec >= test.minSec && validCount >= 18) {
                finishRecording();
                return;
              } else {
                btnRec.textContent = `✅ ${t("Hold still...", "स्थिर रहें...")} (${Math.max(1, test.minSec - validSec)}s)`;
              }
              if (captureElapsed >= 20) finishRecording();
              return;
            }
            hudTimer.textContent = `${captureElapsed}s / ${test.minSec}–${test.maxSec}s (${validCount} ${t("valid", "मान्य")})`;
            if (captureElapsed >= test.minSec) {
              btnRec.disabled = false;
              btnRec.textContent = `■ ${t("Stop & Compute Score", "रोकें और स्कोर निकालें")} (${captureElapsed}s)`;
            } else {
              btnRec.textContent = `${t("Keep recording", "रिकॉर्डिंग जारी")} (${test.minSec - captureElapsed}s)`;
            }
            if (captureElapsed >= test.maxSec) finishRecording();
          }, 1000);
        } else {
          if (test.key !== "height" && captureElapsed < test.minSec) return;
          finishRecording();
        }
      };

      startStream();
    }

    function renderReport(root) {
      const athlete = state.athletes.find(a => a.id === state.selectedAthleteId) || state.athletes[0];
      root.innerHTML = `
        <div class="topbar">
          <button class="back-btn" id="btnBack">← ${t("Session", "सत्र")}</button>
          <div>
            <h1>${t("SAI Report Card", "SAI रिपोर्ट कार्ड")}</h1>
            <div class="sub">${athlete.name} · ${athlete.age}y (${athlete.gender})</div>
          </div>
          <span></span>
        </div>

        ${BATTERY_TESTS.map(test => {
          const r = state.results[cellKey(athlete.id, test.key)];
          return `
            <div class="test-row" data-test="${test.key}">
              <div class="left">
                <div class="idx">${test.number}</div>
                <div>
                  <div class="t-name">${state.lang === "hi" ? test.nameHi : test.nameEn}</div>
                  <div class="t-meta">${r ? r.method : t("Not recorded yet", "अभी दर्ज नहीं किया गया")}</div>
                </div>
              </div>
              <div>
                ${r && r.valid && r.value !== null
                  ? `<span class="badge ${r.confidence.toLowerCase()}">${r.value} ${r.unit}</span>`
                  : r && !r.valid
                  ? `<span class="badge red">REJECTED</span>`
                  : `<span class="badge manual">—</span>`}
              </div>
            </div>
          `;
        }).join("")}
      `;

      document.getElementById("btnBack").onclick = () => { state.route = "session"; render(); };
      root.querySelectorAll(".test-row").forEach(el => {
        el.onclick = () => {
          state.selectedTestKey = el.dataset.test;
          state.route = "cell";
          render();
        };
      });
    }

    render();
  </script>
</body>
</html>
